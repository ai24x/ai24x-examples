<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Screw Hero · 螺丝大师</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f172a; color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; }
  .hud { display:flex; gap:24px; font-size:14px; font-weight:700; color:#94a3b8; align-items:center; }
  .hud b { color:#fbbf24; font-size:18px; }
  #stage { width:100%; max-width:390px; aspect-ratio:390/700; position:relative; border-radius:20px; overflow:hidden; background:linear-gradient(180deg,#0b1220 0%,#1e293b 100%); border:2px solid #334155; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #tip { font-size:12px; color:#64748b; min-height:16px; }
  #overlay { position:fixed; inset:0; background:rgba(2,6,23,.9); display:none; align-items:center; justify-content:center; z-index:10; }
  #overlay.show { display:flex; }
  .panel { text-align:center; padding:28px 24px; border-radius:20px; background:#1e293b; border:1px solid #334155; max-width:320px; width:90%; }
  .panel h2 { font-size:22px; margin-bottom:4px; }
  .stars { font-size:34px; letter-spacing:6px; margin:6px 0 2px; }
  .time { font-size:40px; font-weight:800; color:#38bdf8; margin:4px 0; }
  .best { color:#94a3b8; font-size:14px; margin-bottom:10px; }
  .share { font-size:13px; color:#fbbf24; margin-bottom:16px; padding:8px 12px; background:#1e293b; border:1px dashed #475569; border-radius:10px; line-height:1.6; }
  .play { background:linear-gradient(90deg,#38bdf8,#6366f1); border:none; color:#fff; font-size:18px; font-weight:800; padding:13px 38px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.3); touch-action:manipulation; }
  .play:active { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .rank { font-size:12px; color:#94a3b8; margin-top:10px; line-height:1.7; }
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Screw Hero<span class="tg">拧螺丝解压</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>点击螺丝把它拧下来，木板上的零件就会掉落。收集完所有零件就过关！连续快速拧螺丝有连击加成，越快分越高。</div>
<div id="wrap">
  <div class="hud"><div>第 <b id="lv">1</b>/5 关</div><div>剩余 <b id="left">6</b></div><div>连击 <b id="combo">0</b></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tip">点击螺丝，拧下它！</div>
</div>

<div id="overlay">
  <div class="panel">
    <h2 id="ovT">🎉 过关！</h2>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <div class="time" id="secs">0.0 秒</div>
    <div class="best" id="bestLine">最佳 0.0 秒</div>
    <div class="share" id="shareTxt">我拧完木板只用了 0.0 秒，你能更快吗？</div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="play" id="restart" style="padding:13px 24px;font-size:15px;">再来一次</button>
      <button class="play" id="nextBtn" style="padding:13px 24px;font-size:15px;background:linear-gradient(90deg,#34d399,#22d3ee);">下一关</button>
    </div>
    <div class="rank" id="rankLine"></div>
  </div>
</div>

<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>
<div class="xz-cr">© AI24X Game Zone</div>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var stage=document.getElementById('stage'), lvEl=document.getElementById('lv'), leftEl=document.getElementById('left');
  var comboEl=document.getElementById('combo'), tip=document.getElementById('tip');
  var overlay=document.getElementById('overlay'), ovT=document.getElementById('ovT'), stars=document.getElementById('stars');
  var secsEl=document.getElementById('secs'), bestLine=document.getElementById('bestLine'), shareTxt=document.getElementById('shareTxt');
  var rankLine=document.getElementById('rankLine'), restart=document.getElementById('restart'), nextBtn=document.getElementById('nextBtn');

  var W=0,H=0,dpr=1;
  var LV=[], lv=0, screws=[], parts=[], falling=[], t0=0, running=false, combo=0, comboT=0, bestCombo=0;
  var BEST={}; try{ BEST=JSON.parse(localStorage.getItem('xz-screw-best')||'{}'); }catch(e){}
  var TIP_T='点击螺丝，拧下它！';

  // 关卡：零件显式绑定螺丝（pins 是螺丝数组下标），所有绑定螺丝拧掉后零件才掉落
  function makeLV(n){
    var defs=[
      { screws:[{x:1.6,y:1.1},{x:5.6,y:1.1},{x:1.6,y:3.2},{x:5.6,y:3.2}], parts:[{x:3.6,y:4.0,w:3.0,h:1.3,emoji:'🧸',pins:[0,1,2,3]}] },
      { screws:[{x:1.5,y:1.0},{x:3.6,y:1.0},{x:5.7,y:1.0},{x:1.5,y:3.0},{x:3.6,y:3.0},{x:5.7,y:3.0}], parts:[{x:2.5,y:4.1,w:2.2,h:1.2,emoji:'🍔',pins:[0,1,3,4]},{x:4.8,y:4.1,w:2.2,h:1.2,emoji:'🍟',pins:[1,2,4,5]}] },
      { screws:[{x:1.4,y:1.0},{x:3.6,y:1.0},{x:5.8,y:1.0},{x:2.5,y:2.8},{x:4.7,y:2.8},{x:1.4,y:4.5},{x:3.6,y:4.5},{x:5.8,y:4.5}], parts:[{x:2.5,y:3.8,w:2.2,h:1.2,emoji:'🎁',pins:[0,1,3,4]},{x:4.7,y:3.8,w:2.2,h:1.2,emoji:'🎈',pins:[1,2,4,5]},{x:3.6,y:5.7,w:2.2,h:1.1,emoji:'⚽',pins:[4,5,6,7]}] },
      { screws:[{x:1.2,y:1.0},{x:3.0,y:1.0},{x:4.8,y:1.0},{x:6.0,y:1.0},{x:1.2,y:2.9},{x:3.0,y:2.9},{x:4.8,y:2.9},{x:6.0,y:2.9},{x:2.1,y:4.6},{x:3.9,y:4.6},{x:5.7,y:4.6}], parts:[{x:2.1,y:3.9,w:1.8,h:1.1,emoji:'🎮',pins:[0,1,4,5]},{x:3.9,y:3.9,w:1.8,h:1.1,emoji:'📱',pins:[1,2,5,6]},{x:5.7,y:3.9,w:1.8,h:1.1,emoji:'💻',pins:[2,3,6,7]},{x:3.6,y:5.8,w:1.8,h:1.0,emoji:'🎧',pins:[7,8,9,10]}] },
      { screws:[{x:1.1,y:1.0},{x:2.5,y:1.0},{x:3.9,y:1.0},{x:5.3,y:1.0},{x:6.1,y:1.0},{x:1.1,y:2.7},{x:2.5,y:2.7},{x:3.9,y:2.7},{x:5.3,y:2.7},{x:6.1,y:2.7},{x:1.8,y:4.4},{x:3.3,y:4.4},{x:4.8,y:4.4}], parts:[{x:2.0,y:3.6,w:1.7,h:1.0,emoji:'🚗',pins:[0,1,5,6]},{x:3.6,y:3.6,w:1.7,h:1.0,emoji:'🚀',pins:[1,2,6,7]},{x:5.2,y:3.6,w:1.7,h:1.0,emoji:'🛸',pins:[3,4,8,9]},{x:2.6,y:5.6,w:1.7,h:1.0,emoji:'🐉',pins:[6,7,10,11]},{x:4.3,y:5.6,w:1.7,h:1.0,emoji:'👑',pins:[8,9,11,12]}] }
    ];
    var d=defs[n], G=W/7.2;
    var sc=[];
    d.screws.forEach(function(s){
      sc.push({ x:s.x*G, y:s.y*G, r:0.24*G, a:0, spinning:false, dead:false });
    });
    var pt=[];
    d.parts.forEach(function(p){
      pt.push({ x:p.x*G, y:p.y*G, w:p.w*G, h:p.h*G, emoji:p.emoji, pins:p.pins, free:false, vy:0, vx:0, rot:0, vr:0, landed:false });
    });
    return { screws:sc, parts:pt, total:pt.length };
  }

  function resize(){
    var rect=stage.getBoundingClientRect();
    dpr=window.devicePixelRatio||1;
    W=rect.width; H=rect.height;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  function loadLV(n){
    lv=n; lvEl.textContent=lv+1;
    var d=makeLV(n);
    screws=d.screws; parts=d.parts; falling=[]; combo=0; bestCombo=0; comboT=0;
    comboEl.textContent='0'; leftEl.textContent=d.total;
    tip.textContent=TIP_T;
  }

  function start(){
    loadLV(0); t0=Date.now(); running=true;
    overlay.classList.remove('show');
  }

  function nearestScrew(x,y){
    var best=null,bd=1e9;
    for(var i=0;i<screws.length;i++){
      var s=screws[i]; if(s.dead||s.spinning) continue;
      var dx=x-s.x, dy=y-s.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<s.r*1.6 && d<bd){ bd=d; best=s; }
    }
    return best;
  }

  function tap(x,y){
    if(!running) return;
    var s=nearestScrew(x,y);
    if(!s){ combo=0; comboEl.textContent='0'; tip.textContent='没点中螺丝，再来！'; return; }
    s.spinning=true;
    combo++; comboT=Date.now();
    if(combo>bestCombo) bestCombo=combo;
    comboEl.textContent=combo;
    tip.textContent=combo>=5?('🔥 连击 x'+combo+'！'):('连击 x'+combo);
    setTimeout(function(){
      s.dead=true;
      // 释放所有绑定螺丝已拧掉的零件
      for(var i=0;i<parts.length;i++){
        var p=parts[i];
        if(p.free||p.landed) continue;
        var allDead=p.pins.every(function(pi){ return screws[pi].dead; });
        if(allDead){ p.free=true; p.vy=-0.9; p.vx=(Math.random()-0.5)*1.4; p.vr=(Math.random()-0.5)*7; falling.push(p); }
      }
      checkDone();
    }, 160);
  }

  function update(){
    if(!running) return;
    if(comboT && Date.now()-comboT>1500){ combo=0; comboEl.textContent='0'; comboT=0; }
    for(var i=0;i<falling.length;i++){
      var p=falling[i];
      p.vy+=0.32; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=0.98; p.vr*=0.96;
      var ground=H-0.25*W/7.2;
      if(p.y>ground-p.h/2){
        p.y=ground-p.h/2; p.vy=0; p.vx=0; p.vr=0; p.landed=true;
      }
    }
    checkDone();
  }

  function checkDone(){
    var allLanded=parts.every(function(p){ return p.landed; });
    if(allLanded && running){
      running=false;
      var secs=((Date.now()-t0)/1000);
      win(secs);
    }
  }

  function win(secs){
    var done=lv+1, all=done>=LV.length;
    var key='l'+done;
    var prev=BEST[key];
    if(!prev||secs<prev){ BEST[key]=secs; try{ localStorage.setItem('xz-screw-best',JSON.stringify(BEST)); }catch(e){} }
    var best= BEST[key]!==undefined? BEST[key] : secs;
    var st= secs<=18?3 : secs<=30?2 : 1;
    var starsStr='⭐'.repeat(st)+'☆'.repeat(3-st);
    ovT.textContent= all? '🏆 全部通关！' : (st===3? '🌟 完美拆解！' : '🎉 过关！');
    stars.textContent=starsStr;
    secsEl.textContent=secs.toFixed(1)+' 秒';
    bestLine.textContent='最佳 '+best.toFixed(1)+' 秒'+(prev!==undefined&&prev<=secs?'':'（新纪录！）');
    shareTxt.textContent='第 '+done+' 关我只用 '+secs.toFixed(1)+' 秒就拆完，最高连击 x'+bestCombo+'，你能超过吗？';
    rankLine.textContent='关卡最佳：'+Object.keys(BEST).map(function(k){return '第'+k.slice(1)+'关 '+BEST[k].toFixed(1)+'s';}).join(' · ');
    nextBtn.style.display= all? 'none' : 'inline-block';
    nextBtn.textContent= all? '下一关' : '下一关';
    overlay.classList.add('show');
  }

  function draw(){
    ctx.fillStyle='#0b1220'; ctx.fillRect(0,0,W,H);
    var G=W/7.2;
    // 木板
    ctx.fillStyle='#3b2f1c'; ctx.fillRect(G*0.4, G*0.35, G*6.4, G*4.6);
    ctx.fillStyle='#5c4630'; ctx.fillRect(G*0.55, G*0.5, G*6.1, G*4.3);
    ctx.strokeStyle='rgba(251,191,36,.25)'; ctx.lineWidth=1;
    for(var gy=0; gy<5; gy++){ ctx.beginPath(); ctx.moveTo(G*0.5, G*(0.75+gy*0.9)); ctx.lineTo(G*6.7, G*(0.75+gy*0.9)); ctx.stroke(); }
    // 零件（固定中：画在木板上；掉落：自由）
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      if(p.free){ ctx.rotate(p.rot*Math.PI/180); ctx.globalAlpha=0.95; }
      ctx.fillStyle='#0f172a'; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.strokeStyle='#475569'; ctx.lineWidth=2; ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.font=Math.min(p.h*0.72,p.w*0.72)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.emoji, 0, p.h*0.04);
      ctx.restore();
    }
    // 螺丝
    for(var j=0;j<screws.length;j++){
      var s=screws[j]; if(s.dead) continue;
      if(s.spinning){ s.a+=0.55; }
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate(s.a);
      ctx.fillStyle='#94a3b8'; ctx.beginPath(); ctx.arc(0,0,s.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(0,0,s.r*0.72,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#475569'; ctx.lineWidth=s.r*0.22;
      ctx.beginPath(); ctx.moveTo(-s.r*0.55,0); ctx.lineTo(s.r*0.55,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s.r*0.55); ctx.lineTo(0,s.r*0.55); ctx.stroke();
      ctx.restore();
    }
    // 地面
    ctx.fillStyle='#1e293b'; ctx.fillRect(0, H-0.16*G, W, 0.16*G);
    ctx.fillStyle='#334155'; ctx.fillRect(0, H-0.16*G, W, 2);
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  window.__screwDebug = function(){ return { screws: screws.map(function(s){return {x:s.x,y:s.y,dead:s.dead,spin:s.spinning};}), parts: parts.map(function(p){return {x:p.x,y:p.y,free:p.free,landed:p.landed,pins:p.pins};}), running:running, falling:falling.length }; };

  stage.addEventListener('pointerdown', function(e){
    var r=stage.getBoundingClientRect();
    tap((e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H);
  });
  restart.addEventListener('click', function(){ start(); });
  nextBtn.addEventListener('click', function(){ loadLV(lv+1); t0=Date.now(); running=true; overlay.classList.remove('show'); });
  window.addEventListener('resize', resize);

  LV=[1,2,3,4,5];
  resize(); start(); loop();
})();
</script>
<script>
(function(){
  'use strict';
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top center';
    wrap.style.minHeight=(H*Math.max(s,1))+'px';
  }
  addEventListener('resize',fit); fit();
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    if(e.key==='F12'||(e.ctrlKey&&['s','u','p'].indexOf(e.key)!==-1)||(e.ctrlKey&&e.shiftKey&&['i','j','c'].indexOf(e.key)!==-1)) e.preventDefault();
  });
})();
</script>
</body>
</html>

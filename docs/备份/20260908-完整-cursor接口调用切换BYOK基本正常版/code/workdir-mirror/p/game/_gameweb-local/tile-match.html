<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tile Match · 记忆翻牌</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f172a; color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:20px 16px; }
  .hud { display:flex; gap:24px; font-size:15px; font-weight:700; color:#94a3b8; margin-bottom:6px; }
  .hud b { color:#fbbf24; }
  #msg { min-height:24px; font-size:14px; color:#38bdf8; font-weight:700; margin-bottom:8px; }
  #board { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; max-width:400px; aspect-ratio:1; }
  .card {
    background:linear-gradient(160deg,#334155,#1e293b); border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:clamp(26px,8vw,40px);
    border:2px solid #475569; transition: transform .15s, background .15s;
    touch-action:manipulation;
  }
  .card.flip { background:linear-gradient(160deg,#0ea5e9,#2563eb); border-color:#38bdf8; }
  .card.match { background:linear-gradient(160deg,#22c55e,#15803d); border-color:#4ade80; animation:pop .3s; }
  .card:active { transform: scale(.93); }
  @keyframes pop { 50% { transform:scale(1.12); } }
  #overlay { position:fixed; inset:0; background:rgba(2,6,23,.88); display:none; align-items:center; justify-content:center; z-index:10; }
  #overlay.show { display:flex; }
  .panel { text-align:center; padding:32px; border-radius:20px; background:#1e293b; border:1px solid #334155; max-width:320px; width:90%; }
  .panel h2 { font-size:24px; margin-bottom:6px; }
  .panel .score { font-size:40px; font-weight:800; color:#38bdf8; margin:10px 0; }
  .panel p { color:#94a3b8; font-size:14px; margin-bottom:18px; }
  .play { background:linear-gradient(90deg,#38bdf8,#6366f1); border:none; color:#fff; font-size:18px; font-weight:800; padding:14px 40px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.3); touch-action:manipulation; }
  .play:active { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .back { display:block; margin-top:14px; color:#64748b; font-size:13px; text-decoration:none; }
</style>
<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Tile Match<span class="tg">记忆翻牌</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>记住牌面位置，翻开两张配对，全部配对完成用时越短越好。</div>

<div id="wrap">
  <div class="hud"><div>步数 <b id="moves">0</b></div><div>配对 <b id="pairs">0</b> / 8</div></div>
  <div id="msg">翻开两张一样的卡！</div>
  <div id="board"></div>
</div>

<div id="overlay">
  <div class="panel">
    <h2>全部配对！</h2>
    <div class="score" id="finalScore">0</div>
    <p id="finalMsg">记忆大师就是你</p>
    <button class="play" id="restart">再来一局</button>
    <a class="back" href="index.html">← 返回列表</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var board=document.getElementById('board'), movesEl=document.getElementById('moves');
  var pairsEl=document.getElementById('pairs'), msgEl=document.getElementById('msg');
  var overlay=document.getElementById('overlay');
  var finalScore=document.getElementById('finalScore'), finalMsg=document.getElementById('finalMsg');
  var restart=document.getElementById('restart');

  // 8 组图标（原创组合）
  var ICONS=['🐼','🦊','🐸','🐙','🦄','🐝','🦉','🐳'];
  var cards=[], open=[], matched=0, moves=0, lock=false;

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }

  function build(){
    board.innerHTML=''; cards=[]; open=[]; matched=0; moves=0; lock=false;
    movesEl.textContent='0'; pairsEl.textContent='0';
    msgEl.textContent='翻开两张一样的卡！';
    var deck=shuffle(ICONS.concat(ICONS));
    deck.forEach(function(icon,i){
      var div=document.createElement('div');
      div.className='card'; div.dataset.icon=icon;
      div.addEventListener('pointerdown', function(e){ e.preventDefault(); tap(i); });
      board.appendChild(div);
      cards.push(div);
    });
  }

  function tap(i){
    if(lock || matched===ICONS.length) return;
    var c=cards[i];
    if(c.classList.contains('flip') || c.classList.contains('match')) return;
    moves++; movesEl.textContent=moves;
    c.classList.add('flip'); c.textContent=c.dataset.icon;
    open.push(i);
    if(open.length===2){
      lock=true;
      var a=cards[open[0]], b=cards[open[1]];
      if(a.dataset.icon===b.dataset.icon){
        a.classList.add('match'); b.classList.add('match');
        matched++; pairsEl.textContent=matched;
        open=[]; lock=false;
        if(matched===ICONS.length){
          msgEl.textContent='🎉 完成！';
          setTimeout(win, 400);
        } else {
          msgEl.textContent='配对成功！';
        }
      } else {
        msgEl.textContent='不一样，记住位置…';
        setTimeout(function(){
          a.classList.remove('flip'); a.textContent='';
          b.classList.remove('flip'); b.textContent='';
          open=[]; lock=false;
        }, 700);
      }
    }
  }

  function win(){
    finalScore.textContent=moves+' 步';
    var stars = moves<=12 ? '⭐⭐⭐ 完美！' : moves<=16 ? '⭐⭐ 很棒！' : '⭐ 完成啦';
    finalMsg.textContent=stars;
    overlay.classList.add('show');
  }

  restart.addEventListener('click', function(){ overlay.classList.remove('show'); build(); });
  build();
})();
</script>
<script>
(function(){
  'use strict';
  // --- 等比缩放：390x780 设计基准（上方 64px 顶部栏），其它屏幕自动等比 ---
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    var w=W*s,h=H*s;
    wrap.style.width=w+'px';
    wrap.style.height=h+'px';
    wrap.style.left=((innerWidth-w)/2)+'px';
    wrap.style.top=(TOP+(innerHeight-TOP-h)/2)+'px';
    wrap.style.position='fixed';
    wrap.style.margin='0';
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top left';
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  // 结算浮层提到顶部栏之上（面板里自带返回入口）
  var ov=document.getElementById('overlay');
  if(ov) ov.style.zIndex=60;
  // --- 玩法说明折叠 ---
  var hb=document.getElementById('howBtn'),ht=document.getElementById('howto');
  if(hb&&ht){
    hb.addEventListener('click',function(e){e.stopPropagation();ht.classList.toggle('show');});
    document.addEventListener('pointerdown',function(e){if(ht.classList.contains('show')&&!ht.contains(e.target)&&e.target!==hb)ht.classList.remove('show');});
  }
  // --- L1 防拷贝：禁右键 / 禁 F12 / 禁 Ctrl+S,U,P / 禁 Ctrl+Shift+I,J,C ---
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=e.key||'';
    if(k==='F12'||(e.ctrlKey&&['s','u','p','S','U','P'].indexOf(k)>=0)||(e.ctrlKey&&e.shiftKey&&['i','j','c','I','J','C'].indexOf(k)>=0)){e.preventDefault();e.stopPropagation();return false;}
  });
  // 长按防存图
  document.addEventListener('touchstart',function(){},false);
})();
</script>
<div class="xz-cr">© 2026 AI24X Game Zone</div>
</body>
</html>

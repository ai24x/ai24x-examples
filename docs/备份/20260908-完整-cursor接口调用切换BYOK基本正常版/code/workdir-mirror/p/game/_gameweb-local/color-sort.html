<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Color Sort · 颜色排序</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f172a; color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; }
  .hud { display:flex; gap:24px; font-size:15px; font-weight:700; color:#94a3b8; }
  .hud b { color:#fbbf24; font-size:18px; }
  #stage { width:100%; max-width:390px; aspect-ratio:390/540; position:relative; border-radius:20px; overflow:hidden; background:linear-gradient(180deg,#0b1220 0%,#1e293b 100%); border:2px solid #334155; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  .btns { display:flex; gap:14px; }
  .btn { background:#1e293b; color:#cbd5e1; border:1px solid #334155; border-radius:999px; padding:9px 24px; font-size:14px; font-weight:700; cursor:pointer; touch-action:manipulation; }
  .btn:active { background:#334155; }
  #toast { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-10px); background:#f59e0b; color:#0f172a; font-weight:800; font-size:14px; padding:10px 18px; border-radius:999px; opacity:0; transition:all .25s; z-index:40; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #overlay { position:fixed; inset:0; background:rgba(2,6,23,.9); display:none; align-items:center; justify-content:center; z-index:10; }
  #overlay.show { display:flex; }
  .panel { text-align:center; padding:30px 26px; border-radius:20px; background:#1e293b; border:1px solid #334155; max-width:320px; width:90%; }
  .panel h2 { font-size:22px; margin-bottom:6px; }
  .floors { font-size:40px; font-weight:800; color:#38bdf8; margin:6px 0; }
  .best { color:#94a3b8; font-size:14px; margin-bottom:14px; }
  .share { font-size:13px; color:#fbbf24; margin-bottom:16px; padding:8px 12px; background:#1e293b; border:1px dashed #475569; border-radius:10px; }
  .play { background:linear-gradient(90deg,#38bdf8,#6366f1); border:none; color:#fff; font-size:18px; font-weight:800; padding:13px 38px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.3); touch-action:manipulation; }
  .play:active { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .play.ghost { background:#1e293b; border:1px solid #334155; color:#94a3b8; font-size:14px; padding:10px 28px; margin-top:10px; }
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Color Sort<span class="tg">颜色排序</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>点试管拿起顶部颜色，再点目标试管倒进去；只能倒到同色液体上或空试管，每根最多 4 格。把同色归到一起就过关，共 5 关！</div>
<div id="wrap">
  <div class="hud"><div>关卡 <b id="lv">1/5</b></div><div>步数 <b id="mv">0</b></div><div>最佳 <b id="best">—</b></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="btns">
    <button class="btn" id="undoBtn">↩ 撤销</button>
    <button class="btn" id="resetBtn">↺ 重置</button>
  </div>
</div>
<div id="toast"></div>

<div id="overlay">
  <div class="panel">
    <h2 id="ovT">🎉 全部通关！</h2>
    <div class="floors" id="ovS">评级</div>
    <div class="best" id="bestLine">总步数 0 步 · 最佳 0 步</div>
    <div class="share" id="shareTxt">我用 0 步通关全部 5 关，你能更快吗？</div>
    <button class="play" id="restart">再来一次</button>
    <br><button class="play ghost" id="restartAll">从头开始</button>
  </div>
</div>

<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=390, H=540, DPR=Math.min(2, devicePixelRatio||1);
cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
var CAP=4, PAL=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316'];
var LV=[{c:4,e:2,mv:150},{c:5,e:2,mv:180},{c:5,e:1,mv:200},{c:6,e:2,mv:200},{c:6,e:1,mv:260}];
var TW=38, TH=280, CELL=TH/CAP, GX=12, BY=500;
var lvEl=document.getElementById('lv'), mvEl=document.getElementById('mv'), bestEl=document.getElementById('best');
var overlay=document.getElementById('overlay'), toastEl=document.getElementById('toast');
var ovS=document.getElementById('ovS'), bestLine=document.getElementById('bestLine'), shareTxt=document.getElementById('shareTxt');
var BEST=+localStorage.getItem('xz-cs-best')||0;
var tubes=[], selIdx=-1, history=[], levelMoves=[0,0,0,0,0], lv=1, busy=false, toastT=null;

function top(t){ return t.length? t[t.length-1] : -1; }
function canPour(s,d){
  if(!tubes[s].length||tubes[d].length>=CAP) return false;
  if(!tubes[d].length) return true;
  return top(tubes[d])===top(tubes[s]);
}
function doPour(s,d){
  var c=top(tubes[s]), n=0;
  while(tubes[s].length&&top(tubes[s])===c&&tubes[d].length<CAP){ tubes[d].push(tubes[s].pop()); n++; }
  return n;
}
function isSolved(){
  for(var i=0;i<tubes.length;i++){
    var t=tubes[i];
    if(!t.length) continue;
    if(t.length!==CAP) return false;
    for(var j=1;j<t.length;j++) if(t[j]!==t[0]) return false;
  }
  return true;
}
function anyLegal(){
  for(var s=0;s<tubes.length;s++) for(var d=0;d<tubes.length;d++) if(s!==d&&canPour(s,d)) return true;
  return false;
}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ toastEl.classList.remove('show'); },1400);
}
function totalMoves(){
  var n=0; for(var i=0;i<5;i++) n+=levelMoves[i]; return n;
}
function updateHUD(){
  lvEl.textContent=lv+'/5';
  mvEl.textContent=totalMoves();
  bestEl.textContent=BEST? BEST : '—';
}
function genLevel(){
  busy=true;
  var cfg=LV[lv-1], tries=0;
  do {
    tubes=[];
    for(var c=0;c<cfg.c;c++) tubes.push([c,c,c,c]);
    for(var e=0;e<cfg.e;e++) tubes.push([]);
    var m=0, guard=0;
    while(m<cfg.mv&&guard++<30000){
      var list=[];
      for(var s=0;s<tubes.length;s++) for(var d=0;d<tubes.length;d++) if(s!==d&&canPour(s,d)) list.push(s+','+d);
      if(!list.length) break;
      var mv=list[(Math.random()*list.length)|0].split(',');
      doPour(+mv[0],+mv[1]); m++;
    }
    tries++;
  } while(isSolved()&&tries<8);
  history=[]; levelMoves[lv-1]=0; selIdx=-1; busy=false;
  updateHUD();
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(148,163,184,.18)';
  for(var i=0;i<30;i++){ var bx=(i*131)%W, by=(i*71)%H; ctx.fillRect(bx,by,2,2); }
  var n=tubes.length, total=n*TW+(n-1)*GX, x0=(W-total)/2;
  for(i=0;i<n;i++){
    var x=x0+i*(TW+GX), t=tubes[i], sel=(i===selIdx), lift=sel?26:0;
    ctx.fillStyle='rgba(15,23,42,.55)';
    roundRect(x, BY-TH-lift, TW, TH, 10); ctx.fill();
    ctx.strokeStyle= sel? '#fbbf24' : '#475569';
    ctx.lineWidth= sel? 3 : 2;
    roundRect(x, BY-TH-lift, TW, TH, 10); ctx.stroke();
    for(var j=0;j<t.length;j++){
      var isTop=(j===t.length-1);
      if(sel&&isTop) continue;
      var ly=BY-(j+1)*CELL+3-lift;
      ctx.fillStyle=PAL[t[j]];
      roundRect(x+3, ly, TW-6, CELL-6, j===0?10:4); ctx.fill();
    }
    if(sel&&t.length){
      ctx.fillStyle=PAL[t[t.length-1]];
      roundRect(x+3, BY-t.length*CELL+3-52, TW-6, CELL-6, 10); ctx.fill();
      ctx.fillStyle='rgba(251,191,36,.18)';
      roundRect(x+3, BY-t.length*CELL+3-52, TW-6, CELL-6, 10); ctx.fill();
    }
  }
}
function loop(){ draw(); requestAnimationFrame(loop); }

function tubeAt(px,py){
  var n=tubes.length, total=n*TW+(n-1)*GX, x0=(W-total)/2;
  for(var i=0;i<n;i++){
    var x=x0+i*(TW+GX);
    if(px>=x-6&&px<=x+TW+6&&py>=BY-TH-30&&py<=BY+6) return i;
  }
  return -1;
}
function afterMove(){
  if(isSolved()){
    toast('🎉 第 '+lv+' 关完成！');
    if(lv<5){ busy=true; lv++; setTimeout(genLevel,800); }
    else { finishAll(); }
  } else if(!anyLegal()){
    toast('💡 卡住了？点「重置」换一局');
  }
}
function finishAll(){
  var total=totalMoves();
  if(!BEST||total<BEST){ BEST=total; localStorage.setItem('xz-cs-best',BEST); }
  var grade= total<=170?'🏆 S': total<=230?'🌟 A': total<=310?'👍 B':'😅 C';
  ovS.textContent=grade+' · '+total+' 步';
  bestLine.textContent='总步数 '+total+' 步 · 最佳 '+BEST+' 步';
  shareTxt.textContent='我用 '+total+' 步通关 Color Sort 全部 5 关（'+grade+'），你能更快吗？';
  updateHUD();
  overlay.classList.add('show');
}
function tap(px,py){
  if(busy||overlay.classList.contains('show')) return;
  var i=tubeAt(px,py);
  if(i<0){ selIdx=-1; return; }
  if(selIdx<0){ selIdx=i; return; }
  if(i===selIdx){ selIdx=-1; return; }
  if(canPour(selIdx,i)){
    var n=doPour(selIdx,i);
    history.push([selIdx,i,n]);
    levelMoves[lv-1]++;
    selIdx=-1;
    updateHUD();
    afterMove();
  } else { selIdx=i; }
}

var stage=document.getElementById('stage');
stage.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var r=stage.getBoundingClientRect();
  var px=(e.clientX-r.left)*W/r.width, py=(e.clientY-r.top)*H/r.height;
  tap(px,py);
});
document.getElementById('undoBtn').addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(busy||!history.length||overlay.classList.contains('show')) return;
  var h=history.pop();
  for(var i=0;i<h[2];i++) tubes[h[0]].push(tubes[h[1]].pop());
  levelMoves[lv-1]=Math.max(0,levelMoves[lv-1]-1);
  selIdx=-1; updateHUD();
});
document.getElementById('resetBtn').addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(busy) return;
  genLevel();
});
document.getElementById('restart').addEventListener('pointerdown',function(e){
  e.preventDefault();
  overlay.classList.remove('show'); genLevel();
});
document.getElementById('restartAll').addEventListener('pointerdown',function(e){
  e.preventDefault();
  overlay.classList.remove('show'); lv=1; genLevel();
});

genLevel();
loop();
})();
</script>
<script>
(function(){
  'use strict';
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    var w=W*s,h=H*s;
    wrap.style.width=w+'px';
    wrap.style.height=h+'px';
    wrap.style.left=((innerWidth-w)/2)+'px';
    wrap.style.top=(TOP+(innerHeight-TOP-h)/2)+'px';
    wrap.style.position='fixed';
    wrap.style.margin='0';
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top left';
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  var ov=document.getElementById('overlay');
  if(ov) ov.style.zIndex=60;
  var hb=document.getElementById('howBtn'),ht=document.getElementById('howto');
  if(hb&&ht){
    hb.addEventListener('click',function(e){e.stopPropagation();ht.classList.toggle('show');});
    document.addEventListener('pointerdown',function(e){if(ht.classList.contains('show')&&!ht.contains(e.target)&&e.target!==hb)ht.classList.remove('show');});
  }
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=e.key||'';
    if(k==='F12'||(e.ctrlKey&&['s','u','p','S','U','P'].indexOf(k)>=0)||(e.ctrlKey&&e.shiftKey&&['i','j','c','I','J','C'].indexOf(k)>=0)){e.preventDefault();e.stopPropagation();return false;}
  });
})();
</script>

</body>
</html>

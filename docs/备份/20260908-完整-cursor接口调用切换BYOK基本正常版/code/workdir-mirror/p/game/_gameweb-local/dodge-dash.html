<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dodge Dash · 躲避冲刺</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f172a; color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; }
  .hud { display:flex; gap:28px; font-size:15px; font-weight:700; color:#94a3b8; }
  .hud b { color:#fbbf24; font-size:18px; }
  #stage { width:100%; max-width:390px; aspect-ratio:390/560; position:relative; border-radius:20px; overflow:hidden; background:linear-gradient(180deg,#0b1220 0%,#1e293b 100%); border:2px solid #334155; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #tip { font-size:12px; color:#64748b; min-height:16px; }
  #overlay { position:fixed; inset:0; background:rgba(2,6,23,.9); display:none; align-items:center; justify-content:center; z-index:10; }
  #overlay.show { display:flex; }
  .panel { text-align:center; padding:30px 26px; border-radius:20px; background:#1e293b; border:1px solid #334155; max-width:320px; width:90%; }
  .panel h2 { font-size:22px; margin-bottom:6px; }
  .floors { font-size:46px; font-weight:800; color:#38bdf8; margin:6px 0; }
  .best { color:#94a3b8; font-size:14px; margin-bottom:14px; }
  .share { font-size:13px; color:#fbbf24; margin-bottom:16px; padding:8px 12px; background:#1e293b; border:1px dashed #475569; border-radius:10px; }
  .play { background:linear-gradient(90deg,#38bdf8,#6366f1); border:none; color:#fff; font-size:18px; font-weight:800; padding:13px 38px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.3); touch-action:manipulation; }
  .play:active { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Dodge Dash<span class="tg">躲避冲刺</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>按住屏幕左半/右半，让角色左右移动，躲避上方不断落下的障碍物。障碍会越来越快，坚持越久分越高，被砸中即结束！</div>
<div id="wrap">
  <div class="hud"><div>时间 <b id="tm">0.0</b></div><div>最佳 <b id="best">0.0</b></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tip">按住屏幕左半 / 右半控制左右移动</div>
</div>

<div id="overlay">
  <div class="panel">
    <h2>💥 被砸中了！</h2>
    <div class="floors" id="secs">0.0 秒</div>
    <div class="best" id="bestLine">最佳 0.0 秒</div>
    <div class="share" id="shareTxt">我坚持了 0.0 秒，你能躲多久？</div>
    <button class="play" id="restart">再来一次</button>
  </div>
</div>

<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=390, H=560, DPR=Math.min(2, devicePixelRatio||1);
cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
var tmEl=document.getElementById('tm'), bestEl=document.getElementById('best');
var overlay=document.getElementById('overlay'), tip=document.getElementById('tip');
var secsEl=document.getElementById('secs'), bestLine=document.getElementById('bestLine'), shareTxt=document.getElementById('shareTxt');
var BEST=parseFloat(localStorage.getItem('xz-dd-best'))||0;
bestEl.textContent=BEST.toFixed(1);
var P={x:W/2,y:H-84,w:44,h:44};
var obs=[], t=0, spawnT=0, state='cd', cdT=0.99, last=0;
var leftP={}, rightP={}, OCOL=['#ef4444','#f97316','#eab308'];

function reset(){
  obs=[]; t=0; spawnT=0; state='cd'; cdT=0.99;
  P.x=W/2; leftP={}; rightP={};
  tmEl.textContent='0.0';
  tip.textContent='按住屏幕左半 / 右半控制左右移动';
  overlay.classList.remove('show');
}
function sideCount(s){ var n=0; for(var k in s) if(s[k]) n++; return n; }
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function collide(o){
  var m=5;
  return P.x+P.w/2-m>o.x && P.x-P.w/2+m<o.x+o.w && P.y+m<o.y+o.h && P.y+P.h-m>o.y;
}
function update(dt){
  if(state==='cd'){
    cdT-=dt;
    if(cdT<=0) state='play';
    return;
  }
  if(state!=='play') return;
  t+=dt;
  var dir=(sideCount(rightP)>0?1:0)-(sideCount(leftP)>0?1:0);
  P.x+=dir*340*dt;
  if(P.x<P.w/2) P.x=P.w/2;
  if(P.x>W-P.w/2) P.x=W-P.w/2;
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=Math.max(0.34, 0.85-t*0.045);
    var ow=26+Math.random()*30, oh=26+Math.random()*30;
    obs.push({x:Math.random()*(W-ow), y:-oh, w:ow, h:oh, c:(Math.random()*OCOL.length)|0});
  }
  var vy=220+t*15;
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];
    o.y+=vy*dt;
    if(o.y>H) obs.splice(i,1);
    else if(collide(o)){ gameOver(); return; }
  }
  tmEl.textContent=t.toFixed(1);
}
function gameOver(){
  state='over';
  var s=t;
  if(s>BEST){ BEST=s; localStorage.setItem('xz-dd-best',s.toFixed(1)); }
  bestEl.textContent=BEST.toFixed(1);
  var grade= s>=45?'🏆 闪避大师': s>=25?'🔥 高手': s>=12?'👍 不错':'😅 新手';
  secsEl.textContent=s.toFixed(1)+' 秒';
  bestLine.textContent='最佳 '+BEST.toFixed(1)+' 秒';
  shareTxt.textContent='我在 Dodge Dash 坚持了 '+s.toFixed(1)+' 秒（'+grade+'），你能躲多久？';
  overlay.classList.add('show');
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 移动速度线
  var yoff=(t*320)%H;
  ctx.fillStyle='rgba(148,163,184,.16)';
  for(var i=0;i<8;i++){ ctx.fillRect((i*137)%W, (i*110+yoff)%H, 3, 24); }
  // 障碍
  for(i=0;i<obs.length;i++){
    var o=obs[i];
    ctx.fillStyle=OCOL[o.c];
    roundRect(o.x,o.y,o.w,o.h,6); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.fillRect(o.x,o.y,o.w,5);
  }
  // 角色
  ctx.fillStyle='#38bdf8';
  roundRect(P.x-P.w/2,P.y,P.w,P.h,10); ctx.fill();
  ctx.fillStyle='#0f172a';
  ctx.fillRect(P.x-8,P.y+12,6,6);
  ctx.fillRect(P.x+2,P.y+12,6,6);
  // 倒计时
  if(state==='cd'){
    ctx.fillStyle='rgba(2,6,23,.55)';
    ctx.fillRect(0,0,W,H);
    var d=Math.ceil(cdT/0.33);
    ctx.fillStyle='#fbbf24';
    ctx.font='bold 90px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(d,W/2,H/2);
  }
}
function loop(now){
  if(!last) last=now;
  var dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

var stage=document.getElementById('stage');
stage.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width;
  if(x<W/2) leftP[e.pointerId]=1; else rightP[e.pointerId]=1;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove',function(e){
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width;
  delete leftP[e.pointerId]; delete rightP[e.pointerId];
  if(x<W/2) leftP[e.pointerId]=1; else rightP[e.pointerId]=1;
});
window.addEventListener('pointerup',function(e){ delete leftP[e.pointerId]; delete rightP[e.pointerId]; });
window.addEventListener('pointercancel',function(e){ delete leftP[e.pointerId]; delete rightP[e.pointerId]; });
document.getElementById('restart').addEventListener('pointerdown',function(e){
  e.preventDefault();
  reset();
});

reset();
requestAnimationFrame(loop);
})();
</script>
<script>
(function(){
  'use strict';
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    var w=W*s,h=H*s;
    wrap.style.width=w+'px';
    wrap.style.height=h+'px';
    wrap.style.left=((innerWidth-w)/2)+'px';
    wrap.style.top=(TOP+(innerHeight-TOP-h)/2)+'px';
    wrap.style.position='fixed';
    wrap.style.margin='0';
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top left';
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  var ov=document.getElementById('overlay');
  if(ov) ov.style.zIndex=60;
  var hb=document.getElementById('howBtn'),ht=document.getElementById('howto');
  if(hb&&ht){
    hb.addEventListener('click',function(e){e.stopPropagation();ht.classList.toggle('show');});
    document.addEventListener('pointerdown',function(e){if(ht.classList.contains('show')&&!ht.contains(e.target)&&e.target!==hb)ht.classList.remove('show');});
  }
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=e.key||'';
    if(k==='F12'||(e.ctrlKey&&['s','u','p','S','U','P'].indexOf(k)>=0)||(e.ctrlKey&&e.shiftKey&&['i','j','c','I','J','C'].indexOf(k)>=0)){e.preventDefault();e.stopPropagation();return false;}
  });
})();
</script>
<div class="xz-cr">© 2026 AI24X Game Zone</div>
</body>
</html>

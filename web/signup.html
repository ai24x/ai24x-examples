<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - AI24X</title>
    
    <!-- 统一CSS文件（与首页完全一致） -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header-unified.css">
    <link rel="stylesheet" href="header-fix.css">
    <link rel="stylesheet" href="spacing-unified.css">
    <link rel="stylesheet" href="mobile-fix.css">
    <link rel="stylesheet" href="font-awesome-local.css">
    <link rel="stylesheet" href="fonts-local.css">
    <link rel="stylesheet" href="/css/auth.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <style>
        /* 使用系统字体替代Google Fonts */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
    </style>
</head>
<body>
    <!-- 头部导航区域 -->
    <!-- 统一头部导航（与首页完全一致） -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="/">
                        <i class="fas fa-robot"></i>
                        <span>AI24X</span>
                    </a>
                </div>
                
                <nav class="main-nav">
                    <ul>
                        <li><a href="/" class="nav-link"><i class="fas fa-home"></i> <span class="nav-text">首页</span></a></li>
                        <li><a href="/tools" class="nav-link"><i class="fas fa-tools"></i> <span class="nav-text">AI工具库</span></a></li>
                        <li><a href="/rankings" class="nav-link"><i class="fas fa-chart-bar"></i> <span class="nav-text">实时排行</span></a></li>
                        <li><a href="/tutorials" class="nav-link"><i class="fas fa-chart-line"></i> <span class="nav-text">热门教程</span></a></li>
                        <li><a href="/custom" class="nav-link"><i class="fas fa-cogs"></i> <span class="nav-text">定制开发</span></a></li>
                    </ul>
                </nav>
                
                <div class="header-actions">
                    <div class="auth-buttons">
                        <a href="/login" class="btn btn-outline"><i class="fas fa-sign-in-alt"></i> 登录</a>
                        <a href="/signup" class="btn btn-primary"><i class="fas fa-user-plus"></i> 注册</a>
                    </div>
                    <button class="mobile-menu-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="auth-main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">加入AI24X</h1>
                        <p class="auth-subtitle">创建您的账户，开始探索AI世界</p>
                    </div>
                    
                    <form id="signupForm" class="auth-form">
                        <div class="form-group">
                            <label for="username" class="form-label">用户名</label>
                            <div class="input-group">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名（3-20个字符）" required>
                            </div>
                            <div class="error-message" id="usernameError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">邮箱地址</label>
                            <div class="input-group">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" id="email" name="email" class="form-input" placeholder="请输入您的邮箱" required>
                            </div>
                            <div class="error-message" id="emailError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">密码</label>
                            <div class="input-group">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码（至少8个字符）" required>
                                <button type="button" class="password-toggle" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="strength-bar" id="strengthBar"></div>
                                <span class="strength-text" id="strengthText">密码强度</span>
                            </div>
                            <div class="error-message" id="passwordError"></div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">确认密码</label>
                            <div class="input-group">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="请再次输入密码" required>
                                <button type="button" class="password-toggle" id="toggleConfirmPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="error-message" id="confirmPasswordError"></div>
                        </div>
                        
                        <div class="form-group">
                            <div class="terms-group">
                                <input type="checkbox" id="terms" class="terms-checkbox" required>
                                <label for="terms" class="terms-text">
                                    我已阅读并同意 <a href="/terms">服务条款</a> 和 <a href="/privacy">隐私政策</a>，并确认我已年满18岁
                                </label>
                            </div>
                        </div>
                        
                        <button type="submit" class="auth-button primary-button">
                            <i class="fas fa-user-plus"></i>
                            创建账户
                        </button>
                        
                        <div class="success-message" id="successMessage"></div>
                    </form>
                    
                    <div class="auth-divider">
                        <span>或使用以下方式注册</span>
                    </div>
                    
                    <div class="social-auth">
                        <button type="button" class="social-button google-button">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                        <button type="button" class="social-button github-button">
                            <i class="fab fa-github"></i>
                            GitHub
                        </button>
                    </div>
                    
                    <div class="auth-footer">
                        已有账户？ <a href="/login">立即登录</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 统一底部 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">
                        <i class="fas fa-robot"></i>
                        <span>AI24X</span>
                    </div>
                    <p class="footer-description">
                        聚焦人工智能产业，帮助优秀AI项目实现24小时不间断的价值创造
                    </p>
                </div>
                <div class="footer-section">
                    <h3>快速链接</h3>
                    <ul class="footer-links">
                        <li><a href="/">首页</a></li>
                        <li><a href="/tools">AI工具库</a></li>
                        <li><a href="/tutorials">热门教程</a></li>
                        <li><a href="/custom">定制开发</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>支持</h3>
                    <ul class="footer-links">
                        <li><a href="/help">帮助中心</a></li>
                        <li><a href="/contact">联系我们</a></li>
                        <li><a href="/privacy">隐私政策</a></li>
                        <li><a href="/terms">服务条款</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>关注我们</h3>
                    <div class="social-links">
                        <a href="#" class="social-link"><i class="fab fa-weibo"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-weixin"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-github"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AI24X. 保留所有权利</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // 密码显示/隐藏切换
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                confirmPasswordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
        
        // 密码强度检测
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const strengthLabels = ['极弱', '弱', '中等', '强', '极强'];
            const strengthColors = ['#ff4757', '#ffa502', '#ffd32a', '#2ed573', '#00d4ff'];
            const strengthPercent = (strength / 5) * 100;
            
            strengthBar.style.width = `${strengthPercent}%`;
            strengthBar.style.backgroundColor = strengthColors[strength - 1] || strengthColors[0];
            strengthText.textContent = strengthLabels[strength - 1] || strengthLabels[0];
            strengthText.style.color = strengthColors[strength - 1] || strengthColors[0];
        });
        
        // 表单提交
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsChecked = document.getElementById('terms').checked;
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // 验证用户名
            if (!username) {
                alert('请输入用户名');
                return;
            }
            
            if (username.length < 3) {
                alert('用户名至少需要3个字符');
                return;
            }
            
            if (username.length > 20) {
                alert('用户名不能超过20个字符');
                return;
            }
            
            // 验证邮箱
            if (!email) {
                alert('请输入邮箱地址');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                alert('请输入有效的邮箱地址');
                return;
            }
            
            // 验证密码
            if (!password) {
                alert('请输入密码');
                return;
            }
            
            if (password.length < 8) {
                alert('密码至少需要8个字符');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            // 验证服务条款
            if (!termsChecked) {
                alert('请阅读并同意服务条款和隐私政策');
                return;
            }
            
            // 显示加载状态
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
            submitBtn.disabled = true;
            
            // 模拟网络延迟
            setTimeout(() => {
                try {
                    // 检查是否已存在用户
                    const existingUsers = JSON.parse(localStorage.getItem('ai24x_users') || '[]');
                    const userExists = existingUsers.some(user => user.email === email);
                    
                    if (userExists) {
                        alert('该邮箱已被注册，请使用其他邮箱或直接登录');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        return;
                    }
                    
                    // 创建新用户
                    const newUser = {
                        id: Date.now().toString(),
                        username: username,
                        email: email,
                        password: btoa(password), // 简单编码
                        timestamp: new Date().toISOString(),
                        toolsUsed: 0,
                        tutorialsCompleted: 0,
                        points: 100,
                        level: '普通会员'
                    };
                    
                    // 保存用户
                    existingUsers.push(newUser);
                    localStorage.setItem('ai24x_users', JSON.stringify(existingUsers));
                    
                    // 自动登录
                    localStorage.setItem('ai24x_logged_in', 'true');
                    localStorage.setItem('ai24x_username', newUser.username);
                    localStorage.setItem('ai24x_email', newUser.email);
                    localStorage.setItem('ai24x_user_id', newUser.id);
                    
                    // 显示成功消息
                    const successMsg = document.getElementById('successMessage');
                    if (successMsg) {
                        successMsg.textContent = '注册成功！正在跳转到用户中心...';
                        successMsg.style.color = '#2ed573';
                        successMsg.style.display = 'block';
                    }
                    
                    // 3秒后跳转
                    setTimeout(() => {
                        window.location.href = '/user-center';
                    }, 3000);
                    
                } catch (error) {
                    console.error('注册失败:', error);
                    alert('注册失败，请稍后重试');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }, 1000);
        });
        
        // 搜索功能
        document.querySelector('.search-button').addEventListener('click', function() {
            const searchInput = document.querySelector('.search-input');
            const query = searchInput.value.trim();
            if (query) {
                window.location.href = `/tools?search=${encodeURIComponent(query)}`;
            }
        });
        
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    window.location.href = `/tools?search=${encodeURIComponent(query)}`;
                }
            }
        });
    </script>
</body>
</html>

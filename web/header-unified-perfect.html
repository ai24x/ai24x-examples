<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI24X - 发现AI未来，就在AI24X</title>
    
    <!-- 统一安全策略 -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data:;
    ">
    
    <!-- 统一CSS文件 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header-unified.css">
    <link rel="stylesheet" href="spacing-unified.css">
    <link rel="stylesheet" href="mobile-fix.css">
    
    <!-- 100%本地图标 + 字体 -->
    <link rel="stylesheet" href="font-awesome-local.css">
    <link rel="stylesheet" href="fonts-local.css">
    
    <style>
        /* 统一系统字体 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        /* 统一页面基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        
        /* 统一链接样式 */
        a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        a:hover {
            color: #0099ff;
        }
        
        /* 统一按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
        }
        
        .btn-outline:hover {
            background: rgba(0, 212, 255, 0.1);
        }
    </style>
</head>
<body>
    <!-- 统一头部导航 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="/">
                        <i class="fa fa-robot"></i>
                        <span>AI24X</span>
                    </a>
                </div>
                
                <nav class="main-nav">
                    <ul>
                        <li><a href="/" class="nav-link"><i class="fa fa-home"></i> <span class="nav-text">首页</span></a></li>
                        <li><a href="/tools" class="nav-link"><i class="fa fa-tools"></i> <span class="nav-text">AI工具库</span></a></li>
                        <li><a href="/tutorials" class="nav-link"><i class="fa fa-chart-line"></i> <span class="nav-text">热门教程</span></a></li>
                        <li><a href="/custom" class="nav-link"><i class="fa fa-cogs"></i> <span class="nav-text">定制开发</span></a></li>
                    </ul>
                </nav>
                
                <div class="header-actions">
                    <div class="search-box">
                        <input type="text" placeholder="搜索AI工具..." id="globalSearch">
                        <button class="search-btn"><i class="fa fa-search"></i></button>
                    </div>
                    <div class="auth-buttons">
                        <a href="/login" class="btn btn-outline"><i class="fa fa-sign-in-alt"></i> 登录</a>
                        <a href="/signup" class="btn btn-primary"><i class="fa fa-user-plus"></i> 注册</a>
                    </div>
                    
                    <button class="mobile-menu-btn">
                        <i class="fa fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- 统一移动端菜单脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 移动端菜单切换
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            const mainNav = document.querySelector('.main-nav');
            
            if (mobileMenuBtn && mainNav) {
                mobileMenuBtn.addEventListener('click', function() {
                    mainNav.classList.toggle('active');
                    mobileMenuBtn.innerHTML = mainNav.classList.contains('active') 
                        ? '<i class="fa fa-times"></i>' 
                        : '<i class="fa fa-bars"></i>';
                });
                
                // 点击外部关闭菜单
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.main-nav') && !e.target.closest('.mobile-menu-btn')) {
                        mainNav.classList.remove('active');
                        mobileMenuBtn.innerHTML = '<i class="fa fa-bars"></i>';
                    }
                });
                
                // ESC键关闭菜单
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && mainNav.classList.contains('active')) {
                        mainNav.classList.remove('active');
                        mobileMenuBtn.innerHTML = '<i class="fa fa-bars"></i>';
                    }
                });
            }
            
            // 窗口大小变化时重置菜单
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    const mainNav = document.querySelector('.main-nav');
                    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
                    
                    if (mainNav) {
                        mainNav.classList.remove('active');
                    }
                    
                    if (mobileMenuBtn) {
                        mobileMenuBtn.innerHTML = '<i class="fa fa-bars"></i>';
                    }
                }
            });
            
            // 设置当前页面激活状态
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath === linkPath || 
                    (currentPath === '/' && linkPath === '/') ||
                    (currentPath.startsWith(linkPath) && linkPath !== '/')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
    
    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 页面特定内容将在这里插入 -->
        {{CONTENT}}
    </main>
    
    <!-- 统一页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">
                        <i class="fa fa-robot"></i>
                        <span>AI24X</span>
                    </div>
                    <p class="footer-description">
                        发现AI未来，就在AI24X。我们致力于提供最前沿的AI工具和教程。
                    </p>
                </div>
                <div class="footer-section">
                    <h3>快速链接</h3>
                    <ul class="footer-links">
                        <li><a href="/">首页</a></li>
                        <li><a href="/tools">AI工具库</a></li>
                        <li><a href="/tutorials">热门教程</a></li>
                        <li><a href="/custom">定制开发</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>支持</h3>
                    <ul class="footer-links">
                        <li><a href="/help">帮助中心</a></li>
                        <li><a href="/contact">联系我们</a></li>
                        <li><a href="/privacy">隐私政策</a></li>
                        <li><a href="/terms">服务条款</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>关注我们</h3>
                    <div class="social-links">
                        <a href="#" class="social-link"><i class="fa fa-weibo"></i></a>
                        <a href="#" class="social-link"><i class="fa fa-weixin"></i></a>
                        <a href="#" class="social-link"><i class="fa fa-github"></i></a>
                        <a href="#" class="social-link"><i class="fa fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AI24X. 保留所有权利.</p>
            </div>
        </div>
    </footer>
</body>
</html>

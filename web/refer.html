<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邀请回馈 · AI24X</title>
  <link rel="stylesheet" href="css/base.css?v=20260725a" />
  <link id="theme-css" rel="stylesheet" href="css/themes/theme-blue.css?v=20260725a" data-base="css/themes/" />
</head>
<body data-page="refer" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="hero hero-surface section-tight">
      <div class="container">
        <h1>邀请回馈</h1>
        <p class="lead">注册双方各送 5000 token；被邀请人首次充值后再按一级 10%、二级 2% 结算返利。</p>
      </div>
    </section>
    <section class="section">
      <div class="container grid-3">
        <div class="card">
          <h3 class="mt-0">我的邀请码</h3>
          <p class="stat-value" id="ref-code" style="font-size:1.6rem;">--</p>
          <div class="card-actions">
            <button type="button" class="btn btn-primary" id="btn-copy-ref">复制</button>
            <a class="btn" href="login.html?next=refer.html">登录查看</a>
          </div>
        </div>
        <div class="card">
          <h3 class="mt-0">一级邀请</h3>
          <p class="stat-value" id="ref-l1">--</p>
          <p class="sub">直接邀请人数</p>
        </div>
        <div class="card">
          <h3 class="mt-0">已获赠 token</h3>
          <p class="stat-value" id="ref-earn">--</p>
          <p class="sub">含待结算：<span id="ref-pending">--</span></p>
        </div>
      </div>
      <div class="container mt-2">
        <div id="ref-msg"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="config/locales.js?v=20260726v"></script>
  <script src="js/api.js?v=20260726w"></script>
  <script src="js/i18n.js?v=20260726w"></script>
  <script src="js/shell.js?v=20260726v"></script>
  <script src="js/app.js?v=20260725a"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var msg = document.getElementById("ref-msg");
      document.getElementById("btn-copy-ref").addEventListener("click", function () {
        var t = document.getElementById("ref-code").textContent || "";
        if (!t || t === "--") return;
        if (navigator.clipboard) navigator.clipboard.writeText(t);
      });
      if (!AI24X_API.getAuthToken()) {
        msg.innerHTML = '<div class="alert alert-error">请先登录后查看邀请数据。</div>';
        return;
      }
      AI24X_API.referralsSummary()
        .then(function (r) {
          document.getElementById("ref-code").textContent = r.code || "--";
          document.getElementById("ref-l1").textContent = String(r.invitees_l1 != null ? r.invitees_l1 : 0);
          document.getElementById("ref-earn").textContent = String(r.earned_tokens != null ? r.earned_tokens : 0);
          document.getElementById("ref-pending").textContent = String(r.pending_count != null ? r.pending_count : 0);
        })
        .catch(function (e) {
          msg.innerHTML = '<div class="alert alert-error">' + (e.message || "加载失败") + "</div>";
        });
    });
  </script>
</body>
</html>

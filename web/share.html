<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI24X - 分享页面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 分享页面特定样式 */
        .share-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .share-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .share-logo {
            font-size: 48px;
            color: #6c63ff;
            margin-bottom: 20px;
        }
        
        .share-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6c63ff, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .share-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .share-content {
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.1), rgba(255, 107, 157, 0.1));
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(108, 99, 255, 0.2);
        }
        
        .tool-info {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(108, 99, 255, 0.1);
        }
        
        .tool-icon {
            font-size: 48px;
            color: #6c63ff;
            margin-right: 20px;
        }
        
        .tool-details h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .tool-description {
            color: #666;
            line-height: 1.6;
        }
        
        .share-message {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #6c63ff;
        }
        
        .share-message p {
            margin: 0;
            font-style: italic;
            color: #555;
        }
        
        .share-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #6c63ff;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .share-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .share-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .share-btn-primary {
            background: linear-gradient(135deg, #6c63ff, #ff6b9d);
            color: white;
        }
        
        .share-btn-secondary {
            background: white;
            color: #6c63ff;
            border: 2px solid #6c63ff;
        }
        
        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.2);
        }
        
        .register-cta {
            text-align: center;
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.05), rgba(255, 107, 157, 0.05));
            border-radius: 20px;
            padding: 40px;
            margin-top: 40px;
        }
        
        .register-cta h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .register-cta p {
            color: #666;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn-register {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #6c63ff, #ff6b9d);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(108, 99, 255, 0.3);
        }
        
        .share-footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(108, 99, 255, 0.1);
            color: #666;
            font-size: 14px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .share-container {
                padding: 20px 15px;
            }
            
            .share-content {
                padding: 20px;
            }
            
            .tool-info {
                flex-direction: column;
                text-align: center;
            }
            
            .tool-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .share-stats {
                grid-template-columns: 1fr;
            }
            
            .share-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .share-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="share-container">
        <div class="share-header">
            <div class="share-logo">
                <i class="fas fa-share-alt"></i>
            </div>
            <h1 class="share-title">AI工具分享</h1>
            <p class="share-subtitle">发现优秀的AI工具，与朋友一起探索人工智能的未来</p>
        </div>
        
        <div class="share-content">
            <div class="tool-info">
                <div class="tool-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="tool-details">
                    <h3 id="tool-name">AI对话助手</h3>
                    <p class="tool-description" id="tool-description">
                        一款智能对话AI助手，能够理解自然语言，提供准确的回答和建议。支持多种语言，适用于学习、工作和娱乐等多种场景。
                    </p>
                </div>
            </div>
            
            <div class="share-message" id="share-message">
                <p>"我发现这个AI工具非常实用，推荐给你！"</p>
            </div>
            
            <div class="share-stats">
                <div class="stat-card">
                    <div class="stat-value" id="click-count">0</div>
                    <div class="stat-label">点击次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="register-count">0</div>
                    <div class="stat-label">注册人数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="conversion-rate">0%</div>
                    <div class="stat-label">转化率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="sharer-rank">#1</div>
                    <div class="stat-label">分享者排名</div>
                </div>
            </div>
            
            <div class="share-actions">
                <button class="share-btn share-btn-primary" id="copy-link-btn">
                    <i class="fas fa-copy"></i>
                    <span>复制分享链接</span>
                </button>
                <button class="share-btn share-btn-secondary" id="share-wechat">
                    <i class="fab fa-weixin"></i>
                    <span>分享到微信</span>
                </button>
                <button class="share-btn share-btn-secondary" id="share-qq">
                    <i class="fab fa-qq"></i>
                    <span>分享到QQ</span>
                </button>
                <button class="share-btn share-btn-secondary" id="share-weibo">
                    <i class="fab fa-weibo"></i>
                    <span>分享到微博</span>
                </button>
            </div>
        </div>
        
        <div class="register-cta">
            <h3>立即注册AI24X，发现更多AI工具</h3>
            <p>加入AI24X社区，获取独家AI工具推荐，参与工具评测，与AI爱好者交流经验。</p>
            <a href="/signup?ref=share" class="btn-register" id="register-btn">
                <i class="fas fa-user-plus"></i>
                免费注册
            </a>
        </div>
        
        <div class="share-footer">
            <p>© 2026 AI24X - 人工智能工具平台 | 分享自: <span id="sharer-name">AI工具爱好者</span></p>
            <p>本链接由AI24X分享系统生成，点击统计将帮助改进推荐算法</p>
        </div>
    </div>
    
    <script>
        // 获取URL参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                shareId: params.get('id') || params.get('share') || 'default',
                toolId: params.get('tool') || '1',
                sharer: params.get('sharer') || 'AI工具爱好者'
            };
        }
        
        // 加载分享数据
        async function loadShareData() {
            const params = getUrlParams();
            
            try {
                // 获取分享链接信息
                const shareResponse = await fetch(`/api/share/${params.shareId}`);
                if (shareResponse.ok) {
                    const shareData = await shareResponse.json();
                    if (shareData.success) {
                        updateShareInfo(shareData.data);
                    }
                }
                
                // 获取分享统计
                const statsResponse = await fetch(`/api/share/${params.shareId}/stats`);
                if (statsResponse.ok) {
                    const statsData = await statsResponse.json();
                    if (statsData.success) {
                        updateStats(statsData.data);
                    }
                }
                
                // 获取工具信息（这里需要根据实际情况调整）
                // 暂时使用模拟数据
                updateToolInfo(params.toolId);
                
            } catch (error) {
                console.error('加载分享数据失败:', error);
            }
        }
        
        // 更新分享信息
        function updateShareInfo(shareData) {
            // 更新分享者信息
            document.getElementById('sharer-name').textContent = `用户${shareData.userId}`;
            
            // 更新分享消息
            if (shareData.customMessage) {
                document.getElementById('share-message').innerHTML = 
                    `<p>"${shareData.customMessage}"</p>`;
            }
            
            // 更新注册链接
            const registerBtn = document.getElementById('register-btn');
            registerBtn.href = `/signup?ref=share&shareId=${shareData.id}`;
        }
        
        // 更新统计信息
        function updateStats(statsData) {
            document.getElementById('click-count').textContent = statsData.totalClicks || 0;
            document.getElementById('register-count').textContent = statsData.totalRegistrations || 0;
            document.getElementById('conversion-rate').textContent = statsData.conversionRate || '0%';
            
            // 简单计算排名（模拟）
            const rank = statsData.totalRegistrations > 100 ? '#1' : 
                        statsData.totalRegistrations > 50 ? '#2' : 
                        statsData.totalRegistrations > 20 ? '#3' : '#10+';
            document.getElementById('sharer-rank').textContent = rank;
        }
        
        // 更新工具信息（模拟）
        function updateToolInfo(toolId) {
            const tools = {
                '1': {
                    name: 'AI对话助手',
                    description: '一款智能对话AI助手，能够理解自然语言，提供准确的回答和建议。支持多种语言，适用于学习、工作和娱乐等多种场景。',
                    icon: 'fa-robot'
                },
                '2': {
                    name: 'AI图像生成',
                    description: '基于深度学习的图像生成工具，可以根据文字描述生成高质量的图像作品。支持多种艺术风格和分辨率。',
                    icon: 'fa-image'
                },
                '3': {
                    name: 'AI代码助手',
                    description: '智能代码编写和调试助手，支持多种编程语言，能够自动补全代码、检测错误并提供优化建议。',
                    icon: 'fa-code'
                }
            };
            
            const tool = tools[toolId] || tools['1'];
            document.getElementById('tool-name').textContent = tool.name;
            document.getElementById('tool-description').textContent = tool.description;
            document.querySelector('.tool-icon i').className = `fas ${tool.icon}`;
        }
        
        // 复制链接功能
        document.getElementById('copy-link-btn').addEventListener('click', function() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                const originalText = this.querySelector('span').textContent;
                this.querySelector('span').textContent = '已复制！';
                this.style.background = 'linear-gradient(135deg, #4CAF50, #8BC34A)';
                
                setTimeout(() => {
                    this.querySelector('span').textContent = originalText;
                    this.style.background = 'linear-gradient(135deg, #6c63ff, #ff6b9d)';
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制链接');
            });
        });
        
        // 社交分享功能（模拟）
        document.getElementById('share-wechat').addEventListener('click', function() {
            alert('微信分享功能需要配置微信SDK');
        });
        
        document.getElementById('share-qq').addEventListener('click', function() {
            alert('QQ分享功能需要配置QQ SDK');
        });
        
        document.getElementById('share-weibo').addEventListener('click', function() {
            const shareUrl = encodeURIComponent(window.location.href);
            const shareText = encodeURIComponent('我发现了一个很棒的AI工具，快来看看！');
            window.open(`http://service.weibo.com/share/share.php?url=${shareUrl}&title=${shareText}`, '_blank');
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadShareData();
            
            // 添加动画效果
            const elements = document.querySelectorAll('.stat-card, .share-btn, .btn-register');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI24X - 统一的头部组件</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 统一的头部样式 - 直接内联，确保一致性 */
        :root {
            --primary-color: #00d4ff;
            --primary-dark: #0099cc;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: rgba(0, 212, 255, 0.2);
            --shadow-color: rgba(0, 212, 255, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }
        
        /* 统一的头部容器 */
        .unified-header {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .unified-header .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .unified-header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            gap: 30px;
            min-height: 70px;
        }
        
        /* Logo区域 */
        .unified-logo {
            flex-shrink: 0;
        }
        
        .unified-logo a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        .unified-logo a:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }
        
        .unified-logo i {
            font-size: 28px;
            color: var(--primary-color);
        }
        
        /* 导航菜单 - 完全统一 */
        .unified-main-nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        
        .unified-main-nav ul {
            display: flex;
            list-style: none;
            gap: 8px;
            padding: 0;
            margin: 0;
        }
        
        .unified-main-nav li {
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .unified-main-nav a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            text-decoration: none;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: transparent;
            border: 1px solid transparent;
            height: 38px;
            line-height: 1;
        }
        
        .unified-main-nav a:hover {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary-color);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-color);
        }
        
        .unified-main-nav a.active {
            background: rgba(0, 212, 255, 0.15);
            color: var(--primary-color);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        
        .unified-main-nav i {
            font-size: 14px;
        }
        
        /* 头部操作区域 - 完全统一 */
        .unified-header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-shrink: 0;
            min-width: 320px;
            justify-content: flex-end;
        }
        
        /* 搜索框 - 完全统一 */
        .unified-search-box {
            position: relative;
            flex-shrink: 1;
            min-width: 220px;
            max-width: 280px;
            align-self: center;
            display: flex;
            align-items: center;
        }
        
        .unified-search-box input {
            width: 100%;
            padding: 10px 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
            line-height: 1.4;
            height: 38px;
        }
        
        .unified-search-box input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15), 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .unified-search-box .unified-search-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            height: 24px;
            width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 认证按钮 - 完全统一 */
        .unified-auth-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            align-items: center;
        }
        
        .unified-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-decoration: none;
            height: 38px;
            line-height: 1;
            cursor: pointer;
            border: none;
        }
        
        .unified-btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        
        .unified-btn-outline:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        
        .unified-btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
        }
        
        .unified-btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }
        
        /* 移动端菜单按钮 */
        .unified-mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .unified-header-content {
                gap: 20px;
            }
            
            .unified-main-nav {
                display: none;
            }
            
            .unified-search-box {
                min-width: 180px;
            }
        }
        
        @media (max-width: 768px) {
            .unified-header-actions {
                min-width: auto;
            }
            
            .unified-search-box {
                display: none;
            }
            
            .unified-auth-buttons {
                display: none;
            }
            
            .unified-mobile-menu-btn {
                display: block;
            }
        }
        
        /* 移动端菜单 */
        .unified-mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .unified-mobile-menu.active {
            display: block;
        }
        
        .unified-mobile-nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .unified-mobile-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: var(--text-light);
            font-size: 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .unified-mobile-nav a:hover {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary-color);
        }
        
        .unified-mobile-search {
            margin-top: 20px;
            padding: 0 20px;
        }
        
        .unified-mobile-search input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        
        .unified-mobile-auth {
            margin-top: 20px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- 统一的头部组件 -->
    <header class="unified-header">
        <div class="container">
            <div class="unified-header-content">
                <!-- Logo -->
                <div class="unified-logo">
                    <a href="/">
                        <i class="fas fa-robot"></i>
                        <span>AI24X</span>
                    </a>
                </div>
                
                <!-- 桌面导航菜单 -->
                <nav class="unified-main-nav">
                    <ul>
                        <li><a href="/" class="active"><i class="fas fa-home"></i> <span>首页</span></a></li>
                        <li><a href="/tools"><i class="fas fa-tools"></i> <span>AI工具库</span></a></li>
                        <li><a href="/tutorials"><i class="fas fa-chart-line"></i> <span>热门教程</span></a></li>
                        <li><a href="/custom"><i class="fas fa-cogs"></i> <span>定制开发</span></a></li>
                    </ul>
                </nav>
                
                <!-- 头部操作区域 -->
                <div class="unified-header-actions">
                    <!-- 搜索框 -->
                    <div class="unified-search-box">
                        <input type="text" placeholder="搜索AI工具..." id="unifiedSearchInput">
                        <button class="unified-search-btn">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    
                    <!-- 认证按钮 -->
                    <div class="unified-auth-buttons">
                        <a href="/login" class="unified-btn unified-btn-outline"><i class="fas fa-sign-in-alt"></i> 登录</a>
                        <a href="/signup" class="unified-btn unified-btn-primary"><i class="fas fa-user-plus"></i> 注册</a>
                    </div>
                    
                    <!-- 移动端菜单按钮 -->
                    <button class="unified-mobile-menu-btn" id="unifiedMobileMenuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 移动端菜单 -->
        <div class="unified-mobile-menu" id="unifiedMobileMenu">
            <nav class="unified-mobile-nav">
                <ul>
                    <li><a href="/"><i class="fas fa-home"></i> <span>首页</span></a></li>
                    <li><a href="/tools"><i class="fas fa-tools"></i> <span>AI工具库</span></a></li>
                    <li><a href="/tutorials"><i class="fas fa-chart-line"></i> <span>热门教程</span></a></li>
                    <li><a href="/custom"><i class="fas fa-cogs"></i> <span>定制开发</span></a></li>
                </ul>
            </nav>
            
            <div class="unified-mobile-search">
                <input type="text" placeholder="搜索AI工具...">
            </div>
            
            <div class="unified-mobile-auth">
                <a href="/login" class="unified-btn unified-btn-outline" style="justify-content: center;"><i class="fas fa-sign-in-alt"></i> 登录</a>
                <a href="/signup" class="unified-btn unified-btn-primary" style="justify-content: center;"><i class="fas fa-user-plus"></i> 注册</a>
            </div>
        </div>
    </header>

    <script>
        // 统一的头部JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // 移动端菜单切换
            const mobileMenuBtn = document.getElementById('unifiedMobileMenuBtn');
            const mobileMenu = document.getElementById('unifiedMobileMenu');
            
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function() {
                    mobileMenu.classList.toggle('active');
                    mobileMenuBtn.innerHTML = mobileMenu.classList.contains('active') 
                        ? '<i class="fas fa-times"></i>' 
                        : '<i class="fas fa-bars"></i>';
                });
                
                // 点击外部关闭菜单
                document.addEventListener('click', function(event) {
                    if (!mobileMenu.contains(event.target) && !mobileMenuBtn.contains(event.target)) {
                        mobileMenu.classList.remove('active');
                        mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
                    }
                });
            }
            
            // 搜索功能
            const searchInput = document.getElementById('unifiedSearchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const query = this.value.trim();
                        if (query) {
                            window.location.href = `/tools?search=${encodeURIComponent(query)}`;
                        }
                    }
                });
            }
            
            // 高亮当前页面菜单项
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.unified-main-nav a, .unified-mobile-nav a');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath || (currentPath.startsWith(href) && href !== '/')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
            
            // 统一控制台日志
            console.log('🔗 统一的头部组件已加载');
            console.log('📱 响应式设计: 桌面/平板/手机');
            console.log('🎯 功能: 搜索、导航、移动菜单');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具页面 - 强制刷新版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: Arial; padding: 20px; }
        h1 { color: #00d4ff; }
        .icon-demo { display: flex; align-items: center; gap: 15px; margin: 15px 0; padding: 15px; background: rgba(30, 41, 59, 0.8); border-radius: 10px; }
        .icon { font-size: 32px; color: #00d4ff; }
        .info { flex: 1; }
        .name { font-weight: bold; font-size: 18px; }
        .code { font-family: monospace; color: #94a3b8; font-size: 14px; }
        .status { padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        .success { background: #10b981; color: white; }
    </style>
</head>
<body>
    <h1>🦀 OpenClaw小龙虾图标测试</h1>
    <p>这是一个强制刷新版本，确保加载最新图标。</p>
    
    <div class="icon-demo">
        <div class="icon">
            <i class="fas fa-crab"></i>
        </div>
        <div class="info">
            <div class="name">OpenClaw 小龙虾图标</div>
            <div class="code">fas fa-crab</div>
        </div>
        <div class="status success">✅ 图标可用</div>
    </div>
    
    <p>如果上方显示小龙虾图标 🦀，则Font Awesome库已正确加载。</p>
    <p>现在访问 <a href="/tools?force=20260319195612" style="color: #00d4ff;">工具页面（强制刷新）</a></p>
    
    <script>
        // 强制清除可能的缓存
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
        
        console.log('强制刷新页面已加载');
        console.log('OpenClaw图标代码: fas fa-crab');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · AI24X</title>
  <link rel="stylesheet" href="css/base.css?v=20260420d" />
  <link id="theme-css" rel="stylesheet" href="css/themes/theme-blue.css?v=20260420d" data-base="css/themes/" />
  <style>
    .auth-fieldset-preview {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
      opacity: 0.93;
    }
    .auth-fieldset-preview:disabled .auth-tabs button {
      cursor: not-allowed;
    }
  </style>
</head>
<body data-page="login" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="section">
      <div class="container" style="max-width:480px">
        <h1 data-i18n="auth.login.title"></h1>
        <p class="sub" data-i18n="auth.login.sub"></p>
        <p class="callout mt-2" data-i18n-html="auth.login.modeBanner"></p>
        <div
          class="callout mt-2"
          data-i18n-html="auth.closed.banner"
          role="status"
          aria-live="polite"
        ><strong>温馨提示</strong>：主站<strong>暂未开放</strong>注册与登录，表单不可提交。推荐首发应用 <a href="https://a.ai24x.com/?mode=register&amp;ch=phone" target="_blank" rel="noopener">AI 行情官｜灯塔版</a>。</div>
        <form class="card mt-2" id="form-login">
          <fieldset class="auth-fieldset-preview" disabled>
          <div class="auth-tabs" role="tablist" aria-label="login method">
            <button type="button" id="login-tab-phone" class="is-active" role="tab" aria-selected="true" data-i18n="auth.tab.phone"></button>
            <button type="button" id="login-tab-email" role="tab" aria-selected="false" data-i18n="auth.tab.email"></button>
          </div>
          <div class="form-group" id="login-grp-phone">
            <label data-i18n="auth.login.phone"></label>
            <input id="login-phone" name="phone" type="tel" class="input" autocomplete="tel" inputmode="tel" placeholder="" data-i18n-placeholder="auth.login.phonePh" />
          </div>
          <div class="form-group auth-field-hidden" id="login-grp-email">
            <label data-i18n="auth.login.email"></label>
            <input id="login-email" name="email" type="email" class="input" autocomplete="email" placeholder="" data-i18n-placeholder="auth.login.email" />
          </div>
          <div class="form-group">
            <label data-i18n="auth.login.password"></label>
            <input name="password" type="password" class="input" required autocomplete="current-password" data-i18n-placeholder="auth.login.password" />
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="auth.login.submit"></button>
          <div id="login-msg"></div>
          </fieldset>
        </form>
        <p class="mt-2 sub" data-i18n-html="auth.closed.footerLogin"><a href="register.html">注册</a> · <a href="login.html">登录</a></p>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="config/locales.js?v=20260420c"></script>
  <script src="js/api.js?v=20260421a"></script>
  <script src="js/i18n.js?v=20260420c"></script>
  <script src="js/shell.js?v=20260420c"></script>
  <script src="js/app.js?v=20260420c"></script>
  <script>
    function loginAuthMode() {
      return document.getElementById("login-tab-email").classList.contains("is-active") ? "email" : "phone";
    }
    function bindLoginTabs() {
      var tabPhone = document.getElementById("login-tab-phone");
      var tabEmail = document.getElementById("login-tab-email");
      var grpPhone = document.getElementById("login-grp-phone");
      var grpEmail = document.getElementById("login-grp-email");
      var inpPhone = document.getElementById("login-phone");
      var inpEmail = document.getElementById("login-email");
      if (!tabPhone || !tabEmail) return;
      function setMode(mode) {
        var isPhone = mode === "phone";
        tabPhone.classList.toggle("is-active", isPhone);
        tabEmail.classList.toggle("is-active", !isPhone);
        tabPhone.setAttribute("aria-selected", isPhone ? "true" : "false");
        tabEmail.setAttribute("aria-selected", !isPhone ? "true" : "false");
        grpPhone.classList.toggle("auth-field-hidden", !isPhone);
        grpEmail.classList.toggle("auth-field-hidden", isPhone);
        inpPhone.required = isPhone;
        inpEmail.required = !isPhone;
        if (window.AI24X_I18N) AI24X_I18N.apply(document.getElementById("form-login") || document.body);
      }
      tabPhone.addEventListener("click", function () {
        setMode("phone");
      });
      tabEmail.addEventListener("click", function () {
        setMode("email");
      });
      setMode("phone");
    }

    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var box = document.getElementById("login-msg");
      if (!box) return;
      box.textContent = "";
      var d = document.createElement("div");
      d.className = "alert alert-error";
      var msg = window.AI24X_I18N ? AI24X_I18N.t("auth.closed.submitBlocked") : "";
      if (!msg || msg === "auth.closed.submitBlocked") {
        msg = "暂未开放。";
      }
      d.textContent = msg;
      box.appendChild(d);
    });

    document.addEventListener("DOMContentLoaded", function () {
      try {
        bindLoginTabs();
      } catch (e) {}
    });
  </script>
</body>
</html>

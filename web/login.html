/* i18n-boot inline v20260808c: language pre-read + FOUC guard (no network dependency) */
(function () {
  var KEY = "ai24x_lang";
  try {
    var raw = String(localStorage.getItem(KEY) || "").trim().toLowerCase().replace(/_/g, "-");
    var lang = raw.split("-")[0] || "";
    if (!lang) { lang = "en"; localStorage.setItem(KEY, lang); }
    document.documentElement.setAttribute("data-ai24x-lang", lang);
    document.documentElement.classList.add("i18n-pending");
    if (!document.getElementById("ai24x-i18n-pending")) {
      var st = document.createElement("style");
      st.id = "ai24x-i18n-pending";
      st.textContent = "html.i18n-pending body{visibility:hidden!important}";
      (document.head || document.documentElement).appendChild(st);
    }
    setTimeout(function () { document.documentElement.classList.remove("i18n-pending"); }, 4000);
  } catch (e) {}
})();
</script>

<body data-page="login" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="section">
      <div class="container" style="max-width:480px">
        <h1 data-i18n="auth.login.title">Log in</h1>
        <p class="sub" data-i18n="auth.login.sub">Sign in with email (phone login coming later).</p>
        <div class="callout mt-2" id="auth-closed-banner" role="status" aria-live="polite" data-i18n-html="auth.closed.banner">
          <strong>Notice</strong>: Sign-up / sign-in are not open in this environment.
        </div>
        <form class="card mt-2" id="form-login">
          <fieldset class="auth-fieldset-preview" id="login-fieldset" disabled>
          <div class="form-group">
            <label data-i18n="auth.login.email">Email</label>
            <input id="login-email" name="email" type="email" class="input" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label data-i18n="auth.login.password">Password</label>
            <input name="password" type="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="auth.login.submit">Continue</button>
          <div id="login-msg"></div>
          </fieldset>
        </form>
        <div id="oauth-panel" class="mt-2" style="display:none">
          <div style="display:flex; align-items:center; gap:10px; margin:14px 0 4px; color:var(--muted); font-size:12px;">
            <span style="flex:1; height:1px; background:var(--border);"></span>
            <span data-i18n="auth.login.divider">or</span>
            <span style="flex:1; height:1px; background:var(--border);"></span>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
            <a class="btn" id="btn-oauth-google" href="#" style="justify-content:center;" data-i18n="auth.login.google">Continue with Google</a>
            <a class="btn" id="btn-oauth-apple" href="#" style="justify-content:center;" data-i18n="auth.login.apple">Continue with Apple</a>
          </div>
        </div>
        <p class="mt-2 sub" data-i18n-html="auth.login.footer"><a href="register.html">Sign up</a> · <a href="forgot.html">Forgot password?</a> · <a href="console.html">Console</a></p>
      </div>
    </section>
  </main>

  <script>
    function t(key, fallback) {
      if (window.AI24X_I18N && AI24X_I18N.t) {
        var v = AI24X_I18N.t(key);
        if (v && v !== key) return v;
      }
      return fallback || key;
    }
    function nextUrl() {
      try {
        var u = new URL(location.href);
        var n = u.searchParams.get("next");
        if (n && isSafeNext(n)) return n;
      } catch (e) {}
      return "console.html";
    }
    function isSafeNext(url) {
      if (!url || url.indexOf("http") !== 0) return true; // same-site relative path
      try {
        var h = new URL(url).hostname.toLowerCase();
        return h === "markets.ai24x.com" || h === "127.0.0.1" || h === "localhost";
      } catch (e) {
        return false;
      }
    }

    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var box = document.getElementById("login-msg");
      box.innerHTML = "";
      if (!AI24X_API.isLocalAuthOpen()) {
        box.innerHTML = '<div class="alert alert-error">' + t("auth.closed.submitBlocked", "Not open yet.") + "</div>";
        return;
      }
      var password = (document.querySelector('#form-login input[name="password"]').value || "").trim();
      var payload = {
        password: password,
        email: (document.getElementById("login-email").value || "").trim(),
      };
      AI24X_API.authLogin(payload)
        .then(function () {
          location.href = nextUrl();
        })
        .catch(function (err) {
          box.innerHTML = '<div class="alert alert-error">' + (err.message || t("auth.login.fail", "Login failed")) + "</div>";
        });
    });


    function oauthLoginUrl(provider) {
      return "/v1/auth/" + provider + "/login?next=" + encodeURIComponent(nextUrl());
    }
    function applyOAuth() {
      var panel = document.getElementById("oauth-panel");
      if (!panel) return;
      fetch("/v1/auth/providers", { method: "GET" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var g = !!(j && j.google), a = !!(j && j.apple);
          var gb = document.getElementById("btn-oauth-google");
          var ab = document.getElementById("btn-oauth-apple");
          if (gb) gb.style.display = g ? "" : "none";
          if (ab) ab.style.display = a ? "" : "none";
          panel.style.display = (g || a) ? "" : "none";
        })
        .catch(function () { panel.style.display = "none"; });
    }
    function handleOAuthReturn() {
      if (!location.hash || location.hash.indexOf("oauth=1") === -1) return;
      var token = "", user = "";
      try {
        var mt = document.cookie.match(/(?:^|; )ai24x_auth_token=([^;]*)/);
        if (mt) token = decodeURIComponent(mt[1]);
        var mu = document.cookie.match(/(?:^|; )ai24x_auth_user=([^;]*)/);
        if (mu) user = decodeURIComponent(mu[1]);
      } catch (e) {}
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (token) {
        try {
          localStorage.setItem("ai24x_auth_token", token);
          if (user) localStorage.setItem("ai24x_auth_user", user);
        } catch (e) {}
        location.href = nextUrl();
        return;
      }
      var err = "";
      try { err = new URLSearchParams(location.search).get("oauth_error") || ""; } catch (e) {}
      if (err) {
        var box = document.getElementById("login-msg");
        if (box) box.innerHTML = '<div class="alert alert-error">' + t("auth.login.oauthFail", "Social sign-in failed: ") + err + '</div>';
      }
    }
    document.addEventListener("DOMContentLoaded", function () {
      function applyAuthUi() {
        var open = AI24X_API.isLocalAuthOpen();
        var fs = document.getElementById("login-fieldset");
        if (fs) fs.disabled = !open;
        var ban = document.getElementById("auth-closed-banner");
        if (!ban) return;
        if (!open) {
          ban.style.display = "";
          ban.innerHTML = t("auth.closed.banner");
          return;
        }
        if (AI24X_API.isLocalHost && AI24X_API.isLocalHost()) {
          ban.style.display = "";
          ban.innerHTML = t("auth.login.localBanner");
        } else {
          ban.style.display = "none";
        }
      }
      applyAuthUi();
      applyOAuth();
      handleOAuthReturn();
      var langSel = document.getElementById("lang-select");
      if (langSel) langSel.addEventListener("change", applyAuthUi);
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
/* i18n-boot inline v20260808c: language pre-read + FOUC guard (no network dependency) */
(function () {
  var KEY = "ai24x_lang";
  try {
    var raw = String(localStorage.getItem(KEY) || "").trim().toLowerCase().replace(/_/g, "-");
    var lang = raw.split("-")[0] || "";
    if (!lang) { lang = "en"; localStorage.setItem(KEY, lang); }
    document.documentElement.setAttribute("data-ai24x-lang", lang);
    document.documentElement.classList.add("i18n-pending");
    if (!document.getElementById("ai24x-i18n-pending")) {
      var st = document.createElement("style");
      st.id = "ai24x-i18n-pending";
      st.textContent = "html.i18n-pending body{visibility:hidden!important}";
      (document.head || document.documentElement).appendChild(st);
    }
    setTimeout(function () { document.documentElement.classList.remove("i18n-pending"); }, 4000);
  } catch (e) {}
})();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="css/base.css?v=20260812e" />
  <link id="theme-css" rel="stylesheet" href="css/themes/theme-blue.css?v=20260812e" data-base="css/themes/" />
  <style>
    .auth-fieldset-preview {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
      opacity: 0.93;
    }

<body data-page="login" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="section">
      <div class="container" style="max-width:480px">
        <h1 data-i18n="auth.login.title">Log in</h1>
        <p class="sub" data-i18n="auth.login.sub">Sign in with email (phone login coming later).</p>
        <div class="callout mt-2" id="auth-closed-banner" role="status" aria-live="polite" data-i18n-html="auth.closed.banner">
          <strong>Notice</strong>: Sign-up / sign-in are not open in this environment.
        </div>
        <form class="card mt-2" id="form-login">
          <fieldset class="auth-fieldset-preview" id="login-fieldset" disabled>
          <div class="form-group">
            <label data-i18n="auth.login.email">Email</label>
            <input id="login-email" name="email" type="email" class="input" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label data-i18n="auth.login.password">Password</label>
            <input name="password" type="password" class="input" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="auth.login.submit">Continue</button>
          <div id="login-msg"></div>
          </fieldset>
        </form>
        <p class="mt-2 sub" data-i18n-html="auth.login.footer"><a href="register.html">Sign up</a> · <a href="forgot.html">Forgot password?</a> · <a href="console.html">Console</a></p>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="config/locales.js?v=20260813b"></script>
  <script src="js/api.js?v=20260812e"></script>
  <script src="js/utm.js?v=20260802a"></script>
<script src="js/i18n.js?v=20260812g"></script>
  <script src="js/shell.js?v=20260808b"></script>
  <script src="js/app.js?v=20260808b"></script>
  <script>
    function t(key, fallback) {
      if (window.AI24X_I18N && AI24X_I18N.t) {
        var v = AI24X_I18N.t(key);
        if (v && v !== key) return v;
      }
      return fallback || key;
    }
    function nextUrl() {
      try {
        var u = new URL(location.href);
        var n = u.searchParams.get("next");
        if (n && n.indexOf("http") !== 0) return n;
      } catch (e) {}
      return "console.html";
    }

    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var box = document.getElementById("login-msg");
      box.innerHTML = "";
      if (!AI24X_API.isLocalAuthOpen()) {
        box.innerHTML = '<div class="alert alert-error">' + t("auth.closed.submitBlocked", "Not open yet.") + "</div>";
        return;
      }
      var password = (document.querySelector('#form-login input[name="password"]').value || "").trim();
      var payload = {
        password: password,
        email: (document.getElementById("login-email").value || "").trim(),
      };
      AI24X_API.authLogin(payload)
        .then(function () {
          location.href = nextUrl();
        })
        .catch(function (err) {
          box.innerHTML = '<div class="alert alert-error">' + (err.message || t("auth.login.fail", "Login failed")) + "</div>";
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
      function applyAuthUi() {
        var open = AI24X_API.isLocalAuthOpen();
        var fs = document.getElementById("login-fieldset");
        if (fs) fs.disabled = !open;
        var ban = document.getElementById("auth-closed-banner");
        if (!ban) return;
        if (!open) {
          ban.style.display = "";
          ban.innerHTML = t("auth.closed.banner");
          return;
        }
        if (AI24X_API.isLocalHost && AI24X_API.isLocalHost()) {
          ban.style.display = "";
          ban.innerHTML = t("auth.login.localBanner");
        } else {
          ban.style.display = "none";
        }
      }
      applyAuthUi();
      var langSel = document.getElementById("lang-select");
      if (langSel) langSel.addEventListener("change", applyAuthUi);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 · AI24X</title>
  <link rel="stylesheet" href="css/base.css?v=20260725d" />
  <link id="theme-css" rel="stylesheet" href="css/themes/theme-blue.css?v=20260725a" data-base="css/themes/" />
  <style>
    .auth-fieldset-preview {
      border: 0;
      margin: 0;
      padding: 0;
      min-width: 0;
      opacity: 0.93;
    }
    .otp-local-box {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface, #fff));
    }
    .otp-local-box.is-on { display: block; }
    .otp-local-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .otp-local-code {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .otp-local-hint { margin-top: 6px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body data-page="register" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="section">
      <div class="container" style="max-width:480px">
        <h1>注册</h1>
        <p class="sub">当前开放<strong>邮箱注册</strong>。手机短信注册稍后接入（国内/国际短信）。</p>
        <div class="callout mt-2" id="auth-closed-banner" role="status">
          <strong>温馨提示</strong>：主站暂未开放注册。本地预览（127.0.0.1）已自动开放。
        </div>
        <form class="card mt-2" id="form-register">
          <fieldset class="auth-fieldset-preview" id="reg-fieldset" disabled>
          <div class="form-group">
            <label>邮箱</label>
            <input id="reg-email" name="email" type="email" class="input" autocomplete="email" required />
          </div>
          <div class="form-group form-group-otp-inline">
            <label>邮箱验证码</label>
            <div class="form-otp-row">
              <input id="reg-email-code" name="email_code" type="text" inputmode="numeric" maxlength="6" class="input" autocomplete="one-time-code" required />
              <button type="button" class="btn btn-otp-send" id="reg-btn-send-email">获取验证码</button>
            </div>
            <div class="otp-local-box" id="reg-otp-local" aria-live="polite">
              <div class="otp-local-label">本地预览验证码（正式环境将发到邮箱）</div>
              <div class="otp-local-code" id="reg-otp-code">------</div>
              <div class="otp-local-hint">已自动填入上方输入框，可直接设置密码完成注册。</div>
            </div>
          </div>
          <div class="form-group">
            <label>密码（至少 6 位）</label>
            <input name="password" type="password" class="input" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label>邀请码（可选）</label>
            <input id="reg-invite" name="invite_code" type="text" class="input" maxlength="32" placeholder="选填" />
            <p class="sub" style="margin:6px 0 0;">填写有效邀请码：双方各送 5000 token（与行情官无关）。</p>
          </div>
          <button type="submit" class="btn btn-primary">注册</button>
          <div id="reg-msg"></div>
          </fieldset>
        </form>
        <p class="mt-2 sub"><a href="login.html">登录</a> · <a href="console.html">控制台</a></p>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="config/locales.js?v=20260725a"></script>
  <script src="js/api.js?v=20260725d"></script>
  <script src="js/i18n.js?v=20260725a"></script>
  <script src="js/shell.js?v=20260725a"></script>
  <script src="js/app.js?v=20260725a"></script>
  <script>
    document.getElementById("reg-btn-send-email").addEventListener("click", function () {
      var box = document.getElementById("reg-msg");
      var otpBox = document.getElementById("reg-otp-local");
      var otpCode = document.getElementById("reg-otp-code");
      var inpCode = document.getElementById("reg-email-code");
      otpBox.classList.remove("is-on");
      if (!AI24X_API.isLocalAuthOpen()) {
        box.innerHTML = '<div class="alert alert-error">暂未开放。</div>';
        return;
      }
      var email = (document.getElementById("reg-email").value || "").trim();
      AI24X_API.authEmailSend({ email: email, purpose: "register" })
        .then(function (r) {
          var channel = (r && r.channel) || "";
          var code = (r && (r.local_code || r.dev_code)) || "";
          if (r && r.ok && channel === "local" && code) {
            otpCode.textContent = String(code);
            otpBox.classList.add("is-on");
            if (inpCode) inpCode.value = String(code);
            box.innerHTML = '<div class="alert alert-success">验证码已就绪，请继续设置密码。</div>';
            return;
          }
          otpBox.classList.remove("is-on");
          var msg =
            (r && r.message) ||
            (r && r.ok
              ? channel === "smtp"
                ? "验证码已发送到邮箱，请查收（含垃圾箱）。"
                : "验证码已发送"
              : "发送失败");
          box.innerHTML =
            '<div class="alert ' +
            (r && r.ok ? "alert-success" : "alert-error") +
            '">' +
            msg +
            "</div>";
        })
        .catch(function (e) {
          box.innerHTML = '<div class="alert alert-error">' + (e.message || "失败") + "</div>";
        });
    });

    document.getElementById("form-register").addEventListener("submit", function (e) {
      e.preventDefault();
      var box = document.getElementById("reg-msg");
      if (!AI24X_API.isLocalAuthOpen()) {
        box.innerHTML = '<div class="alert alert-error">暂未开放。</div>';
        return;
      }
      var password = (document.querySelector('#form-register input[name="password"]').value || "").trim();
      var invite = (document.getElementById("reg-invite").value || "").trim();
      var payload = {
        password: password,
        email: (document.getElementById("reg-email").value || "").trim(),
        email_code: (document.getElementById("reg-email-code").value || "").trim(),
      };
      if (invite) payload.invite_code = invite;
      AI24X_API.authRegister(payload)
        .then(function () {
          location.href = "console.html";
        })
        .catch(function (err) {
          box.innerHTML = '<div class="alert alert-error">' + (err.message || "注册失败") + "</div>";
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
      if (AI24X_API.isLocalAuthOpen()) {
        var fs = document.getElementById("reg-fieldset");
        if (fs) fs.disabled = false;
        var ban = document.getElementById("auth-closed-banner");
        if (ban) {
          ban.innerHTML =
            "<strong>本地预览</strong>：邮箱注册已开放。未配置 SMTP 时验证码显示在下方卡片；配置 SMTP 后将发到真实邮箱。";
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付中心 - AI24X</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 支付页面特定样式 */
        .payment-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 20px;
        }

        .payment-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .payment-header {
            margin-bottom: 30px;
        }

        .payment-icon {
            font-size: 64px;
            color: #00d4ff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .payment-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .payment-subtitle {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .coming-soon-badge {
            display: inline-block;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 30px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
        }

        .payment-features {
            background: rgba(0, 212, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            color: #00d4ff;
            margin-right: 15px;
            font-size: 18px;
        }

        .feature-text {
            font-size: 16px;
        }

        .countdown-container {
            margin-bottom: 30px;
        }

        .countdown-title {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 15px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            min-width: 70px;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .countdown-label {
            font-size: 12px;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .early-access-form {
            margin-top: 30px;
        }

        .form-title {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .form-input::placeholder {
            color: #666666;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            color: #00ff88;
            text-align: center;
        }

        .success-message i {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .payment-card {
                padding: 25px;
            }
            
            .payment-title {
                font-size: 28px;
            }
            
            .payment-subtitle {
                font-size: 16px;
            }
            
            .countdown {
                gap: 10px;
            }
            
            .countdown-item {
                min-width: 60px;
                padding: 10px;
            }
            
            .countdown-number {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .payment-card {
                padding: 20px;
            }
            
            .payment-title {
                font-size: 24px;
            }
            
            .payment-features {
                padding: 20px;
            }
            
            .countdown {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-card">
            <div class="payment-header">
                <div class="payment-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="payment-title">AI24X 支付中心</h1>
                <p class="payment-subtitle">
                    安全、便捷的支付体验即将上线<br>
                    为您的AI之旅提供强大支持
                </p>
                <div class="coming-soon-badge">
                    <i class="fas fa-rocket"></i> 支付功能 3月25日 正式上线
                </div>
            </div>

            <div class="payment-features">
                <div class="feature-item">
                    <i class="fas fa-shield-alt feature-icon"></i>
                    <span class="feature-text">银行级安全加密，保障您的资金安全</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-bolt feature-icon"></i>
                    <span class="feature-text">极速支付处理，1秒内完成交易</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-globe feature-icon"></i>
                    <span class="feature-text">支持多种支付方式（微信、支付宝、银行卡）</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-headset feature-icon"></i>
                    <span class="feature-text">7×24小时客服支持，随时为您服务</span>
                </div>
            </div>

            <div class="countdown-container">
                <div class="countdown-title">支付功能上线倒计时</div>
                <div class="countdown">
                    <div class="countdown-item">
                        <div class="countdown-number" id="days">08</div>
                        <div class="countdown-label">天</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="hours">00</div>
                        <div class="countdown-label">时</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="minutes">00</div>
                        <div class="countdown-label">分</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="seconds">00</div>
                        <div class="countdown-label">秒</div>
                    </div>
                </div>
            </div>

            <div class="early-access-form">
                <div class="form-title">抢先体验名额申请</div>
                <p style="color: #a0a0a0; font-size: 14px; margin-bottom: 20px;">
                    填写信息，成为首批体验用户，享受专属优惠
                </p>
                
                <div class="form-group">
                    <input type="email" class="form-input" id="email" placeholder="请输入您的邮箱地址" required>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-input" id="name" placeholder="请输入您的姓名（可选）">
                </div>
                
                <button class="submit-btn" id="submitBtn" onclick="submitEarlyAccess()">
                    <i class="fas fa-paper-plane"></i> 申请抢先体验
                </button>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <div>申请已提交！我们将在支付功能上线前通知您</div>
                </div>
            </div>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> 返回首页
            </a>
        </div>
    </div>

    <script>
        // 倒计时功能
        function updateCountdown() {
            const targetDate = new Date('2026-03-25T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // 每秒钟更新倒计时
        setInterval(updateCountdown, 1000);
        updateCountdown(); // 立即执行一次

        // 抢先体验表单提交
        function submitEarlyAccess() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');

            // 简单的邮箱验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('请输入有效的邮箱地址');
                return;
            }

            // 禁用按钮，显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

            // 模拟API调用
            setTimeout(() => {
                // 保存到localStorage（实际项目中应该发送到服务器）
                const application = {
                    email: email,
                    name: name || '未提供',
                    timestamp: new Date().toISOString(),
                    status: 'pending'
                };
                
                // 获取现有申请或创建新数组
                let applications = JSON.parse(localStorage.getItem('ai24x_early_access') || '[]');
                applications.push(application);
                localStorage.setItem('ai24x_early_access', JSON.stringify(applications));

                // 显示成功消息
                successMessage.style.display = 'block';
                submitBtn.style.display = 'none';

                // 清空表单
                document.getElementById('email').value = '';
                document.getElementById('name').value = '';

                // 3秒后重置按钮
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 申请抢先体验';
                    submitBtn.style.display = 'block';
                    successMessage.style.display = 'none';
                }, 3000);

                // 控制台日志（开发用）
                console.log('Early access application submitted:', application);
                console.log('Total applications:', applications.length);
            }, 1500);
        }

        // 页面加载时检查是否有已保存的申请
        window.addEventListener('load', () => {
            const applications = JSON.parse(localStorage.getItem('ai24x_early_access') || '[]');
            if (applications.length > 0) {
                console.log(`已有 ${applications.length} 个抢先体验申请`);
            }
        });

        // 回车键提交表单
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement.id === 'email' || activeElement.id === 'name') {
                    submitEarlyAccess();
                }
            }
        });
    </script>
</body>
</html>

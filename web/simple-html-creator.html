<!DOCTYPE html>
<html>
<head>
    <title>HTML快速创建工具</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { background: #f5f5f5; padding: 30px; border-radius: 10px; }
        h1 { color: #2c3e50; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HTML快速创建工具</h1>
        <p>解决HTML文件创建卡死问题</p>
        
        <div class="form-group">
            <label for="filename">文件名:</label>
            <input type="text" id="filename" value="new-page.html" placeholder="例如: about.html">
        </div>
        
        <div class="form-group">
            <label for="title">页面标题:</label>
            <input type="text" id="title" value="我的新页面" placeholder="页面标题">
        </div>
        
        <div class="form-group">
            <label for="content">页面内容:</label>
            <textarea id="content" rows="5" placeholder="输入页面内容...">这是一个快速生成的HTML页面</textarea>
        </div>
        
        <button onclick="createHTML()">📄 创建HTML文件</button>
        
        <div id="result" style="margin-top: 20px;"></div>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">
            <h3>💡 解决卡死问题的技巧:</h3>
            <ul>
                <li>使用这个工具创建基础HTML文件</li>
                <li>禁用编辑器的自动格式化功能</li>
                <li>使用Notepad++等轻量级编辑器</li>
                <li>先创建小文件，再逐步添加内容</li>
                <li>避免在浏览器中直接编辑大HTML文件</li>
            </ul>
        </div>
    </div>
    
    <script>
        function createHTML() {
            const filename = document.getElementById('filename').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            
            const html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { 
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>${title}</h1>
    <p>${content}</p>
    <div class="footer">
        生成时间: ${new Date().toLocaleString()}
    </div>
</body>
</html>`;
            
            // 创建下载链接
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            
            // 显示结果
            document.getElementById('result').innerHTML = 
                `<p class="success">✅ HTML文件已创建: ${filename}</p>
                 <p>文件已下载到您的下载文件夹。</p>`;
        }
        
        // 页面加载时显示当前时间
        document.addEventListener('DOMContentLoaded', function() {
            const timeElement = document.createElement('p');
            timeElement.innerHTML = `当前时间: ${new Date().toLocaleString()}`;
            timeElement.style.color = '#666';
            timeElement.style.fontSize = '0.9em';
            document.querySelector('.container').appendChild(timeElement);
        });
    </script>
</body>
</html>

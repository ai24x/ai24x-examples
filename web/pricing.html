<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>价格计费 · AI24X</title>
  <link rel="stylesheet" href="css/base.css?v=20260726q" />
  <link id="theme-css" rel="stylesheet" href="css/themes/theme-blue.css?v=20260725a" data-base="css/themes/" />
</head>
<body data-page="pricing" class="theme-blue">
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <section class="hero hero-surface section-tight">
      <div class="container">
        <h1 data-i18n="page.pricing.title">价格计费</h1>
        <p class="lead" data-i18n="page.pricing.sub">选择适合你的 Token 套餐，微信或支付宝支付。</p>
        <p class="callout mt-2" data-i18n="page.pricing.callout">
          高性价比中国模型 API，按需选购额度与 Pro 权益。
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:980px;">
        <h2 style="margin:0 0 10px;" data-i18n="page.pricing.tokenTitle">Token 套餐</h2>
        <p class="sub" id="tokenPayStatus" style="margin:0 0 14px;">加载套餐中…</p>
        <p class="sub" id="tokenSettleHint" style="margin:0 0 14px;"></p>
        <div class="grid-3" id="tokenPlansGrid"></div>
        <div class="hero-cta" style="margin-top:14px;">
          <a class="btn btn-primary" href="console.html" data-i18n="page.pricing.ctaConsole">去控制台购买 / 管理 Key</a>
          <a class="btn" href="login.html?next=console.html" data-i18n="nav.login">登录</a>
        </div>
      </div>
    </section>

    <section class="section section-alt" id="settleSection">
      <div class="container" style="max-width:980px;">
        <h2 style="margin:0 0 10px;" data-i18n="page.pricing.settleTitle">支付方式</h2>
        <div class="grid-2">
          <div class="card">
            <h3 style="margin:0 0 8px;" data-i18n="page.pricing.settleCnTitle">微信支付 / 支付宝</h3>
            <p class="sub" style="margin:0;" data-i18n="page.pricing.settleCnBody">人民币结算，下单后在控制台完成支付。</p>
          </div>
          <div class="card">
            <h3 style="margin:0 0 8px;" data-i18n="page.pricing.settleIntlTitle">PayPal 等</h3>
            <p class="sub" style="margin:0;" data-i18n="page.pricing.settleIntlBody">国际用户可使用美元支付（国际站）。</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:980px;">
        <h2 style="margin:0 0 10px;">AI 行情官｜灯塔版</h2>
        <p class="sub" style="margin:0 0 14px;">
          信号查询额度（与上方 Token 钱包无关）。内容仅供学习交流，不构成任何建议。
        </p>
        <div class="grid-3">
          <div class="card">
            <h3 style="margin:0 0 8px;">体验卡</h3>
            <p class="sub" style="margin:0;">适合先体验流程与稳定性。</p>
            <p class="sub" style="margin:10px 0 0;">
              <a class="btn" href="http://127.0.0.1:18001/account.html#vip">本地开通</a>
              <a class="btn" href="https://a.ai24x.com/account.html#vip" target="_blank" rel="noopener">线上</a>
            </p>
          </div>
          <div class="card">
            <h3 style="margin:0 0 8px;">月卡</h3>
            <p class="sub" style="margin:0;">适合高频使用。</p>
            <p class="sub" style="margin:10px 0 0;">
              <a class="btn btn-primary" href="http://127.0.0.1:18001/account.html#vip">本地开通</a>
            </p>
          </div>
          <div class="card">
            <h3 style="margin:0 0 8px;">年卡</h3>
            <p class="sub" style="margin:0;">适合长期使用。</p>
            <p class="sub" style="margin:10px 0 0;">
              <a class="btn btn-primary" href="http://127.0.0.1:18001/demo.html">去体验</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="config/locales.js?v=20260726v"></script>
  <script src="js/api.js?v=20260726w"></script>
  <script src="js/i18n.js?v=20260726w"></script>
  <script src="js/shell.js?v=20260726v"></script>
  <script src="js/app.js?v=20260725a"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var grid = document.getElementById("tokenPlansGrid");
      var st = document.getElementById("tokenPayStatus");
      var settle = document.getElementById("tokenSettleHint");
      var payload = null;

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderPlans() {
        if (!payload || !grid) return;
        var plans = payload.plans || [];
        var pay = payload.pay || {};
        var zh = AI24X_API.isZhUi();
        st.textContent = zh
          ? pay.enabled
            ? "可在线支付：请到控制台选择微信或支付宝。"
            : pay.mock_allowed
              ? "当前为测试环境，可在控制台完成体验充值。"
              : "套餐可浏览；支付暂未开放，请稍后再试。"
          : pay.enabled
            ? "Online payment is available in the console."
            : pay.mock_allowed
              ? "Test environment: try a purchase in the console."
              : "Plans are listed; payment is not open yet.";
        if (settle) settle.textContent = AI24X_API.planSettleHint(plans[0]);
        grid.innerHTML = "";
        plans.forEach(function (p) {
          var card = document.createElement("div");
          card.className = "card";
          var bits = [];
          if (p.credit_tokens) bits.push(p.credit_tokens + " token");
          if (p.set_vip) {
            bits.push(
              zh
                ? "Token VIP" + (p.vip_days ? " " + p.vip_days + " 天" : "")
                : "Token VIP" + (p.vip_days ? " " + p.vip_days + "d" : "")
            );
          }
          var note = AI24X_API.planNote(p);
          var cta = zh ? "去控制台" : "Open console";
          card.innerHTML =
            "<h3 style=\"margin:0 0 8px;\">" +
            esc(AI24X_API.planTitle(p)) +
            "</h3>" +
            '<p class="sub" style="margin:0;"><strong>' +
            esc(AI24X_API.planPriceLabel(p)) +
            "</strong>" +
            (bits.length ? " · " + esc(bits.join(" · ")) : "") +
            "</p>" +
            (note ? '<p class="sub" style="margin:8px 0 0;">' + esc(note) + "</p>" : "") +
            '<p class="sub" style="margin:10px 0 0;"><a class="btn btn-primary" href="console.html">' +
            esc(cta) +
            "</a></p>";
          grid.appendChild(card);
        });
      }

      AI24X_API.billingPlans()
        .then(function (data) {
          payload = data;
          renderPlans();
        })
        .catch(function (e) {
          st.textContent = e.message || "套餐加载失败";
        });

      var langSel = document.getElementById("lang-select");
      if (langSel) {
        langSel.addEventListener("change", function () {
          renderPlans();
        });
      }
    });
  </script>
</body>
</html>

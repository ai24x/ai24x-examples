        /* 工具页面专用样式 */
        :root {
            --container-max-width: 1200px;
            --mobile-breakpoint: 768px;
            --tablet-breakpoint: 1024px;
        }
        
        .tools-container {
            max-width: var(--container-max-width);
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .tools-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .tools-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #00a8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .tools-header p {
            font-size: 1.1rem;
            color: #a0a0c0;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 搜索和过滤区域 */
        .tools-filters {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }
        
        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        .search-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }
        
        /* 分类标签 */
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        
        .category-tag {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 25px;
            color: #a0a0c0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-tag:hover,
        .category-tag.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
            color: white;
        }
        
        /* 排序选项 */
        .sort-options {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .sort-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            color: #a0a0c0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sort-button:hover,
        .sort-button.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            color: white;
        }
        
        /* 工具统计 */
        .tools-stats {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a0a0c0;
        }
        
        .stat-item i {
            color: #00d4ff;
        }
        
        .stat-value {
            font-weight: 600;
            color: white;
        }
        
        /* 工具网格布局 - 固定三列 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
            margin-bottom: 50px;
        }
        
        /* 平板设备：两列 */
        @media (max-width: 1024px) {
            .tools-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }
        
        /* 移动设备：单列 */
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        .tool-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            transition: all 0.4s;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
        }
        
        .tool-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .tool-icon {
            font-size: 2.5rem;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .tool-info {
            flex: 1;
        }
        
        .tool-info h3 {
            font-size: 1.3rem;
            color: white;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .tool-category {
            color: #00d4ff;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(0, 212, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .tool-description {
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
            font-size: 0.95rem;
        }
        
        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tool-tag {
            background: rgba(255, 255, 255, 0.08);
            color: #a0a0a0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tool-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }
        
        .tool-price {
            color: #00d4ff;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .tool-link {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        
        .tool-link:hover {
            background: linear-gradient(135deg, #0099cc, #00d4ff);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .tools-header h1 {
                font-size: 2rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .tool-card {
                padding: 20px;
            }
        }
    </style>

                        ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="tool-footer">
                        <span class="tool-price">💰 ${tool.id <= 6 ? '免费' : '付费'}</span>
                        <a href="${tool.link}" target="_blank" class="tool-link">探索 →</a>
                    </div>
                `;
                
                toolsGrid.appendChild(toolCard);
            });
        }
        
        // 移除动态加载头部的函数，因为现在使用硬编码头部
        
        // 搜索功能
        function searchTools(query) {
            const toolsGrid = document.getElementById('tools-grid');
            if (!toolsGrid) return;
            
            const normalizedQuery = query.toLowerCase().trim();
            
            if (!normalizedQuery) {
                generateToolCards();
                return;
            }
            
            const filteredTools = toolsData.filter(tool => {
                const searchText = `${tool.name} ${tool.description} ${tool.tags.join(' ')}`.toLowerCase();
                return searchText.includes(normalizedQuery);
            });
            
            toolsGrid.innerHTML = '';
            
            if (filteredTools.length === 0) {
                toolsGrid.innerHTML = `
                    <div class="no-results" style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
                        <i class="fas fa-search" style="font-size: 3rem; color: #ccc; margin-bottom: 20px;"></i>
                        <h3 style="color: #666; margin-bottom: 10px;">未找到相关工具</h3>
                        <p style="color: #999;">尝试使用其他关键词搜索</p>
                    </div>
                `;
                return;
            }
            
            filteredTools.forEach(tool => {
                const toolCard = document.createElement('div');
                toolCard.className = 'tool-card';
                
                toolCard.innerHTML = `
                    <div class="tool-header">
                        <div class="tool-icon">
                            <i class="fa ${tool.icon}"></i>
                        </div>
                        <div class="tool-info">
                            <h3>${tool.name}</h3>
                            <span class="tool-category">${tool.tags[0] || 'AI工具'}</span>
                        </div>
                    </div>
                    <p class="tool-description">${tool.description}</p>
                    <div class="tool-tags">
                        ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="tool-footer">
                        <span class="tool-price">💰 ${tool.id <= 6 ? '免费' : '付费'}</span>
                        <a href="${tool.link}" target="_blank" class="tool-link">探索 →</a>
                    </div>
                `;
                
                toolsGrid.appendChild(toolCard);
            });
        }
        
        // 处理URL中的搜索参数
        function handleSearchFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search');
            
            if (searchQuery) {
                // 设置搜索框的值
                const searchInput = document.getElementById('globalSearch');
                if (searchInput) {
                    searchInput.value = searchQuery;
                }
                
                // 执行搜索
                searchTools(searchQuery);
            } else {
                generateToolCards();
            }
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 不再动态加载头部，因为已经硬编码了
            generateToolCards();
            handleSearchFromURL();
            
            // 设置头部搜索框事件
            const searchInput = document.getElementById('globalSearch');
            const searchBtn = document.querySelector('.search-btn');
            
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const query = this.value.trim();
                        if (query) {
                            // 更新URL但不刷新页面
                            const newUrl = `/tools?search=${encodeURIComponent(query)}`;
                            window.history.pushState({}, '', newUrl);
                            searchTools(query);
                        }
                    }
                });
            }
            
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    const query = searchInput.value.trim();
                    if (query) {
                        const newUrl = `/tools?search=${encodeURIComponent(query)}`;
                        window.history.pushState({}, '', newUrl);
                        searchTools(query);
                    }
                });
            }
            
            // 设置大的搜索栏事件
            const mainSearchInput = document.getElementById('toolsMainSearch');
            const mainSearchBtn = document.querySelector('.tools-search-btn');
            
            if (mainSearchInput) {
                mainSearchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const query = this.value.trim();
                        if (query) {
                            // 同步头部搜索框
                            if (searchInput) {
                                searchInput.value = query;
                            }
                            
                            // 更新URL但不刷新页面
                            const newUrl = `/tools?search=${encodeURIComponent(query)}`;
                            window.history.pushState({}, '', newUrl);
                            searchTools(query);
                        }
                    }
                });
                
                // 聚焦时添加效果
                mainSearchInput.addEventListener('focus', function() {
                    this.style.boxShadow = '0 12px 40px rgba(0, 212, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2)';
                    this.style.borderColor = '#00d4ff';
                    this.style.background = 'rgba(255, 255, 255, 0.12)';
                });
                
                mainSearchInput.addEventListener('blur', function() {
                    this.style.boxShadow = '0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1)';
                    this.style.borderColor = 'rgba(0, 212, 255, 0.3)';
                    this.style.background = 'rgba(255, 255, 255, 0.08)';
                });
            }
            
            if (mainSearchBtn) {
                mainSearchBtn.addEventListener('click', function() {
                    const query = mainSearchInput.value.trim();
                    if (query) {
                        // 同步头部搜索框
                        if (searchInput) {
                            searchInput.value = query;
                        }
                        
                        const newUrl = `/tools?search=${encodeURIComponent(query)}`;
                        window.history.pushState({}, '', newUrl);
                        searchTools(query);
                    }
                });
            }
            
            // 热门搜索标签点击事件
            const searchTags = document.querySelectorAll('.search-tag');
            searchTags.forEach(tag => {
                // 添加悬停效果
                tag.addEventListener('mouseenter', function() {
                    this.style.background = 'rgba(0, 212, 255, 0.2)';
                    this.style.transform = 'translateY(-2px)';
                    this.style.boxShadow = '0 4px 12px rgba(0, 212, 255, 0.2)';
                });
                
                tag.addEventListener('mouseleave', function() {
                    this.style.background = 'rgba(0, 212, 255, 0.1)';
                    this.style.transform = 'translateY(0)';
                    this.style.boxShadow = 'none';
                });
                
                tag.addEventListener('click', function() {
                    const query = this.textContent.trim();
                    if (mainSearchInput) {
                        mainSearchInput.value = query;
                        mainSearchInput.focus();
                    }
                    if (searchInput) {
                        searchInput.value = query;
                    }
                    
                    const newUrl = `/tools?search=${encodeURIComponent(query)}`;
                    window.history.pushState({}, '', newUrl);
                    searchTools(query);
                });
            });
            
            // 搜索按钮悬停效果
            if (mainSearchBtn) {
                mainSearchBtn.addEventListener('mouseenter', function() {
                    this.style.background = 'linear-gradient(135deg, #0099cc, #00d4ff)';
                    this.style.transform = 'translateY(-2px)';
                    this.style.boxShadow = '0 4px 15px rgba(0, 212, 255, 0.4)';
                });
                
                mainSearchBtn.addEventListener('mouseleave', function() {
                    this.style.background = 'linear-gradient(135deg, #00d4ff, #0099cc)';
                    this.style.transform = 'translateY(0)';
                    this.style.boxShadow = 'none';
                });
            }
            
            // 高亮当前页面菜单项
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath || (currentPath.startsWith(href) && href !== '/')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>

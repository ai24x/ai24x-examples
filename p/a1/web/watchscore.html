<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="robots" content="index,follow" />
  <title>自选评分榜 · AI行情官｜灯塔版</title>
  <meta name="description" content="AI行情官｜灯塔版 自选评分榜：对自选股做技术面量化评分（MACD、均线、量能、异动、位置、趋势），仅供选股参考，不构成投资建议。" />
  <link rel="icon" href="data:," />
  <script>
    (function () {
      try {
        var k = "ai24x_a_theme";
        var t = String(localStorage.getItem(k) || "").trim() || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/base.css?v=44" />
  <link rel="stylesheet" href="/css/tool.css" />
  <style>
    .auth-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;max-width:440px;}
    @media (max-width:520px){ .auth-card-grid{ grid-template-columns: 1fr; } }
    .auth-card{
      display:block;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
      background:var(--panel2);text-decoration:none;color:inherit;
    }
    .auth-card.is-selected{border-color:rgba(244,63,94,.55);background:rgba(244,63,94,.12);}
    .auth-card .t{font-weight:900;font-size:13px;}
    .auth-card .d{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.45;}
    .score-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;}
    .wl-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(148,163,184,.05);
    }
    .wl-name { font-weight: 700; font-size: 14px; }
    .wl-code { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
    .wl-score-table th, .wl-score-table td {
      padding: 7px 9px; border-bottom: 1px solid rgba(148,163,184,.15);
      text-align: left; vertical-align: top;
    }
    .wl-score-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 620px; }
    .wl-score-table thead th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    .wl-score-table td.wl-risk { color: #f87171; }
    .wl-score-high { color: #f43f5e; font-weight: 800; }
    .wl-score-mid { color: #fbbf24; font-weight: 700; }
    .wl-score-low { color: #94a3b8; font-weight: 600; }
    body.embed .site-header, body.embed .site-footer { display: none !important; }
    body.embed .wl-back { display: none !important; }
    body.embed .page-main { padding-top: 4px; }
    body.embed .card > h1 { display: none; }
    .wl-kline { color: #be123c; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .wl-kline.wk-high { color: #f43f5e; }
    .wl-kline.wk-mid { color: #f59e0b; }
    .wl-kline.wk-low { color: #94a3b8; }
    .wl-kline:hover { text-decoration: underline; }
    #wl-market { margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.7; }
    #wl-market .mkt-label { color:#f43f5e; font-weight:800; }
    #wl-market .mkt-state { font-weight:700; }
    #wl-market .mkt-up { color:#f43f5e; }
    #wl-market .mkt-down { color:#3b82f6; }
    #wl-market .mkt-flat { color:#94a3b8; }
    .wl-score-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:0 0 6px; font-size:12px; color:var(--muted); }
    .wl-table-scroll { max-height:460px; overflow:auto; border:1px solid rgba(148,163,184,.15); border-radius:10px; }
    body.embed .wl-table-scroll { max-height:380px; }
    .wl-score-table thead th { position:sticky; top:0; z-index:1; background:var(--panel); box-shadow:0 1px 0 rgba(148,163,184,.2); }
    .wl-score-table td.wl-tags, .wl-score-table td.wl-risk { max-width:210px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wl-score-table td.wl-rank { width:34px; color:var(--muted); }
    .wl-score-table td.wl-score-col { width:60px; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="page-main">
    <div class="wrap">
      <section class="card">
        <h1>自选评分榜</h1>
        <p class="sub" style="margin:0 0 12px;">仅对您自选的标的做<strong>公开技术指标统计</strong>（MACD、均线、量能、RSI、波动等常规指标，0-100 综合分），仅供自主决策参考，<strong>不构成证券投资咨询，不构成任何买卖建议</strong>。</p>

        <div id="auth-guest" hidden>
          <p class="sub" style="margin:0 0 4px;">登录后同步服务端自选并自动生成评分榜。</p>
          <div class="auth-card-grid">
            <a class="auth-card is-selected" href="./index.html?mode=login&amp;ch=phone">
              <div class="t">去登录</div>
              <div class="d">手机号或邮箱登录</div>
            </a>
            <a class="auth-card" href="./index.html?mode=register&amp;ch=phone">
              <div class="t">去注册</div>
              <div class="d">新用户注册</div>
            </a>
          </div>
          <p class="sub" style="margin:12px 0 0;">
            <a class="btn wl-back" href="./demo.html">← 返回行情页</a>
          </p>
        </div>

        <div id="auth-user" hidden>
          <div class="score-top">
            <span class="muted small" id="wl-account">加载账号…</span>
            <span style="display:flex; gap:8px; align-items:center;">
              <a class="btn wl-back" href="./demo.html">← 返回行情</a>
              <button class="btn" id="btn-wl-scores" type="button">刷新评分</button>
            </span>
          </div>
          <div class="status" id="wl-status" style="margin:0 0 4px;"></div>
          <div id="wl-market" style="margin:0 0 10px; display:none;"></div>
          <div id="wl-list"></div>
          <div class="hint" id="wl-score-hint" style="margin-top:10px; display:none;"></div>
          <div id="wl-score-wrap" style="margin-top:10px;"></div>
          <p class="sub" style="margin:14px 0 0; font-size:12px; line-height:1.7;">本页仅对您自选的标的做公开技术指标统计，不构成证券投资咨询与任何买卖建议；技术指标存在滞后与失效风险，历史表现不代表未来，股市有风险，入市需谨慎，据此操作风险自负。</p>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/shell.js?v=46"></script>
  <script>
    try { window.AI24X_A_SHELL && window.AI24X_A_SHELL.mount(""); } catch (e) {}
  </script>
  <script>
    (function () {
      var TOKEN_KEY = "ai24x_a_token";
      function apiBase() {
        try {
          var q = "";
          try { q = String(location.search || ""); } catch (eQ) { q = ""; }
          if (q && q.indexOf("api_base=") >= 0) {
            var m = q.match(/[?&]api_base=([^&]+)/);
            if (m && m[1]) {
              var u = decodeURIComponent(m[1]);
              u = String(u || "").trim().replace(/\/$/, "");
              if (u) {
                try { localStorage.setItem("ai24x_a_api_base", u); } catch (eS) {}
                return u;
              }
            }
          }
        } catch (e0) {}
        try {
          var saved = "";
          try { saved = String(localStorage.getItem("ai24x_a_api_base") || ""); } catch (e1) { saved = ""; }
          saved = saved.trim().replace(/\/$/, "");
          if (saved) return saved;
        } catch (e2) {}
        try {
          var host = String(location.hostname || "");
          var port = String(location.port || "");
          if ((host === "127.0.0.1" || host === "localhost") && port === "18001") return "http://127.0.0.1:18011";
        } catch (e3) {}
        return "";
      }
      var base = apiBase();
      function tokenGet() {
        try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
      }
      function $(id) { return document.getElementById(id); }
      function apiFetch(path, opt) {
        opt = opt || {};
        opt.headers = opt.headers || {};
        var t = tokenGet();
        if (t) opt.headers.Authorization = "Bearer " + t;
        return fetch((base || "") + path, opt).then(function (r) {
          return r.text().then(function (txt) {
            var j = null;
            try { j = txt ? JSON.parse(txt) : null; } catch (e0) { j = null; }
            if (!r.ok) {
              var detail = "";
              if (j && j.detail != null) {
                detail = typeof j.detail === "string" ? j.detail : (function () {
                  try { return JSON.stringify(j.detail); } catch (e1) { return ""; }
                })();
              }
              var err = new Error(detail || txt || ("HTTP " + r.status));
              try { err.status = r.status; } catch (e2) {}
              throw err;
            }
            return j;
          });
        });
      }

      var wlItems = [];
      function wlStatus(s, isErr) {
        var el = $("wl-status");
        if (!el) return;
        el.textContent = s || "";
        el.style.color = isErr ? "#f87171" : "";
      }
      function escWl(s) {
        if (!s) return "";
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function loadAccountLine() {
        var el = $("wl-account");
        if (!el) return;
        apiFetch("/api/me").then(function (d) {
          var u = (d && d.user) || {};
          var idv = String(u.email || u.phone || "").trim();
          el.textContent = "当前账号：" + (idv || ("#" + (u.id != null ? u.id : "?"))) + " · 自选以服务端为准（跨设备同步）";
        }).catch(function () {
          el.textContent = "当前账号读取失败，请确认已登录";
        });
      }
      function renderWlList() {
        var box = $("wl-list");
        if (!box) return;
        if (!wlItems.length) {
          box.innerHTML = '<div class="muted small" style="padding:6px 0;">暂无自选。到 <a href="./demo.html">行情页</a> 查询并点「加自选」后，这里自动生成评分榜。</div>';
          return;
        }
        var html = '<div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">';
        for (var i = 0; i < wlItems.length; i++) {
          var it = wlItems[i];
          html += '<div class="wl-row"><span class="wl-name">' + escWl(it.name || it.code || "") + '</span>'
            + '<span class="wl-code">' + escWl(it.code || "") + '</span>'
            + '<span class="muted small" style="margin-left:auto;">' + (i + 1) + '</span></div>';
        }
        html += '</div>';
        box.innerHTML = html;
      }
      function loadWlScores() {
        var wrap = $("wl-score-wrap");
        var hint = $("wl-score-hint");
        if (!wrap) return;
        if (!wlItems.length) { wlStatus("请先添加自选股", true); return; }
        wrap.innerHTML = '<div class="muted small">评分计算中…（约几秒，最多 12 秒）</div>';
        apiFetch("/api/watchlist/scores").then(function (d) {
          var items = (d && d.items) || [];
          if (hint) {
            hint.style.display = "";
            hint.textContent = "共 " + items.length + " 只标的参与技术指标统计；点名称可新窗口查看 K 线。个别标的获取超时显示 —，可点「刷新评分」重试。统计按自然日同票去重扣次，仅为技术规则量化结果，不构成投资建议。";
          }
          renderMarket(d.market);
          renderWlScores(items);
        }).catch(function (e) {
          wrap.innerHTML = "";
          wlStatus("评分失败：" + (e && e.message || "网络错误"), true);
        });
      }
      function renderMarket(m) {
        var el = $("wl-market");
        if (!el) return;
        if (!m || !m.name) { el.style.display = "none"; return; }
        var pts = Number(m.pts || 0);
        var cls = pts >= 2 ? "mkt-up" : (pts <= -2 ? "mkt-down" : "mkt-flat");
        var lbl = pts >= 2 ? "顺风" : (pts <= -2 ? "逆风" : "中性");
        el.style.display = "";
        el.innerHTML = '<span class="mkt-label">大盘环境</span>：<span class="mkt-state ' + cls + '">' + escWl(lbl) + '</span>（' + escWl(m.name) + '：' + escWl((m.tags || []).join(" / ")) + '）';
      }
      function renderWlScores(items) {
        var wrap = $("wl-score-wrap");
        if (!wrap) return;
        if (!items.length) {
          wrap.innerHTML = '<div class="muted small">暂无评分结果（标的可能缺少足够 K 线历史）。</div>';
          return;
        }
        var ok = 0, sum = 0, high = 0;
        for (var i = 0; i < items.length; i++) {
          if (items[i].error) continue;
          ok++; sum += Number(items[i].score || 0);
          if (Number(items[i].score || 0) >= 70) high++;
        }
        var avg = ok ? (sum / ok).toFixed(1) : "—";
        var html = '<div class="wl-score-head"><span>共 <b>' + items.length + '</b> 只 · 有效 <b>' + ok + '</b> 只 · 平均分 <b>' + avg + '</b> · 高分(≥70) <b>' + high + '</b> 只</span></div>';
        html += '<div class="wl-table-scroll"><table class="wl-score-table"><thead><tr><th>#</th><th>代码</th><th>名称</th><th>综合分</th><th>技术信号</th><th>风险提示</th></tr></thead><tbody>';
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var err = String(it.error || "");
          var sc = Number(it.score || 0);
          var cls = err ? "wl-score-low" : (sc >= 70 ? "wl-score-high" : (sc >= 45 ? "wl-score-mid" : "wl-score-low"));
          var nameCls = err ? "wk-low" : (sc >= 70 ? "wk-high" : (sc >= 45 ? "wk-mid" : "wk-low"));
          var arrow = err ? "" : (sc >= 70 ? " ↗" : (sc >= 45 ? " →" : " ↘"));
          var tags = escWl((it.tags || []).join(" / "));
          var risks = escWl((it.risks || []).join(" / "));
          var link = './demo.html?secid=' + encodeURIComponent(it.secid || '') + '&period=day';
          html += '<tr><td class="wl-rank">' + (i + 1) + '</td>'
            + '<td class="wl-code">' + escWl(it.code || "") + '</td>'
            + '<td><a class="wl-kline ' + nameCls + '" href="' + link + '" target="_blank" rel="noopener" title="新窗口查看 K 线">' + escWl(it.name || "") + arrow + '</a></td>'
            + '<td class="wl-score-col"><span class="' + cls + '">' + (err ? "—" : sc.toFixed(0)) + '</span></td>'
            + '<td class="wl-tags" title="' + tags + '">' + (tags || "—") + '</td>'
            + '<td class="wl-risk" title="' + risks + '">' + (risks || (err ? "数据获取超时，点「刷新评分」重试" : "—")) + '</td></tr>';
        }
        html += '</tbody></table></div>';
        wrap.innerHTML = html;
      }
      function loadWatchlist(force) {
        if (!tokenGet()) return;
        var now = Date.now();
        if (!force && now - wlLastLoad < 4000) return;
        wlLastLoad = now;
        apiFetch("/api/watchlist").then(function (d) {
          wlItems = (d && d.items) || [];
          renderWlList();
          if (wlItems.length) loadWlScores();
          else {
            var wrap = $("wl-score-wrap");
            if (wrap) wrap.innerHTML = '<div class="muted small">暂无自选，添加后自动生成技术指标统计。</div>';
            var mEl = $("wl-market"); if (mEl) mEl.style.display = "none";
          }
        }).catch(function (e) {
          wlStatus("自选加载失败：" + (e && e.message ? e.message : "网络错误"), true);
        });
      }
      var wlLastLoad = 0;
      function boot() {
        try {
          if (/[?&]embed=1/.test(String(location.search || ""))) {
            document.body.classList.add("embed");
            var hd = document.getElementById("site-header");
            var ft = document.getElementById("site-footer");
            if (hd) hd.style.display = "none";
            if (ft) ft.style.display = "none";
          }
        } catch (eE) {}
        var logged = !!tokenGet();
        var guest = $("auth-guest");
        var user = $("auth-user");
        if (!logged) {
          if (guest) guest.hidden = false;
          if (user) user.hidden = true;
          return;
        }
        if (guest) guest.hidden = true;
        if (user) user.hidden = false;
        loadAccountLine();
        loadWatchlist(true);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
      var btn = $("btn-wl-scores");
      if (btn) btn.addEventListener("click", loadWlScores);
    })();
  </script>
</body>
</html>

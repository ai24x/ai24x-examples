<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>AI行情官·手机版｜一屏看行情</title>
<style>
:root{
  --bg:#0b1220;--panel:#101a2c;--panel2:#152238;--border:#22314d;
  --text:#e6edf7;--muted:#8aa0bf;--accent:#3b82f6;--up:#f03a52;--down:#00b578;
  --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
button{background:none;border:none;color:var(--text);cursor:pointer;font-size:14px;padding:6px 10px}
input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px;outline:none;width:100%}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.topbar .home{font-size:13px;color:var(--muted);white-space:nowrap}
.topbar .search{flex:1;position:relative}
.topbar .search .go{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px;padding:4px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:10px;max-height:52dvh;overflow-y:auto;z-index:60;display:none}
.suggest.show{display:block}
.suggest .sg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(148,163,184,.12);font-size:14px}
.suggest .sg:last-child{border-bottom:none}
.suggest .sg .nm{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .sg .cd{color:var(--muted);font-size:12px;white-space:nowrap}
.topbar .fav-toggle{font-size:20px;color:var(--gold)}
.topbar .more{font-size:18px;color:var(--muted)}
.quote-strip{display:flex;align-items:baseline;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.quote-strip .nm{font-size:15px;font-weight:700;white-space:nowrap}
.quote-strip .px{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.quote-strip .chg{font-size:13px;font-weight:700;white-space:nowrap}
.quote-strip .fund{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.env-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 10px;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none}
.env-strip::-webkit-scrollbar{display:none}
.env-chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer}
.env-chip.active{border-color:var(--accent);color:var(--text)}
.env-chip b{color:var(--text)}
.chart-main{flex:1 1 54%;min-height:0;position:relative;background:var(--bg);padding:0 8px 0 4px}
.chart-macd{flex:0 0 15%;min-height:0;border-top:1px solid var(--border);background:var(--bg);position:relative;padding:0 8px 0 4px}
canvas{width:100%;height:100%;display:block}
.chart-legend{position:absolute;left:14px;top:6px;font-size:11px;color:var(--muted);pointer-events:none;white-space:nowrap}
.bottombar{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border)}
.bottombar .grp{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.bottombar .grp button{padding:6px 10px;border-radius:6px;font-size:13px;color:var(--muted)}
.bottombar .grp button.on{background:var(--accent);color:#fff}
.bottombar .act{font-size:13px;color:var(--text)}
.bottombar .act.signal{color:var(--gold)}
.bottombar .spacer{flex:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50}
.sheet.show{display:block}
.sheet .card{position:absolute;left:0;right:0;bottom:0;max-height:70dvh;overflow-y:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .card h3{font-size:15px;margin-bottom:10px}
.sheet .card .close{position:absolute;right:12px;top:12px;font-size:18px;color:var(--muted)}
.sig-row{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(148,163,184,.15);font-size:13px}
.sig-row:last-child{border-bottom:none}
.sig-row .d{color:var(--muted);white-space:nowrap}
.sig-row .s{color:var(--gold);font-weight:700;white-space:nowrap}
.sig-row .t{color:var(--text);text-align:right;flex:1}
.tip-text{font-size:12px;color:var(--muted);line-height:1.9}
.tip-text b{color:var(--gold)}
.empty{color:var(--muted);font-size:13px;padding:12px 2px}
</style>
</head>
<body>

<div class="topbar">
  <button class="home" id="btn-home">首页</button>
  <div class="search">
    <input id="q" placeholder="代码/名称，如 600519、贵州茅台" enterkeyhint="search" autocomplete="off" />
    <button class="go" id="btn-go">搜</button>
    <div class="suggest" id="suggest"></div>
  </div>
  <button class="fav-toggle" id="btn-fav" title="自选">☆</button>
  <button class="more" id="btn-more" title="更多">⋯</button>
</div>

<div class="quote-strip" id="quote-strip">
  <span class="nm" id="q-nm">上证指数</span>
  <span class="px" id="q-px">--</span>
  <span class="chg" id="q-chg">--</span>
  <span class="fund" id="q-fund"></span>
</div>

<div class="env-strip" id="env-strip"></div>

<div class="chart-main">
  <div class="chart-legend" id="k-legend">均线 · 信号标注</div>
  <canvas id="k-canvas"></canvas>
</div>

<div class="chart-macd">
  <div class="chart-legend" id="m-legend">量能</div>
  <canvas id="m-canvas"></canvas>
</div>

<div class="bottombar">
  <div class="grp" id="period-grp">
    <button data-p="day" class="on">日线</button>
    <button data-p="week">周线</button>
    <button data-p="month">月线</button>
  </div>
  <button class="act signal" id="btn-signal">信号</button>
  <div class="spacer"></div>
  <button class="act" id="btn-desktop">桌面版</button>
</div>

<div class="sheet" id="sheet-signal">
  <div class="card">
    <button class="close" id="close-signal">×</button>
    <h3>近期信号</h3>
    <div id="sig-list"><div class="empty">加载中…</div></div>
    <h3 style="margin-top:14px">信号说明</h3>
    <div class="tip-text">
      <b>底/金信号</b>：波段底部或均线金叉提示，代表转强迹象；<br/>
      <b>风险信号</b>：高位风险提示，代表需谨慎；<br/>
      信号仅供参考，<b>不构成投资建议</b>。
    </div>
  </div>
</div>

<div class="sheet" id="sheet-more">
  <div class="card">
    <button class="close" id="close-more">×</button>
    <h3>自选列表</h3>
    <div id="fav-list"><div class="empty">暂无自选，点击 ☆ 收藏</div></div>
    <h3 style="margin-top:14px">使用要领</h3>
    <div class="tip-text">
      ① 底部「信号」可查看近期信号明细；<br/>
      ② 上方「首页」返回 AI行情官主站（登录后自动生效）；<br/>
      ③ 上方大盘条可点击切换上证/深证/中证/北证；<br/>
      ④ 双指缩放：横=K线根数（20~200），竖=价格区间；<br/>
      ⑤ 行情仅供参考，<b>不构成投资建议</b>。
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var TOKEN_KEY = "ai24x_a_token";
function token(){ try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } }
function api(path, qs){
  var url = path + (qs ? ("?" + qs) : "");
  var h = { "Content-Type": "application/json" };
  var t = token(); if (t) h["Authorization"] = "Bearer " + t;
  return fetch(url, { headers: h }).then(function(r){ return r.json().catch(function(){ return {}; }); });
}
function fmt(n){ return (n==null||isNaN(n)) ? "--" : Number(n).toFixed(2); }
function fmtBig(n){ if(n==null||isNaN(n)) return ""; var v=Number(n); var a=Math.abs(v); var s=v<0?"-":"+"; if(a>=1e8) return s+(a/1e8).toFixed(2)+"亿"; if(a>=1e4) return s+(a/1e4).toFixed(1)+"万"; return s+a.toFixed(0); }
function firstEntry(d){
  try {
    var data = d && d.data;
    if (!data) return null;
    var keys = Object.keys(data);
    for (var i=0;i<keys.length;i++){
      var v = data[keys[i]];
      if (v && typeof v === "object" && !Array.isArray(v)) return v;
    }
  } catch(e){}
  return null;
}

var state = { secid: "1.000001", period: "day", name: "上证指数", favs: [], vis: 80, zoom: 1 };
try{ state.favs = JSON.parse(localStorage.getItem("ai24x_m_favs") || "[]"); }catch(e){ state.favs = []; }
var sigCache = [];
var cacheRows = null, cacheSigs = [];

function codeToSecid(code){
  code = String(code).trim();
  if (/^\d{6}$/.test(code)) {
    if (code.startsWith("6") || code.startsWith("9") || code.startsWith("4") || code.startsWith("8")) return "1." + code;
    return "0." + code;
  }
  if (/^\d+\.\d{6}$/.test(code)) return code;
  return null;
}

/* ===== 搜索（名称/代码，走 /api/suggest） ===== */
function apiSuggest(kw){
  return api("/api/suggest", "q=" + encodeURIComponent(kw) + "&include_plates=1").then(function(json){
    var rows = (json && json.QuotationCodeTable && json.QuotationCodeTable.Data) || [];
    var out = [], seen = {};
    rows.forEach(function(r){
      var qid = String(r.QuoteID || "");
      var cl = String(r.Classify || "");
      if (!/^[01]\.\d{6}$/.test(qid)) return;
      if (cl !== "AStock" && cl !== "NEEQ" && cl !== "Index") return;
      if (seen[qid]) return; seen[qid] = 1;
      out.push({ qid: qid, name: String(r.Name || r.Code || qid), code: String(r.Code || "") });
    });
    return out.slice(0, 8);
  }).catch(function(){ return []; });
}
var qEl = document.getElementById("q");
var suggestEl = document.getElementById("suggest");
function hideSuggest(){ suggestEl.classList.remove("show"); suggestEl.innerHTML = ""; }
function showSuggest(list){
  if (!list.length){ hideSuggest(); return; }
  suggestEl.innerHTML = "";
  list.forEach(function(it){
    var d = document.createElement("div"); d.className = "sg";
    d.innerHTML = '<span class="nm">' + it.name + '</span><span class="cd">' + (it.code || it.qid) + '</span>';
    d.addEventListener("click", function(){ goto(it.qid, it.name); hideSuggest(); });
    suggestEl.appendChild(d);
  });
  suggestEl.classList.add("show");
}
var suggestTimer = null;
qEl.addEventListener("input", function(){
  var v = qEl.value.trim();
  clearTimeout(suggestTimer);
  if (!v){ hideSuggest(); return; }
  suggestTimer = setTimeout(function(){ apiSuggest(v).then(showSuggest); }, 300);
});
document.addEventListener("click", function(e){ if (!e.target.closest(".search")) hideSuggest(); });
function doSearch(){
  var v = qEl.value.trim();
  if (!v) return;
  var secid = codeToSecid(v);
  if (secid){ goto(secid, v); hideSuggest(); return; }
  apiSuggest(v).then(function(list){
    if (list.length){ var it = list[0]; goto(it.qid, it.name); hideSuggest(); }
    else { qEl.placeholder = "未找到，请输入6位代码或名称"; hideSuggest(); }
  });
}
document.getElementById("btn-go").addEventListener("click", doSearch);
qEl.addEventListener("keydown", function(e){ if (e.key === "Enter") doSearch(); });

/* ===== 报价 ===== */
function loadQuote(){
  api("/api/quote/snapshot", "secid=" + encodeURIComponent(state.secid)).then(function(d){
    var o = firstEntry(d) || {};
    var px = o.price ?? o.close ?? o.last ?? null;
    var chg = o.change_pct ?? o.pct ?? o.change_percent ?? null;
    var fund = o.main_net_inflow ?? o.fund_net ?? o.mainflow ?? null;
    var nm = o.name || state.name;
    state.name = nm;
    document.getElementById("q-nm").textContent = nm;
    document.getElementById("q-px").textContent = fmt(px);
    var chgEl = document.getElementById("q-chg");
    if (chg != null) {
      var c = Number(chg);
      chgEl.textContent = (c>=0?"+":"") + c.toFixed(2) + "%";
      chgEl.style.color = c>=0 ? "var(--up)" : "var(--down)";
      document.getElementById("q-px").style.color = c>=0 ? "var(--up)" : "var(--down)";
    }
    document.getElementById("q-fund").textContent = fund!=null ? ("主力 " + fmtBig(fund)) : "";
  }).catch(function(){});
}

/* ===== 大盘环境条（上证/深证/中证/北证，可点击切换，无占位横杠） ===== */
var ENV = [["1.000001","上证指数"],["0.399001","深证成指"],["1.000852","中证1000"],["0.899050","北证50"]];
function loadEnv(){
  var el = document.getElementById("env-strip"); el.innerHTML = "";
  ENV.forEach(function(e, i){
    var chip = document.createElement("div"); chip.className = "env-chip";
    chip.dataset.secid = e[0]; chip.dataset.name = e[1];
    chip.innerHTML = e[1];
    if (e[0] === state.secid) chip.classList.add("active");
    chip.addEventListener("click", function(){
      if (state.secid === this.dataset.secid) return;
      goto(this.dataset.secid, this.dataset.name);
      var cs = el.querySelectorAll(".env-chip"); cs.forEach(function(c){ c.classList.toggle("active", c === chip); });
    });
    el.appendChild(chip);
    api("/api/quote/snapshot", "secid=" + e[0]).then(function(d){
      var o = firstEntry(d) || {};
      var c = o.change_pct ?? o.pct ?? null;
      if (c != null) chip.innerHTML = e[1] + " <b style='color:" + (c>=0?"var(--up)":"var(--down)") + "'>" + (c>=0?"+":"") + Number(c).toFixed(2) + "%</b>";
    }).catch(function(){});
  });
}

/* ===== K线（带 period 参数；遍历兼容 day/qfqday/week/qfqweek/month/qfqmonth 全字段） ===== */
var COUNT = { day: 400, week: 560, month: 660 };
var KLINE_KEYS = ["qfqday","day","qfqweek","week","qfqmonth","month"];
function loadKline(){
  var cnt = COUNT[state.period] || 400;
  return api("/api/kline", "secid=" + encodeURIComponent(state.secid) + "&period=" + encodeURIComponent(state.period) + "&count=" + cnt).then(function(d){
    var rows = null;
    if (d && d.data) {
      var prefer = state.period === "week" ? ["week","qfqweek"]
                 : state.period === "month" ? ["month","qfqmonth"]
                 : ["day","qfqday"];
      var keys = Object.keys(d.data);
      for (var p=0;p<prefer.length && !rows;p++){
        for (var i=0;i<keys.length;i++){
          var v = d.data[keys[i]];
          if (!v || typeof v !== "object" || Array.isArray(v)) continue;
          var a = v[prefer[p]];
          if (Array.isArray(a) && a.length){ rows = a; break; }
        }
      }
      if (!rows) {
        for (var i2=0;i2<KLINE_KEYS.length && !rows;i2++){
          for (var j=0;j<keys.length;j++){
            var v2 = d.data[keys[j]];
            if (!v2 || typeof v2 !== "object" || Array.isArray(v2)) continue;
            var a2 = v2[KLINE_KEYS[i2]];
            if (Array.isArray(a2) && a2.length){ rows = a2; break; }
          }
        }
      }
    }
    if (!rows || !rows.length) throw new Error("no data");
    return rows.map(function(r){ return { t:r[0], o:+r[1], c:+r[2], h:+r[3], l:+r[4], v:+r[5] }; });
  });
}

function sma(arr, p){
  var out = new Array(arr.length).fill(null); var s = 0;
  for (var i=0;i<arr.length;i++){ s += arr[i]; if (i>=p) s -= arr[i-p]; if (i>=p-1) out[i] = s/p; }
  return out;
}
function ema(arr, p){
  var out = new Array(arr.length).fill(null); var k = 2/(p+1); var prev = null;
  for (var i=0;i<arr.length;i++){ prev = (prev==null) ? arr[i] : arr[i]*k + prev*(1-k); out[i] = prev; }
  return out;
}
function macd(rows){
  var closes = rows.map(function(r){ return r.c; });
  var e12 = ema(closes,12), e26 = ema(closes,26);
  var dif = closes.map(function(_,i){ return (e12[i]!=null&&e26[i]!=null) ? e12[i]-e26[i] : null; });
  var dea = ema(dif.filter(function(v){return v!=null;}), 9);
  var deaFull = new Array(closes.length).fill(null); var j=0;
  for (var i=0;i<closes.length;i++){ if (dif[i]!=null){ deaFull[i]=dea[j]; j++; } }
  var hist = closes.map(function(_,i){ return (dif[i]!=null&&deaFull[i]!=null) ? (dif[i]-deaFull[i])*2 : null; });
  return { dif: dif, dea: deaFull, hist: hist };
}

/* ===== 信号（data.markers，保留 shape/position/color，带 period 参数） ===== */
function classifySig(text){
  text = String(text || "");
  if (text.indexOf("底") >= 0) return { label: "底信号", color: "#fbbf24" };
  if (text.indexOf("金") >= 0) return { label: "金信号", color: "#fbbf24" };
  if (text.indexOf("风险") >= 0 || text.indexOf("降") >= 0 || text.indexOf("量") >= 0 || text.indexOf("转") >= 0) return { label: "提示", color: "#60a5fa" };
  return { label: text || "信号", color: "#60a5fa" };
}
function loadSignals(){
  return api("/api/signals", "secid=" + encodeURIComponent(state.secid) + "&period=" + encodeURIComponent(state.period) + "&count=400").then(function(d){
    var arr = (d && d.data && Array.isArray(d.data.markers)) ? d.data.markers : [];
    sigCache = arr.map(function(m){
      var c = classifySig(m.text);
      return { date: m.time || m.date || "", label: c.label, color: m.color || c.color, note: m.text || "", shape: m.shape || "circle", position: m.position || "belowBar" };
    });
    return sigCache;
  }).catch(function(){ sigCache = []; return []; });
}
function renderSigList(){
  var el = document.getElementById("sig-list");
  if (!sigCache.length){ el.innerHTML = '<div class="empty">近期暂无信号</div>'; return; }
  el.innerHTML = "";
  sigCache.slice(-20).reverse().forEach(function(s){
    var row = document.createElement("div"); row.className = "sig-row";
    row.innerHTML = '<span class="d">' + (s.date||"") + '</span><span class="s" style="color:' + (s.color||"var(--gold)") + '">' + s.label + '</span><span class="t">' + (s.note||"") + '</span>';
    el.appendChild(row);
  });
}

/* ===== 绘制（配色对齐原版；最新K线高亮；信号留间距；支持纵向价格缩放） ===== */
function resize(cv){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return null;
  cv.width = w * dpr; cv.height = h * dpr;
  var ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx: ctx, w: w, h: h };
}
function drawMarker(ctx, x, y, mk, dir){
  var color = mk.color || "#60a5fa";
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  var shape = String(mk.shape || "circle");
  if (shape === "arrowUp"){
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-6, y+9); ctx.lineTo(x+6, y+9); ctx.closePath(); ctx.fill();
  } else if (shape === "arrowDown"){
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-6, y-9); ctx.lineTo(x+6, y-9); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.font = "9px sans-serif"; ctx.textAlign = "center";
  var txt = String(mk.label || "").slice(0,2);
  if (txt) ctx.fillText(txt, x, dir > 0 ? y + 16 : y - 10);
}
function drawK(rows, sigs){
  var cv = document.getElementById("k-canvas");
  var R = resize(cv); if (!R) return;
  var ctx = R.ctx, W = R.w, H = R.h;
  ctx.clearRect(0,0,W,H);
  if (!rows || !rows.length) { ctx.fillStyle="#8aa0bf"; ctx.font="12px sans-serif"; ctx.fillText("暂无数据",12,20); return; }
  var closes = rows.map(function(r){ return r.c; });
  var ma1 = sma(closes,14), ma2 = sma(closes,28), ma3 = sma(closes,57);
  var vis = Math.max(20, Math.min(rows.length, state.vis));
  var sub = rows.slice(rows.length - vis);
  var lo = Infinity, hi = -Infinity;
  sub.forEach(function(r){ if(r.l<lo)lo=r.l; if(r.h>hi)hi=r.h; });
  var mid = (hi + lo) / 2, half = ((hi - lo) / 2) * state.zoom;
  hi = mid + half; lo = mid - half;
  var padL=8, padR=18, padT=18, padB=14;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var range = (hi - lo) || 1;
  function x(i){ return padL + (i/(vis-1))*plotW; }
  function y(p){ return padT + (hi-p)/range*plotH; }
  var cw = Math.max(1, plotW/vis*0.6);
  ctx.strokeStyle = "rgba(148,163,184,.12)"; ctx.lineWidth = 1;
  for (var g=1;g<5;g++){ var gy=padT+plotH*g/5; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  for (var i=0;i<vis;i++){
    var r = sub[i], xi = x(i);
    var up = r.c >= r.o;
    ctx.strokeStyle = up ? "#f03a52" : "#00b578"; ctx.fillStyle = up ? "#f03a52" : "#00b578";
    ctx.beginPath(); ctx.moveTo(xi, y(r.h)); ctx.lineTo(xi, y(r.l)); ctx.stroke();
    ctx.fillRect(xi-cw/2, Math.min(y(r.o),y(r.c)), cw, Math.max(1, Math.abs(y(r.o)-y(r.c))));
  }
  var last = sub[vis-1], lx = x(vis-1);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 1.5;
  ctx.strokeRect(lx-cw/2-1.5, Math.min(y(last.o),y(last.c))-1.5, cw+3, Math.max(1, Math.abs(y(last.o)-y(last.c)))+3);
  ctx.beginPath(); ctx.moveTo(lx, y(last.h)); ctx.lineTo(lx, y(last.l)); ctx.stroke();
  function line(arr, color){
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath(); var started = false;
    for (var i=0;i<vis;i++){
      var v = arr[rows.length - vis + i];
      if (v == null) continue;
      var px = x(i), py = y(v);
      if (!started){ ctx.moveTo(px,py); started = true; } else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  line(ma1, "#ff8000"); line(ma2, "#3399ff"); line(ma3, "#00c853");
  if (sigs && sigs.length) {
    var byDate = {}; sigs.forEach(function(s){ if (s.date) byDate[String(s.date)] = s; });
    for (var j=0;j<vis;j++){
      var r = sub[j], s = byDate[String(r.t)];
      if (!s) continue;
      var xi2 = x(j);
      if (s.position === "aboveBar") drawMarker(ctx, xi2, y(r.h) - 14, s, -1);
      else if (s.position === "inBar") drawMarker(ctx, xi2, (y(r.h)+y(r.l))/2, s, 0);
      else drawMarker(ctx, xi2, y(r.l) + 14, s, 1);
    }
  }
  document.getElementById("k-legend").textContent = "均线 · 信号标注";
}
function drawMacdCross(ctx, x, y, isGold){
  ctx.fillStyle = isGold ? "#ff1744" : "#00e676";
  ctx.beginPath();
  if (isGold){ ctx.moveTo(x, y); ctx.lineTo(x-5, y+8); ctx.lineTo(x+5, y+8); }
  else { ctx.moveTo(x, y); ctx.lineTo(x-5, y-8); ctx.lineTo(x+5, y-8); }
  ctx.closePath(); ctx.fill();
}
function drawM(rows){
  var cv = document.getElementById("m-canvas");
  var R = resize(cv); if (!R) return;
  var ctx = R.ctx, W = R.w, H = R.h;
  ctx.clearRect(0,0,W,H);
  if (!rows || !rows.length) return;
  var m = macd(rows);
  var vis = Math.max(20, Math.min(rows.length, state.vis));
  var start = rows.length - vis;
  var vals = [];
  for (var i=start;i<rows.length;i++){ if (m.hist[i]!=null) vals.push(m.hist[i]); }
  var mx = 1; vals.forEach(function(v){ var a=Math.abs(v); if(a>mx)mx=a; });
  var padT=6, padB=4, padL=8, padR=18;
  var plotH = H-padT-padB, plotW = W-padL-padR;
  function x(i){ return padL + (i/(vis-1))*plotW; }
  function y(v){ return padT + (mx-v)/(2*mx)*plotH; }
  ctx.strokeStyle = "rgba(148,163,184,.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,y(0)); ctx.lineTo(W,y(0)); ctx.stroke();
  var cw = Math.max(1, plotW/vis*0.6);
  for (var i=0;i<vis;i++){
    var v = m.hist[start+i]; if (v==null) continue;
    var xi = x(i), y0 = y(0), yv = y(v);
    ctx.fillStyle = v>=0 ? "rgba(239,68,68,.53)" : "rgba(34,197,94,.53)";
    ctx.fillRect(xi-cw/2, Math.min(y0,yv), cw, Math.max(1, Math.abs(y0-yv)));
  }
  function lline(arr, color){
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath(); var started = false;
    for (var i=0;i<vis;i++){
      var v = arr[start+i]; if (v==null) continue;
      var px = x(i), py = y(v);
      if (!started){ ctx.moveTo(px,py); started = true; } else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  lline(m.dif, "#e2e8f0"); lline(m.dea, "#f59e0b");
  for (var i=1;i<vis;i++){
    var d1 = m.dif[start+i-1], e1 = m.dea[start+i-1];
    var d2 = m.dif[start+i], e2 = m.dea[start+i];
    if (d1==null||e1==null||d2==null||e2==null) continue;
    if (d1 < e1 && d2 >= e2){ drawMacdCross(ctx, x(i), y((d2+e2)/2), true); }
    else if (d1 > e1 && d2 <= e2){ drawMacdCross(ctx, x(i), y((d2+e2)/2), false); }
  }
  document.getElementById("m-legend").textContent = "量能";
}

function render(){
  loadKline().then(function(rows){
    return loadSignals().then(function(sigs){
      cacheRows = rows; cacheSigs = sigs;
      drawK(rows, sigs);
      drawM(rows);
      document.getElementById("q-px").textContent = fmt(rows[rows.length-1].c);
    });
  }).catch(function(){
    var cv = document.getElementById("k-canvas");
    var R = resize(cv); if (R){ R.ctx.clearRect(0,0,R.w,R.h); R.ctx.fillStyle="#8aa0bf"; R.ctx.font="13px sans-serif"; R.ctx.fillText("数据加载失败，请稍后重试",12,24); }
  });
}
function redraw(){ if (cacheRows) { drawK(cacheRows, cacheSigs); drawM(cacheRows); } else render(); }
function refresh(){ loadQuote(); render(); }

function goto(secid, name){
  if (!secid) return;
  state.secid = secid; if (name) state.name = name;
  state.period = "day"; state.vis = 80; state.zoom = 1;
  document.querySelectorAll("#period-grp button").forEach(function(b){ b.classList.toggle("on", b.dataset.p === "day"); });
  document.getElementById("q-nm").textContent = name || secid;
  document.getElementById("q").value = name || secid;
  document.querySelectorAll(".env-chip").forEach(function(c){ c.classList.toggle("active", c.dataset.secid === secid); });
  refresh();
}
document.getElementById("period-grp").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  state.period = b.dataset.p;
  document.querySelectorAll("#period-grp button").forEach(function(x){ x.classList.toggle("on", x===b); });
  render();
});
document.getElementById("btn-fav").addEventListener("click", function(){
  var i = state.favs.indexOf(state.secid);
  if (i >= 0){ state.favs.splice(i,1); document.getElementById("btn-fav").textContent = "☆"; }
  else { state.favs.push(state.secid); document.getElementById("btn-fav").textContent = "★"; }
  try{ localStorage.setItem("ai24x_m_favs", JSON.stringify(state.favs)); }catch(e){}

});

document.getElementById("btn-desktop").addEventListener("click", function(){ location.href = "demo.html?force=1"; });
function renderFavList(){
  var el = document.getElementById("fav-list");
  if (!state.favs.length){ el.innerHTML = '<div class="empty">暂无自选，点击 ☆ 收藏</div>'; return; }
  el.innerHTML = "";
  state.favs.forEach(function(f){
    var row = document.createElement("div"); row.className = "sig-row";
    row.innerHTML = '<span class="s">' + f + '</span><span class="t">点击查看</span>';
    row.addEventListener("click", function(){ goto(f, f); document.getElementById("sheet-more").classList.remove("show"); });
    el.appendChild(row);
  });
}

/* ===== 双指缩放：横=K线根数(20~200)，纵=价格区间(0.5~3倍) ===== */
(function(){
  var mainEl = document.querySelector(".chart-main");
  var touch = null;
  mainEl.addEventListener("touchstart", function(e){
    if (e.touches.length === 2){
      var t0 = e.touches[0], t1 = e.touches[1];
      touch = {
        dist: Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY),
        vdist: Math.abs(t0.clientY - t1.clientY),
        vis: state.vis, zoom: state.zoom, axis: null
      };
      e.preventDefault();
    }
  }, { passive: false });
  mainEl.addEventListener("touchmove", function(e){
    if (touch && e.touches.length === 2){
      var t0 = e.touches[0], t1 = e.touches[1];
      var dx = Math.abs(t0.clientX - t1.clientX), dy = Math.abs(t0.clientY - t1.clientY);
      if (!touch.axis) touch.axis = (dy > dx * 1.2) ? "v" : "h";
      if (touch.axis === "h"){
        var d = Math.hypot(dx, dy);
        if (d > 0){
          var vis = Math.round(touch.vis * touch.dist / d);
          vis = Math.max(20, Math.min(200, vis));
          if (vis !== state.vis){ state.vis = vis; redraw(); }
        }
      } else {
        if (dy > 0){
          var zoom = Math.max(0.5, Math.min(3, touch.zoom * (touch.vdist || 1) / dy));
          if (Math.abs(zoom - state.zoom) > 0.02){ state.zoom = zoom; redraw(); }
        }
      }
      e.preventDefault();
    }
  }, { passive: false });
  function clearTouch(){ touch = null; }
  mainEl.addEventListener("touchend", clearTouch);
  mainEl.addEventListener("touchcancel", clearTouch);
})();

document.getElementById("btn-fav").textContent = (state.favs.indexOf(state.secid)>=0) ? "★" : "☆";

loadEnv();
refresh();

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#0b1220;color:#e6edf7;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#101a2c;border-bottom:1px solid #22314d}
  .topbar .home{font-size:13px;color:#8ab8ff;font-weight:700;white-space:nowrap}
  .topbar .ttl{font-size:16px;font-weight:800;flex:1}
  .topbar .ttl b{color:#fbbf24}
  .topbar .desktop{font-size:12px;color:#fbbf24;border:1px solid rgba(251,191,36,.35);border-radius:999px;padding:3px 9px;background:rgba(251,191,36,.08);white-space:nowrap}
  .tabs{display:flex;gap:8px;padding:10px 12px 6px}
  .tabs button{flex:1;height:38px;border-radius:10px;border:1px solid #22314d;background:#101a2c;color:#8aa0bf;font-size:14px;font-weight:700}
  .tabs button.on{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0b1220;border-color:#fbbf24}
  .env{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px}
  .env .chip{font-size:11px;color:#8aa0bf;background:#101a2c;border:1px solid #22314d;border-radius:999px;padding:3px 9px}
  .env .chip.good{color:#fbbf24;border-color:rgba(251,191,36,.4)}
  .env .chip.bad{color:#f87171;border-color:rgba(248,113,113,.4)}
  .regime{margin:2px 12px 8px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.6;background:#152238;border:1px solid #2a3a55}
  .regime.attack{border-color:rgba(248,113,113,.5);background:linear-gradient(135deg,rgba(248,113,113,.14),rgba(248,113,113,.04))}
  .regime.stable{border-color:rgba(251,191,36,.5);background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(251,191,36,.03))}
  .regime.defensive{border-color:rgba(59,130,246,.5);background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(59,130,246,.03))}
  .regime b{color:#fbbf24}

  /* 板块排行 */
  .br{padding:4px 10px}
  .br-item{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;background:#101a2c;border:1px solid #22314d;border-radius:12px;padding:9px 11px;margin-bottom:8px}
  .br-idx{min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:#152238;color:#8ab8ff;font-size:11px;font-weight:800}
  .br-idx.t1{background:linear-gradient(135deg,#ffd666,#f59e0b);color:#3a2c00}
  .br-idx.t2{background:rgba(251,191,36,.22);color:#fbbf24}
  .br-name{font-size:14px;font-weight:800}
  .br-code{font-size:10.5px;color:#8aa0bf;font-weight:600}
  .br-st{width:100%;font-size:11px;color:#8aa0bf;line-height:1.6}
  .br-st b{color:#e6edf7}
  .br-leaders{width:100%;font-size:11px;color:#8aa0bf;line-height:1.7}
  .br-leaders a{color:#8ab8ff}
  /* 大盘环境 */
  .mkt{margin:2px 12px 8px;background:#101a2c;border:1px solid #22314d;border-radius:14px;padding:11px 12px}
  .mkt-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
  .mkt .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
  .mkt .badge.ok{background:rgba(240,58,82,.16);color:#f03a52;border:1px solid rgba(240,58,82,.5)}
  .mkt .badge.warn{background:rgba(251,191,36,.14);color:#fbbf24;border:1px solid rgba(251,191,36,.45)}
  .mkt .badge.risk{background:rgba(0,181,120,.14);color:#00b578;border:1px solid rgba(0,181,120,.45)}
  .mkt .pts{font-size:12px;font-weight:800;color:#fbbf24}
  .mkt-asof{font-size:10.5px;color:#5d7290;margin-left:auto}
  .mkt-idx{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
  .mi{background:#152238;border:1px solid #2a3a55;border-radius:9px;padding:6px 8px;font-size:11px;line-height:1.5}
  .mi .nm{color:#e6edf7;font-weight:700;display:block}
  .mi .sc{color:#fbbf24;font-weight:800;font-size:13px}
  .mi .stx{color:#8aa0bf;display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mkt-gate{margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);font-size:11.5px;color:#8aa0bf;line-height:1.7}

  .mkt-gate a{color:#8ab8ff;font-weight:700}
  /* 战绩条 */
  .win{margin:2px 12px 8px}
  .win-strip{display:flex;flex-wrap:wrap;gap:4px 12px;background:#101a2c;border:1px solid #22314d;border-radius:12px;padding:9px 12px;font-size:11.5px;color:#8aa0bf}

  .win-strip .up{color:#f03a52}
  .win-strip .down{color:#00b578}

  /* 昨日追踪 */
  .pt{padding:0 10px 4px}
  .pt-item{display:flex;align-items:center;gap:8px;background:#101a2c;border:1px solid #22314d;border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:12.5px}
  .pt-nm{font-weight:800}
  .pt-cd{font-size:10.5px;color:#8aa0bf}
  .pt-status{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pt-status.st-ok{background:rgba(52,211,153,.14);color:#4ade80;border:1px solid rgba(52,211,153,.4)}
  .pt-status.st-warn{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
  .pt-status.st-bad{background:rgba(244,63,94,.14);color:#f03a52;border:1px solid rgba(244,63,94,.4)}
  .pt-status.st-muted{background:rgba(128,138,160,.12);color:#8aa0bf;border:1px solid rgba(128,138,160,.4)}
  .pt-note{margin:2px 2px 8px;font-size:10.5px;color:#5d7290;line-height:1.6}

  .meta{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 12px 8px;font-size:11.5px;color:#8aa0bf}
  .meta b{color:#e6edf7}
  .sec-title{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;font-size:14px;font-weight:800;color:#fbbf24}
  .sec-title .refresh{font-size:12px;color:#8ab8ff;font-weight:700}
  .list{padding:4px 10px}
  .pick{background:#101a2c;border:1px solid #22314d;border-radius:14px;padding:12px;margin-bottom:10px}
  .pick.king{border-color:rgba(251,191,36,.55);box-shadow:0 4px 18px rgba(251,191,36,.10)}
  .ph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
  .num{display:inline-block;min-width:22px;text-align:center;background:#fbbf24;color:#0b1220;border-radius:6px;font-weight:800;font-size:12px;padding:2px 6px;margin-right:2px}
  .nm{font-size:16px;font-weight:800}
  .cd{font-size:12px;color:#8aa0bf}
  .star{color:#fbbf24;font-size:13px}
  .tier{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
  .tier.king{background:linear-gradient(135deg,#ffd666,#f59e0b);color:#3a2c00}
  .tier.key{background:#fbbf24;color:#0b1220}
  .tier.main{background:linear-gradient(135deg,#ffd666,#f59e0b);color:#3a2c00}

  .px{font-size:16px;font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
  .chg{font-size:12px;font-weight:700}

  .tags{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}

  .tag.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.3);color:#4ade80}
  .tag.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:#fbbf24}
  .tag.info{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35);color:#8ab8ff}

  .lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11.5px}

  .lv .pos{color:#fbbf24;font-weight:700}

  .st .st-tag{display:inline-block;padding:0 6px;border-radius:4px;background:linear-gradient(135deg,#ffd666,#f59e0b);color:#3a2c00;font-weight:800;font-size:10.5px;margin-right:5px}
  .reason{margin-top:7px;font-size:11px;color:#8aa0bf;line-height:1.7}
  .bearish{margin-top:5px;font-size:11px;color:#00b578}
  .bearish.warn{color:#fbbf24}
  .bearish b{font-weight:800}
  .pick .btns{display:flex;gap:8px;margin-top:9px}
  .pick .btns a{flex:1;text-align:center;height:36px;line-height:36px;border-radius:9px;font-size:13px;font-weight:700}
  .pick .btns .kline{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0b1220}
  .pick .btns .demo{background:#152238;border:1px solid #2a3a55;color:#e6edf7}
  .runner-box{margin:4px 10px 10px}
  .runner-box details{border:1px solid #22314d;border-radius:12px;background:#101a2c;overflow:hidden}
  .runner-box summary{padding:10px 12px;font-size:13px;font-weight:700;color:#8aa0bf;list-style:none}
  .runner-box summary::-webkit-details-marker{display:none}
  .runner-box table{width:100%;border-collapse:collapse;font-size:11px}
  .runner-box th,.runner-box td{padding:6px 8px;border-top:1px solid #1c2a44;text-align:left;color:#8aa0bf}
  .runner-box td a{color:#8ab8ff}
  .hist{padding:4px 10px 10px}
  .hist a.hist-row{display:block;background:#101a2c;border:1px solid #22314d;border-radius:10px;padding:9px 12px;margin-bottom:8px}
  .hist .hr-date{font-size:13px;font-weight:700;color:#fbbf24}
  .hist .hr-sub{font-size:11px;color:#8aa0bf;margin-top:2px}
  .empty{padding:26px 16px;text-align:center;color:#8aa0bf;font-size:13px;line-height:1.8}
  .vip-gate{margin:12px;padding:18px 16px;border-radius:14px;text-align:center;background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(251,191,36,.04));border:1px solid rgba(251,191,36,.45)}
  .vip-gate .t{font-size:15px;font-weight:800;color:#fbbf24;margin-bottom:6px}
  .vip-gate .d{font-size:12px;color:#8aa0bf;line-height:1.8;margin-bottom:12px}
  .vip-gate a{display:inline-block;padding:10px 28px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0b1220;font-weight:800;font-size:14px}
  .foot{margin:16px 14px 8px;padding-top:12px;border-top:1px solid #1c2a44;font-size:10.5px;line-height:1.7;color:#5d7290;text-align:center}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#101a2c;border-top:1px solid #22314d;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottombar a{flex:1;text-align:center;font-size:11px;color:#8aa0bf;padding:4px 2px}
  .bottombar a .ic{display:block;font-size:17px;margin-bottom:1px}
  .bottombar a.on{color:#fbbf24}
  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);max-width:88vw;background:rgba(220,38,38,.95);color:#fff;font-size:13px;line-height:1.6;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
  .toast.show{opacity:1}
  .toast.ok{background:rgba(21,128,61,.95)}
</style>
</head>

<script>
(function(){
  function apiBase(){
    try {
      if (String(location.protocol || '') === 'file:') return 'http://127.0.0.1:18011';
      var host = String(location.hostname || ''), port = String(location.port || '');
      if ((host === '127.0.0.1' || host === 'localhost') && (port === '18001' || port === '18003')) return 'http://127.0.0.1:18011';
    } catch(e){}
    return '';
  }
  var API = apiBase();
  var state = { market: 'hs', date: '', archive: false };
  var qp = new URLSearchParams(location.search);
  var iCode = qp.get('i') || qp.get('invite') || qp.get('inv') || qp.get('ref') || '';
  if (iCode) { try { localStorage.setItem('ai24x_invite_code', String(iCode).trim().toUpperCase()); } catch(e){} }
  if (qp.get('date')) { state.date = qp.get('date'); }
  var mk = qp.get('market');
  if (mk && ['hs','kc','bj','bj_all'].indexOf(mk) >= 0) { state.market = mk; }

  function token(){ try { var t = localStorage.getItem('ai24x_a_token'); if (t && t.length > 20) return t; } catch(e){} return ''; }
  function api(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    var t = token();
    if (t) opts.headers.Authorization = 'Bearer ' + t;
    opts.cache = 'no-store';
    return fetch(API + path, opts).then(function(r){ return r.json(); });
  }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(v){ v = Number(v || 0); if (v >= 1e8) return (v/1e8).toFixed(1) + '亿'; if (v >= 1e4) return (v/1e4).toFixed(0) + '万'; return String(Math.round(v)); }
  function num(v, d){ v = Number(v); if (v == null || isNaN(v)) return '—'; return v.toFixed(d == null ? 2 : d); }
  function pct(v){ v = Number(v || 0); return (v > 0 ? '+' : '') + num(v, 2) + '%'; }
  function cls(v){ return Number(v || 0) >= 0 ? 'up' : 'down'; }
  function toast(msg, ok){ var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (ok ? ' ok' : ''); clearTimeout(t._tm); t._tm = setTimeout(function(){ t.className = 'toast'; }, 2600); }

  function secidForCode(code){
    code = String(code || '');
    if (/^\d{6}$/.test(code)){
      if (code.startsWith('6') || code.startsWith('9') || code.startsWith('4') || code.startsWith('8')) return '1.' + code;
      return '0.' + code;
    }
    return code;
  }

  var REG = {
    attack: ['强攻模式', '大盘底+金确认、小盘转强：可积极，主线龙头 + 补涨卡位双线推进'],
    stable: ['稳健模式', '大盘中性：以主线双确认 + 零风险标的为主，控制单票仓位'],
    defensive: ['防守模式', '大盘走弱：仅主线双确认 + 零风险标的，最多 2 只，宁可空仓不勉强']
  };

  function tierBadge(p){
    var t = p.tier || 'normal';
    var txt = { king: '王者', key: '重点', main: '主线', catchup: '补涨', normal: '观察' }[t] || '观察';
    return '<span class="tier ' + esc(t) + '">' + txt + '</span>';
  }

  function tags(p){
    var a = p.patterns || {}, h = [];
    if (a.surgeStart) h.push('<span class="tag ok">底部异动·' + (p.surgeDaysAgo || 0) + '天前</span>');
    if (a.ztPullback) h.push('<span class="tag ok">涨停级回踩</span>');
    else if (a.pullback) h.push('<span class="tag ok">异动回踩企稳</span>');
    if (a.baseUp) h.push('<span class="tag ok">底部走多</span>');
    if (a.smallYang) h.push('<span class="tag ok">一路小阳</span>');
    if (p.boardLeader) h.push('<span class="tag ok">板块龙头</span>');
    if (p.hotName) h.push('<span class="tag warn">共振:' + esc(p.hotName) + '</span>');
    var f = p.fund || {};
    if (f.earnPos && f.earnPos.length) h.push('<span class="tag ok">业绩预增</span>');
    if (p.fundIn > 0) h.push('<span class="tag info">主力+' + money(p.fundIn) + '</span>');
    if (h.length > 5) h = h.slice(0, 5);
    return h.join('');
  }

  function reasonOf(p){
    var a = p.patterns || {}, r = [];
    if (a.surgeStart) r.push('底部放量异动' + (p.surgeDaysAgo || 0) + '天前启动');
    if (a.pullback) r.push('异动拉升后缩量回踩企稳');
    if (a.ztPullback) r.push('涨停级回踩·强势低吸');
    if (a.smallYang) r.push('连续小阳趋势上拐');
    if (a.baseUp) r.push('站上MA20且均线上拐');
    if (p.mainHit && p.mainName) r.push('复盘主线板块:' + p.mainName);
    if (p.boardLeader) r.push('板块龙头');
    if (p.hotName) r.push('板块共振:' + p.hotName);
    if (r.length > 3) r = r.slice(0, 3);
    return r.join('、') || '形态健康';
  }

  function bearishHtml(p){
    var b = p.bearish || { level: 'pass', items: [] };
    var f = p.fund || {}, fw = [];
    if (f.newsHard && f.newsHard.length) fw = fw.concat(f.newsHard.map(function(t){ return '消息硬伤:' + t; }));
    if (f.newsWarn && f.newsWarn.length) fw = fw.concat(f.newsWarn.slice(0,2).map(function(t){ return '消息警示:' + t; }));
    var isHard = b.level === 'hard' || f.level === 'hard';
    var isWarn = b.level === 'warn' || f.level === 'warn' || fw.length > 0;
    var txt = [];
    (b.items || []).forEach(function(it){ txt.push(it.text); });
    fw.forEach(function(t){ txt.push(t); });

  function loadMarket(){
    var box = $('mkt');

      renderMarket(d.md, !!d.vip, d.asof || d.date || '', label || '');

        if (!items.length) { box.style.display = 'none'; return; }

        api('/api/report/' + encodeURIComponent(latest)).then(function(d2){ fill(d2, '最近复盘 ' + latest); })
          .catch(function(){ box.style.display = 'none'; });
      }).catch(function(){ box.style.display = 'none'; });
    }).catch(function(){ box.style.display = 'none'; });
  }
  function renderMarket(md, vip, asof, label){
    var box = $('mkt');
    if (!box || !md) return;
    var pts = null, pm = md.match(/pts\s*=\s*([\d.]+)/);
    if (pm && pm[1]) pts = Number(pm[1]);
    var env = 'warn';
    if (/顺风|金叉确认|空转多/.test(md)) env = 'ok';
    else if (/警示/.test(md)) env = 'risk';
    else if (pts != null && pts >= 3) env = 'ok';
    else if (pts != null && pts <= 0) env = 'risk';
    var envTxt = env === 'ok' ? '顺风' : (env === 'risk' ? '警示' : '中性');
    var idxRows = [];
    var lines = String(md).split('\n');
    for (var i = 0; i < lines.length && idxRows.length < 4; i++) {
      var L = lines[i].trim();
      var m = L.match(/^\|\s*\d+\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([\d.]+)\s*\|/);
      if (m) {
        var rest = L.split('|');
        var st = rest.length > 6 ? stripMdLink(rest[6]) : (rest.length > 5 ? 'MACD ' + stripMdLink(rest[5]) : '');
        idxRows.push({ name: stripMdLink(m[1]), sig: stripMdLink(m[2]).replace(/　/g, ' '), score: m[3], st: st });
      }
    }
    var envLine = '';
    var em = md.match(/大盘环境[：:]\s*([^\n]+)/);
    if (em && em[1]) envLine = stripMdLink(em[1]).replace(/（[^）]*）/g, '').replace(/；\s*$/, '');
    var mainlines = '', observe = '', avoid = '', ops = '';
    if (vip) {
      var mm = md.match(/主攻主线[：:]\s*\*\*([^*]+)\*\*/) || md.match(/主攻[^：:\n]*[：:]\s*\*\*([^*]+)\*\*/);
      if (mm && mm[1]) mainlines = stripMdLink(mm[1]);
      var om = md.match(/\*{0,2}观察\*{0,2}[：:]\s*([^\n；;]+)/);
      if (om && om[1]) observe = stripMdLink(om[1]);
      var av = md.match(/回避[^：:\n]*[：:]\s*([^\n；;]+)/);
      if (av && av[1]) avoid = stripMdLink(av[1]);
      var op = md.match(/操作原则[：:]\s*([^\n]+)/);
      if (op && op[1]) ops = stripMdLink(op[1]);
    }
    var h = '<div class="mkt-head"><span class="badge ' + env + '">' + envTxt + '</span>';
    if (pts != null) h += '<span class="pts">pts=' + pts.toFixed(1) + '</span>';
    if (envLine) h += '<span style="font-size:11px;color:#8aa0bf">' + esc(envLine) + '</span>';
    if (label) h += '<span class="mkt-asof">' + esc(label) + (asof ? ' · 截至 ' + esc(asof) : '') + '</span>';
    h += '</div>';
    if (idxRows.length) {
      h += '<div class="mkt-idx">';
      for (var j = 0; j < idxRows.length; j++) {
        h += '<div class="mi"><span class="nm">' + esc(idxRows[j].name) + '</span><span class="sc">' + esc(idxRows[j].score) + '</span>' +
          (idxRows[j].st ? '<span class="stx">' + esc(idxRows[j].st) + '</span>' : '') + '</div>';
      }
      h += '</div>';
    }
    if (vip && (mainlines || observe || avoid || ops)) {
      h += '<div class="mkt-gate" style="border-color:rgba(240,58,82,.35);background:rgba(240,58,82,.08)">';
      var r1 = [];
      if (mainlines) r1.push('🎯 主攻：' + esc(mainlines));
      if (observe) r1.push('👀 观察：' + esc(observe));
      if (avoid) r1.push('🚫 回避：' + esc(avoid));
      if (ops) r1.push('📐 操作：' + esc(ops));
      if (r1.length) h += r1.join(' ｜ ');
      h += '</div>';
    } else if (!vip) {
      h += '<div class="mkt-gate">🔒 今日观察（板块选择与筛选标的）为 <b>VIP 专属</b>，开通后自动解锁。<a href="account.html">去开通 →</a></div>';
    }
    box.innerHTML = h;
    box.style.display = 'block';
  }

  /* —— 板块排行（含同花顺代码，可点击查K线） —— */
  function renderBoardRank(d){
    var el = $('boardrank');
    d = d || {};
    var rank = d.board_rank || [];
    if (!rank.length) { el.innerHTML = '<div class="empty">暂无板块排行</div>'; return; }
    var isAll = (d.market_code === 'hs' || d.market_code === 'kc');
    var mains = (d.mainlines || []).filter(function(m){ return m && m.src === 'daily'; })
      .map(function(m){ return String(m.name || '').replace(/\s+/g, ''); }).filter(Boolean);
    function hitMainline(name){
      var n = String(name || '').replace(/\s+/g, '');
      if (!n) return false;
      for (var i = 0; i < mains.length; i++) {
        if (n === mains[i]) return true;
        if (mains[i].length >= 2 && (n.indexOf(mains[i]) >= 0 || mains[i].indexOf(n) >= 0)) return true;
      }
      return false;
    }
    el.innerHTML = rank.map(function(b, idx){
      var t = '';
      if (hitMainline(b.name)) t += '<span class="tier main">主线 ✓</span>';
      if (b.tier === 'king') t += '<span class="tier king">⭐ 王者</span>';
      else if (b.tier === 'key') t += '<span class="tier key">重点</span>';
      else t += '<span class="tier normal">备选</span>';
      var secid = String(b.secid || '').trim();
      var ths = String(b.ths || '').trim();
      var useSecid = ths || secid;
      var thsCode = ths ? ths.replace(/^ths:/i, '').replace(/^\d+\./, '') : '';
      var href = useSecid ? ('../demo.html?secid=' + encodeURIComponent(useSecid) + '&period=day' + (b.name ? '&name=' + encodeURIComponent(b.name) : '')) : '#';
      var nm = '<a class="br-name" href="' + href + '" target="_blank" rel="noopener">' + esc(b.name) +
        (thsCode ? ' <span class="br-code">' + esc(thsCode) + '</span>' : '') + ' ↗</a>';
      var st = '';
      if (isAll) {
        if (b.mainline && !b.f164) st = '复盘主线 · 资金+技术双确认';
        else st = '5日主力 <b>' + money(b.f164) + '</b> ｜ 今日主力 <b>' + money(b.f62) + '</b>' + (b.p5 != null ? ' ｜ 5日 ' + pct(b.p5) : '');
      } else {
        if (b.count != null) st += b.count + ' 只异动';
        if (b.amount != null) st += (st ? ' ｜ ' : '') + '成交 ' + money(b.amount);
        if (b.p5 != null) st += (st ? ' ｜ ' : '') + '5日 ' + pct(b.p5);
        if (b.hot) st += ' ｜ ✓板块榜';
      }
      if (b.streak >= 2) st += (st ? ' ｜ ' : '') + '🔥 连续 ' + b.streak + ' 日上榜';
      var lds = (b.leaders || []).slice(0, 3).map(function(ld){
        return '<a href="../demo.html?secid=' + encodeURIComponent(secidForCode(ld.code)) + '&period=day" target="_blank" rel="noopener">' + esc(ld.name) + ' <span class="' + cls(ld.pct) + '">' + pct(ld.pct) + '</span></a>';
      }).join('　');
      return '<div class="br-item">' +
        '<span class="br-idx' + (b.tier === 'king' ? ' t1' : (b.tier === 'key' ? ' t2' : '')) + '">' + (idx + 1) + '</span>' + t + nm +
        (st ? '<span class="br-st">' + st + '</span>' : '') +

    }).join('');

      api('/api/bj/screener/progress?market=' + encodeURIComponent(state.market)).then(function(p){

      history.replaceState(null, '', 'gd.html?i=' + encodeURIComponent(inviteCode()));
      var ptEl = $('pt'); if (ptEl) ptEl.style.display = 'none';
      var brEl = $('boardrank'); if (brEl) brEl.innerHTML = '';
      var mtEl = $('meta'); if (mtEl) mtEl.innerHTML = '加载中…';
      loadMarket(); loadWinrate();
      load(true);
      renderHist(undefined);
      api('/api/bj/history?market=' + encodeURIComponent(state.market)).then(renderHist).catch(function(){});
    });
  });
  $('btn-refresh').addEventListener('click', refreshScan);
  $('link-desktop').addEventListener('click', function(){
    try { sessionStorage.setItem('ai24x_desktop_force', '1'); } catch(e){}
  });

  function inviteCode(){
    try { return String(localStorage.getItem('ai24x_invite_code') || '').trim().toUpperCase() || 'BWPX3Z8B'; } catch(e){ return 'BWPX3Z8B'; }
  }
  // desktop link follow invite
  var desk = $('link-desktop');
  if (desk) { desk.href = '../gd.html?i=' + encodeURIComponent(inviteCode()); }

  // boot：初始 tab 高亮
  var initTab = document.querySelector('.tabs button[data-m="' + state.market + '"]');
  if (initTab) {
    tabs.forEach(function(x){ x.classList.remove('on'); });
    initTab.classList.add('on');
  }
  // boot
  if (!state.date) { loadMarket(); loadWinrate(); }
  load(true);
  api('/api/bj/history?market=' + encodeURIComponent(state.market)).then(renderHist).catch(function(){});
})();
</script>
</body>
</html>

<script>
(function(){
  function apiBase(){
    try {
      if (String(location.protocol || '') === 'file:') return 'http://127.0.0.1:18011';
      var host = String(location.hostname || ''), port = String(location.port || '');
      if ((host === '127.0.0.1' || host === 'localhost') && (port === '18001' || port === '18003')) return 'http://127.0.0.1:18011';
    } catch(e){}
    return '';
  }
  var API = apiBase();
  var state = { market: 'hs', date: '', archive: false, mlBasis: '' };
  var qp = new URLSearchParams(location.search);
  var iCode = qp.get('i') || qp.get('invite') || qp.get('inv') || qp.get('ref') || '';
  if (iCode) { try { localStorage.setItem('ai24x_invite_code', String(iCode).trim().toUpperCase()); } catch(e){} }
  if (qp.get('date')) { state.date = qp.get('date'); }
  var mk = qp.get('market');
  if (mk && ['hs','kc','bj','bj_all','macd','pb'].indexOf(mk) >= 0) { state.market = mk; }
  else {
    try { var _savedM = String(localStorage.getItem('bj_tab') || '').trim(); if (_savedM && ['hs','kc','bj','bj_all','macd','pb'].indexOf(_savedM) >= 0) state.market = _savedM; } catch(e){}
  }

  function token(){ try { var t = localStorage.getItem('ai24x_a_token'); if (t && t.length > 20) return t; } catch(e){} return ''; }
  function api(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    var t = token();
    if (t) opts.headers.Authorization = 'Bearer ' + t;
    opts.cache = 'no-store';
    return fetch(API + path, opts).then(function(r){
      return r.text().then(function(txt){
        var j = null;
        try { j = txt ? JSON.parse(txt) : null; } catch(e){ j = null; }
        if (!r.ok) {
          var detail = j && (j.detail || j.msg || j.message) ? String(j.detail || j.msg || j.message) : '';
          var err = new Error(detail || txt || ('HTTP ' + r.status));
          try { err.status = r.status; } catch(e1){}
          throw err;
        }
        return j;
      });
    });
  }
  function guestGateHtml(){
    return '<div class="vip-gate"><div class="t">🔒 复盘筛选为登录/VIP 专属</div><div class="d">请先登录或开通 VIP，再查看今日 AI 筛选、板块排行与历史归档。</div><a href="account.html">登录 / 开通 VIP →</a></div>';
  }
  function showGuestGate(){
    var ids = ['env','regime','win','meta','pt','runner-box','boardrank','hist'];
    ids.forEach(function(id){ var el = $(id); if (el) { el.style.display = 'none'; el.innerHTML = ''; } });
    var rf = $('btn-refresh'); if (rf) rf.style.display = 'none';
    var list = $('list'); if (list) list.innerHTML = guestGateHtml();
  }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  // 数据日统一口径：今日收盘更新完成 → 今日；盘前/盘中/非交易日/今日未生成/今日无合格（展示上一交易日）→ 昨日；归档 → 具体日期
  function dataDayLabel(d){
    if (!d) return '今日';
    if (d.archive) return String(d.asof || d.date || '');
    if (d.off_market || d.intraday || d.stale || d.today_missing) return '昨日';
    return '今日';
  }
  function reportDayLabel(d){
    var dt = String((d && (d.date || d.asof)) || '');
    return (dt && dt === fmtDate() ? '今日' : '昨日') + '大盘';
  }
  function money(v){ v = Number(v || 0); if (v >= 1e8) return (v/1e8).toFixed(1) + '亿'; if (v >= 1e4) return (v/1e4).toFixed(0) + '万'; return String(Math.round(v)); }
  function num(v, d){ v = Number(v); if (v == null || isNaN(v)) return '—'; return v.toFixed(d == null ? 2 : d); }
  function pct(v){ v = Number(v || 0); return (v > 0 ? '+' : '') + num(v, 2) + '%'; }
  function cls(v){ return Number(v || 0) >= 0 ? 'up' : 'down'; }
  function toast(msg, ok){ var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (ok ? ' ok' : ''); clearTimeout(t._tm); t._tm = setTimeout(function(){ t.className = 'toast'; }, 2600); }

  function secidForCode(code){
    code = String(code || '');
    if (/^\d{6}$/.test(code)){
      if (code.startsWith('6') || code.startsWith('9') || code.startsWith('4') || code.startsWith('8')) return '1.' + code;

  function renderMarket(md, vip, asof, label){
    var box = $('mkt');
    if (!box || !md) return;
    var pts = null, pm = md.match(/pts\s*=\s*([\d.]+)/);
    if (pm && pm[1]) pts = Number(pm[1]);
    var env = 'warn';
    if (/顺风|金叉确认|空转多/.test(md)) env = 'ok';
    else if (/警示/.test(md)) env = 'risk';
    else if (pts != null && pts >= 3) env = 'ok';
    else if (pts != null && pts <= 0) env = 'risk';
    var envTxt = env === 'ok' ? '顺风' : (env === 'risk' ? '警示' : '中性');
    var idxRows = [];
    var lines = String(md).split('\n');
    for (var i = 0; i < lines.length && idxRows.length < 4; i++) {
      var L = lines[i].trim();
      var m = L.match(/^\|\s*\d+\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([\d.]+)\s*\|/);
      if (m) {
        var rest = L.split('|');
        var st = rest.length > 6 ? stripMdLink(rest[6]) : (rest.length > 5 ? 'MACD ' + stripMdLink(rest[5]) : '');
        idxRows.push({ name: stripMdLink(m[1]), sig: stripMdLink(m[2]).replace(/　/g, ' '), score: m[3], st: st });
      }
    }
    var envLine = '';
    var em = md.match(/大盘环境[：:]\s*([^\n]+)/);
    if (em && em[1]) envLine = stripMdLink(em[1]).replace(/（[^）]*）/g, '').replace(/；\s*$/, '');
    var mainlines = '', observe = '', avoid = '', ops = '';
    if (vip) {
      var mm = md.match(/主攻主线[：:]\s*([^\n]+)/) || md.match(/主攻[^：:\n]*[：:]\s*([^\n]+)/);
      if (mm && mm[1]) {
        var _ml = String(mm[1]).match(/\*\*([^*]+)\*\*/g);
        mainlines = _ml ? _ml.map(function(s){ return stripMdLink(s); }).join('、') : stripMdLink(mm[1]);
      }
      var om = md.match(/\*{0,2}观察\*{0,2}[：:]\s*([^\n；;]+)/);
      if (om && om[1]) observe = stripMdLink(om[1]);
      var av = md.match(/回避[^：:\n]*[：:]\s*([^\n；;]+)/);
      if (av && av[1]) avoid = stripMdLink(av[1]);
      var op = md.match(/操作原则[：:]\s*([^\n]+)/);
      if (op && op[1]) ops = stripMdLink(op[1]);
    }
    var dayL = (asof && String(asof) === fmtDate()) ? '今日' : '昨日';
    var h = '<div class="mkt-head"><span class="badge ' + env + '">' + envTxt + '</span>';
    if (pts != null) h += '<span class="pts">pts=' + pts.toFixed(1) + '</span>';
    if (envLine) h += '<span style="font-size:11px;color:#8aa0bf">' + esc(envLine) + '</span>';
    if (label) h += '<span class="mkt-asof">' + esc(label) + (asof ? ' · 截至 ' + esc(asof) : '') + '</span>';
    h += '</div>';
    if (idxRows.length) {
      h += '<div class="mkt-idx">';
      for (var j = 0; j < idxRows.length; j++) {
        h += '<div class="mi"><span class="nm">' + esc(idxRows[j].name) + '</span><span class="sc">' + esc(idxRows[j].score) + '</span>' +
          (idxRows[j].st ? '<span class="stx">' + esc(idxRows[j].st) + '</span>' : '') + '</div>';
      }
      h += '</div>';
    }
    if (vip && (mainlines || observe || avoid || ops)) {
      h += '<div class="mkt-gate" style="border-color:rgba(240,58,82,.35);background:rgba(240,58,82,.08)">';
      var r1 = [];
      if (mainlines) r1.push('🎯 主攻：' + esc(mainlines));
      if (observe) r1.push('👀 观察：' + esc(observe));
      if (avoid) r1.push('🚫 回避：' + esc(avoid));
      if (ops) r1.push('📐 风险提示：' + esc(sanitizeOpsMobile(ops)));
      if (r1.length) h += r1.join(' ｜ ');

    }

    box.style.display = 'block';
  }

        '<span>5日收正占比 <b class="up">' + posRate + '</b></span>' +
        '<span>10日破位占比 <b class="down">' + stop + '</b></span>' +
        '<span>跟踪中 ' + d.tracking + ' 只</span>' + tierTxt + '</div>' +
        '<div class="win-note">口径：以入选后5日内最高涨幅≥+5% 统计“强势”、10日内跌破参考位统计“破位”，仅作算法回溯检验；历史统计不代表未来表现。</div>';
      box.style.display = 'block';
    }).catch(function(){});
  }
  /* —— 昨日筛选 · 今日跟踪 —— */
  function renderPrevTrack(d){
    var el = $('pt');
    var trk = d.prev_track || [];
    if (!d.prev_date || !trk.length) { el.style.display = 'none'; return; }
    var html = '<div class="sec-title">昨日筛选 · 今日跟踪（' + esc(d.prev_date) + '）</div>';
    trk.forEach(function(t){
      var tagCls = t.tag === 'ok' ? 'st-ok' : (t.tag === 'warn' ? 'st-warn' : (t.tag === 'bad' ? 'st-bad' : 'st-muted'));
      html += '<div class="pt-item">' +
        '<span class="pt-nm">' + esc(t.name) + '</span>' +
        '<span class="pt-cd">' + esc(t.code) + '</span>' +
        (t.star ? '<span class="star">★</span>' : '') +
        '<span class="pt-status ' + tagCls + '">' + esc(t.status) + '</span>' +
      '</div>';
    });
    html += '<div class="pt-note">未破位继续跟踪；破位或放量长阴-8% 注意风险；不因新面孔频繁换股。</div>';
    el.innerHTML = html;
    el.style.display = 'block';
  }
  /* —— 板块排行（含同花顺代码，可点击查K线） —— */
  function renderBoardRank(d){
    var el = $('boardrank');
    d = d || {};
    var rank = d.board_rank || [];
    if (!rank.length) { el.innerHTML = '<div class="empty">暂无板块排行</div>'; return; }
    var isAll = (d.market_code === 'hs' || d.market_code === 'kc' || d.market_code === 'macd' || d.market_code === 'pb');
    var mains = (d.mainlines || []).filter(function(m){ return m && m.src === 'daily'; })
      .map(function(m){ return String(m.name || '').replace(/\s+/g, ''); }).filter(Boolean);
    function hitMainline(name){
      var n = String(name || '').replace(/\s+/g, '');
      if (!n) return false;
      for (var i = 0; i < mains.length; i++) {
        if (n === mains[i]) return true;
        if (mains[i].length >= 2 && (n.indexOf(mains[i]) >= 0 || mains[i].indexOf(n) >= 0)) return true;
      }
      return false;
    }
    el.innerHTML = rank.map(function(b, idx){
      var topMlName = '';
      var _topMl = (d.mainlines || []).filter(function(m){ return m && m.src === 'daily'; })[0];
      if (_topMl) topMlName = String(_topMl.name || '').replace(/\s+/g, '');
      var _bml = b.ml_name ? String(b.ml_name).replace(/\s+/g, '') : '';
      var isTop = !!(b.mainline && _bml && _bml === topMlName);
      var isObs = b.observe || (d.observes || []).some(function(o){
        return String(o.name || '').replace(/\s+/g, '') === String(b.name || '').replace(/\s+/g, '');
      });
      var t = '';
      if (isTop && b.tier === 'king') t += '<span class="tier main">主线 ✓</span><span class="tier king">⭐ ' + dataDayLabel(d) + '主线</span>';
      else if (b.mainline) t += '<span class="tier key">重点关注</span>';
      else if (isObs) t += '<span class="tier key">重点观察</span>';
      else if (b.tier === 'king') t += '<span class="tier normal">市场强势</span>';
      else if (b.tier === 'key') t += '<span class="tier key">强势关注</span>';
      else t += '<span class="tier normal">备选</span>';
      if (b.ml_src === 'new') t += '<span class="tier ml-new">新晋</span>';
      else if (b.ml_src === 'cont') t += '<span class="tier ml-cont">延续</span>';
      var secid = String(b.secid || '').trim();
      var ths = String(b.ths || '').trim();
      var useSecid = ths || secid;
      var thsCode = ths ? ths.replace(/^ths:/i, '').replace(/^\d+\./, '') : '';
      var href = useSecid ? ('../demo.html?secid=' + encodeURIComponent(useSecid) + '&period=day' + (b.name ? '&name=' + encodeURIComponent(b.name) : '')) : '#';
      var nm = '<a class="br-name" href="' + href + '" target="_blank" rel="noopener">' + esc(b.name) +
        (thsCode ? ' <span class="br-code">' + esc(thsCode) + '</span>' : '') +
        (b.ml_name && b.ml_name !== b.name ? ' <span class="br-code">主线：' + esc(b.ml_name) + '</span>' : '') + ' ↗</a>';
      var st = '';
      if (isAll) {
        if (b.mainline && !b.f164) st = '主线 · 资金+技术双确认';
        else st = '5日主力 <b>' + money(b.f164) + '</b> ｜ ' + dataDayLabel(d) + '主力 <b>' + money(b.f62) + '</b>' + (b.p5 != null ? ' ｜ 5日 ' + pct(b.p5) : '');
      } else {
        if (b.count != null) st += b.count + ' 只异动';
        if (b.amount != null) st += (st ? ' ｜ ' : '') + '成交 ' + money(b.amount);
        if (b.p5 != null) st += (st ? ' ｜ ' : '') + '5日 ' + pct(b.p5);
        if (b.hot) st += ' ｜ ✓板块榜';
      }
      if (b.streak >= 2) st += (st ? ' ｜ ' : '') + '🔥 连续 ' + b.streak + ' 日上榜';
      var mlWhy = b.ml_why ? '<span class="br-mlwhy">' + esc(b.ml_why) + '</span>' : '';
      var lds = (b.leaders || []).slice(0, 3).map(function(ld){
        return '<a href="../demo.html?secid=' + encodeURIComponent(secidForCode(ld.code)) + '&period=day" target="_blank" rel="noopener">' + esc(ld.name) + ' <span class="' + cls(ld.pct) + '">' + pct(ld.pct) + '</span></a>';
      }).join('　');
      return '<div class="br-item">' +
        '<span class="br-idx' + (b.tier === 'king' ? ' t1' : (b.tier === 'key' ? ' t2' : '')) + '">' + (idx + 1) + '</span>' + t + nm +
        (st ? '<span class="br-st">' + st + '</span>' : '') +
        mlWhy +
        (lds ? '<span class="br-leaders">龙头 ' + lds + '</span>' : '') +
      '</div>';
    }).join('');
  }

  function emotionBannerMobile(d){
    var emo = (d.meta && d.meta.emotion) || null;
    var h = '';
    if (emo && emo.regime === 'risk_off') {
      h += '<div class="em-alert">⚠️ 情绪偏冷（温度' + (emo.temperature != null ? emo.temperature : '—') + '）：注意控制仓位、以回踩企稳为主，回踩企稳门槛额外 +3。</div>';
    }
    if (d.market_code === 'pb' && emo && emo.fb) {
      var _pr = emo.promote_rate != null ? Math.round(emo.promote_rate * 100) : null;
      var _hint = emo.promote_rate >= 0.25 ? '晋级率偏高' : (emo.promote_rate < 0.15 ? '晋级率偏低·谨慎' : '晋级率中性');
      h += '<div class="em-note">昨日首板 ' + emo.fb + ' 只 · 今日晋级 ' + emo.promote + ' 只' +
        (_pr != null ? '（晋级率 ' + _pr + '% · ' + _hint + '）' : '') +
        '：回踩企稳仅跟踪「缩量不破位 + 主线共振」形态。</div>';
    }
    return h;
  }

  function renderList(d){
    var el = $('list');
    var picks = d.picks || [];
    var emoHtml = emotionBannerMobile(d);
    if (d.vip_required) {
      el.innerHTML = '<div class="vip-gate"><div class="t">🔒 个股筛选为 VIP 专属</div><div class="d">板块热点免费看，个股分析与主线锁定需开通 VIP 后解锁。</div><a href="account.html">去开通 VIP →</a></div>';
      return;
    }
    var isMacd = (d.market_code || state.market) === 'macd';
    if (isMacd) {
      var reds = d.macd_reds || [];
      var mrHtml = emoHtml;
      if (!reds.length) {
        mrHtml += '<div class="empty">' + dataDayLabel(d) + '无 MACD 首红标的：大盘红柱延伸期、无新鲜首红属正常，宁缺毋滥；可稍后重扫。</div>';
      } else {
        mrHtml += '<div class="sec-title" style="padding:6px 0 4px">🔥 进阶策略 · MACD 量能首红（' + reds.length + ' 只）</div>' +
          '<div class="rescan-note">底部金叉第一根红柱 + 量能确认（右侧启动强信号），「今日首红 / 红柱第 2-3 天」优先。</div>';
        mrHtml += reds.map(function(m, i){ m.rank = i + 1; return redCard(m); }).join('');
      }
      el.innerHTML = mrHtml;
      var mrRunners = d.runners || [];
      var mrRb = $('runner-box');
      if (mrRunners.length) {
        mrRb.innerHTML = '<details><summary>备选池（落选原因）' + mrRunners.length + '</summary><table><tr><th>代码</th><th>名称</th><th>评分</th><th>原因</th></tr>' +
          mrRunners.map(function(r){
            var bl = r.bearish_level === 'hard' ? '<span style="color:#f87171">硬伤</span>' : (r.bearish_level === 'warn' ? '<span style="color:#fbbf24">警示</span>' : '');
            return '<tr><td>' + esc(r.code) + '</td><td><a href="quote.html?secid=' + encodeURIComponent(secidForCode(r.code)) + '&name=' + encodeURIComponent(r.name) + '">' + esc(r.name) + '</a></td><td>' + (r.final != null ? r.final : '—') + '</td><td>' + bl + ' ' + esc((r.risks || []).join('；') || '排名靠后') + '</td></tr>';
          }).join('') + '</table></details>';
      } else mrRb.innerHTML = '';
      return;
    }
    if (!picks.length) {
      var txt = d.archive ? '该日期无归档筛选记录' : dataDayLabel(d) + '无合格标的：行情整体偏弱或筛选条件过严，宁缺毋滥；可稍后重扫。';
      el.innerHTML = emoHtml + '<div class="empty">' + txt + '</div>';
      return;
    }
    el.innerHTML = emoHtml + picks.map(card).join('');
    // runners
    var runners = d.runners || [];
    var rb = $('runner-box');
    if (runners.length) {
      rb.innerHTML = '<details><summary>备选池（落选原因）' + runners.length + '</summary><table><tr><th>代码</th><th>名称</th><th>评分</th><th>原因</th></tr>' +
        runners.map(function(r){
          var bl = r.bearish_level === 'hard' ? '<span style="color:#f87171">硬伤</span>' : (r.bearish_level === 'warn' ? '<span style="color:#fbbf24">警示</span>' : '');
          return '<tr><td>' + esc(r.code) + '</td><td><a href="quote.html?secid=' + encodeURIComponent(secidForCode(r.code)) + '&name=' + encodeURIComponent(r.name) + '">' + esc(r.name) + '</a></td><td>' + (r.final != null ? r.final : '—') + '</td><td>' + bl + ' ' + esc((r.risks || []).join('；') || '排名靠后') + '</td></tr>';
        }).join('') + '</table></details>';
    } else rb.innerHTML = '';
  }

  function renderHist(d){
    var el = $('hist');
    d = d || {};
    if (d.detail && /token|login|登录|授权|缺失|无效/i.test(String(d.detail))) {
      el.innerHTML = '<div class="empty"><a href="account.html" style="color:#8ab8ff">登录后查看历史归档 →</a></div>';
      return;
    }
    var list = d.list || [];
    if (!list.length) { el.innerHTML = '<div class="empty">暂无历史归档</div>'; return; }
    el.innerHTML = list.map(function(it){
      var sub = [];
      if (it.asof && it.asof !== it.date) sub.push('数据截至 ' + esc(it.asof));
      if (it.picks && it.picks.length) sub.push(it.picks.map(function(p){ return esc(p.name); }).join(' / '));
      var href = 'gd.html?date=' + encodeURIComponent(it.date) + '&market=' + encodeURIComponent(state.market);
      return '<a class="hist-row" href="' + href + '"><div class="hr-date">' + esc(it.date) + '</div><div class="hr-sub">' + (sub.join(' · ') || '查看') + '</div></a>';
    }).join('');
  }

  var pollTm = null, pollDeadline = 0;
  function pollScanDone(afterFn){
    if (pollTm) clearInterval(pollTm);
    if (!pollDeadline) pollDeadline = Date.now() + 12 * 60 * 1000;
    pollTm = setInterval(function(){
      api('/api/bj/screener/progress?market=' + encodeURIComponent(state.market)).then(function(p){
        var pg = p.progress || {};
        var m = $('meta');
        if (m) m.innerHTML = '扫描中：' + esc(pg.step || '…') + '（' + num(pg.pct || 0, 0) + '%）';
        if (!p.running || Date.now() > pollDeadline) {
          clearInterval(pollTm); pollTm = null; pollDeadline = 0;
          if (afterFn) afterFn();
        }
      }).catch(function(){});
    }, 2000);
  }

  function load(showLoading){
    var url = '/api/bj/screener?market=' + encodeURIComponent(state.market);
    if (state.date) url += '&date=' + encodeURIComponent(state.date);
    if (showLoading) $('list').innerHTML = '<div class="empty">加载中…</div>';
    api(url).then(function(d){
      if (d && d.scanning === true) {
        $('list').innerHTML = '<div class="empty"><span class="spin"></span> 正在生成今日复盘数据（约 1~2 分钟），请稍候…</div>';
        pollScanDone(function(){ load(true); });
        return;
      }
      if (!d || d.ok === false || (d && d.detail)) {
        var msg = (d && (d.message || d.msg || d.detail)) || '加载失败，请稍后重试';
        if (/token|login|登录|授权|缺失|无效/i.test(String(msg))) {
          $('list').innerHTML = '<div class="vip-gate"><div class="t">🔒 复盘筛选为登录/VIP 专属</div><div class="d">请先登录或开通 VIP，再查看今日 AI 筛选与历史归档。</div><a href="account.html">登录 / 开通 VIP →</a></div>';
        } else {
          $('list').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
        }
        return;
      }
      if (state.date) {
        document.title = '历史归档 · ' + state.date;
        $('sec-title').textContent = '历史归档 · ' + (d.asof || state.date);
      } else {
        var stNode = $('sec-title');
        if (stNode && stNode.childNodes.length) stNode.childNodes[0].textContent = dataDayLabel(d) + ' AI 筛选';
      }
      renderEnv(d);
      renderMeta(d);
      renderList(d);
      renderPrevTrack(d);
      renderBoardRank(d);
      renderMainlineBasis(d);
    }).catch(function(e){
      var st = (e && e.status) ? Number(e.status) : 0;
      var msg = (e && e.message) ? String(e.message) : '';
      if (st === 401 || st === 403 || /token|login|登录|授权|失效/i.test(msg)) {
        showGuestGate();
        return;
      }
      $('list').innerHTML = '<div class="empty">网络异常：' + esc(msg.slice(0, 80) || String(e).slice(0, 80)) + '</div>';
    });
  }

  function refreshScan(){
    toast('已启动扫描，约 1~2 分钟…', true);
    api('/api/bj/screener/start?market=' + encodeURIComponent(state.market) + '&force=1').then(function(st){
      if (!st || st.ok !== true) { toast((st && st.message) || '启动失败', false); return; }
      pollScanDone(function(){ load(true); toast('扫描完成', true); });
    }).catch(function(e){ toast('启动失败：' + String(e).slice(0, 60), false); });
  }
  // 重新扫描门控：盘中（15:10 收盘数据定型前）禁止强制重扫，避免未定型 K 线污染当日数据
  function scanGateState(){
    var now = new Date();
    var d = now.getDay();
    if (d === 0 || d === 6) return { allow: false, note: '非交易日：展示最近收盘归档，无需重新扫描' };
    var hm = now.getHours() * 60 + now.getMinutes();
    if (hm < 15 * 60 + 10) return { allow: false, note: '盘中未定型：15:10 后可重新扫描' };
    return { allow: true, note: '' };
  }
  function applyScanGateMobile(){
    var rf = $('btn-refresh'), note = $('rescan-note');
    if (!rf) return;
    var g = scanGateState();
    if (!g.allow) {
      rf.classList.add('gated');
      rf.title = g.note;
      if (note) { note.textContent = g.note; note.hidden = false; }
    } else {
      rf.classList.remove('gated');
      rf.title = '';
      if (note) note.hidden = true;
    }
  }

  // tabs
  var tabs = document.querySelectorAll('.tabs button');
  tabs.forEach(function(b){
    b.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      state.market = b.getAttribute('data-m');
      try { localStorage.setItem('bj_tab', state.market); } catch(e){}
      state.date = '';
      history.replaceState(null, '', 'gd.html?i=' + encodeURIComponent(inviteCode()));
      var ptEl = $('pt'); if (ptEl) ptEl.style.display = 'none';
      var brEl = $('boardrank'); if (brEl) brEl.innerHTML = '';
      var mtEl = $('meta'); if (mtEl) mtEl.innerHTML = '';
      if (!token()) { loadMarket(); showGuestGate(); return; }
      loadMarket(); loadWinrate();
      load(true);
      renderHist(undefined);
      api('/api/bj/history?market=' + encodeURIComponent(state.market)).then(renderHist).catch(function(){});
    });
  });
  $('btn-refresh').addEventListener('click', function(){
    if (!token()) { showGuestGate(); return; }
    var g = scanGateState();
    if (!g.allow) { toast(g.note, false); return; }
    refreshScan();
  });
  applyScanGateMobile();
  setInterval(applyScanGateMobile, 30 * 1000);
  $('link-desktop').addEventListener('click', function(){
    try { sessionStorage.setItem('ai24x_desktop_force', '1'); } catch(e){}
  });

  function inviteCode(){
    try { return String(localStorage.getItem('ai24x_invite_code') || '').trim().toUpperCase() || 'BWPX3Z8B'; } catch(e){ return 'BWPX3Z8B'; }
  }
  // desktop link follow invite
  var desk = $('link-desktop');
  if (desk) { desk.href = '../gd.html?i=' + encodeURIComponent(inviteCode()); }

  // boot：初始 tab 高亮
  var initTab = document.querySelector('.tabs button[data-m="' + state.market + '"]');
  if (initTab) {
    tabs.forEach(function(x){ x.classList.remove('on'); });
    initTab.classList.add('on');
  }
  // boot
  if (!token()) {
    // 游客：大盘环境免费可见；VIP 区域直接显示登录/开通引导，不发 /api/bj/* 请求（与桌面版一致）
    if (state.date) {
      load(true);
      return;
    }
    loadMarket();
    showGuestGate();
    return;
  }
  if (!state.date) { loadMarket(); loadWinrate(); }
  load(true);
  api('/api/bj/history?market=' + encodeURIComponent(state.market)).then(renderHist).catch(function(){});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="HandheldFriendly" content="true" />

<script>
(function () {
  try {
    var k = "ai24x_a_theme";
    var t = String(localStorage.getItem(k) || "").trim() || "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/base.css?v=56" />
<link rel="stylesheet" href="/css/tool.css?v=44" />
<style>
.page-main .wrap { max-width: min(1360px, 100%); padding: 12px 14px 26px; }
.view-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.view-top h1 { margin: 0 0 6px; font-size: 20px; }
.view-top p.sub { margin: 0; }
.vip-badge { display: inline-block; vertical-align: middle; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #3a2c00; background: linear-gradient(135deg, #ffd666, #fbbf24); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: rgba(96,165,250,.12); color: var(--accent); border: 1px solid rgba(96,165,250,.35); }
.sub { color: var(--muted); font-size: 13px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
#report { overflow-x: auto; }
#report table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
#report th, #report td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
#report th { background: var(--panel2); font-weight: 600; color: var(--text); }
#report tr:nth-child(even) td { background: rgba(128,140,170,.05); }
#report h1 { font-size: 20px; color: var(--text); }
#report h2 { font-size: 16px; margin: 22px 0 10px; border-left: 4px solid var(--accent); padding-left: 10px; color: var(--text); }
#report h2.h2-core{font-size:17px;padding:10px 12px;border-radius:10px;border-left:6px solid var(--rise);background:linear-gradient(90deg,rgba(248,113,113,.16),rgba(248,113,113,.02));box-shadow:0 1px 8px rgba(248,113,113,.14);margin:24px 0 12px}
#report h2.h2-core.h2-risk{border-left-color:#f59e0b;background:linear-gradient(90deg,rgba(251,191,36,.16),rgba(251,191,36,.02));box-shadow:0 1px 8px rgba(251,191,36,.14)}
#report h3 { font-size: 14px; color: var(--text); }
#report .note { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); color: var(--warn); font-size: 13px; padding: 8px 12px; border-radius: 10px; margin: 10px 0; }
#report hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
#report code { background: var(--panel2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
#report details.fold { margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); overflow: hidden; }
#report details.fold summary { cursor: pointer; list-style: none; padding: 10px 14px; font-size: 15px; font-weight: 700; color: var(--text); border-left: 4px solid var(--accent); }
#report details.fold summary::-webkit-details-marker { display: none; }
#report details.fold summary::before { content: "\25b8 "; color: var(--accent); }
#report details.fold[open] summary::before { content: "\25be "; }
#report details.fold[open] summary { border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="page-main">
  <div class="wrap">
    <section class="card">
      <div class="view-top">
        <div>
          <h1>历史大盘 <span class="vip-badge">信号 · 主线</span></h1>
          <p class="sub">往期归档查看：大盘信号 → 资金主攻 → 板块技术体检 → 主线锁定。</p>
        </div>
        <div class="btns" style="margin:0;">
          <a class="btn" href="/daily/">← 返回大盘</a>
        </div>
      </div>
      <div class="sub" style="margin-top:6px">当前查看：<span class="badge" id="f-date">—</span></div>
    </section>
    <section class="card" id="report"><p class="sub">加载中…</p></section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/shell.js?v=61"></script>
<script>
try { window.AI24X_A_SHELL && window.AI24X_A_SHELL.mount("daily"); } catch (e) {}
</script>
<script>
(function () {
  var API = (window.AI24X_A_SHELL && AI24X_A_SHELL.getApiBase) ? AI24X_A_SHELL.getApiBase() : '';
  var q = new URLSearchParams(location.search);
  var d = q.get('date') || '';
  function fmtDate8(v) { var s = String(v || ''); return /^\d{8}$/.test(s) ? (s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8)) : s; }
  document.getElementById('f-date').textContent = d ? fmtDate8(d) : '当前报告';
  function token() {
    try { var t = localStorage.getItem('ai24x_a_token'); if (t && t.length > 20) return t; } catch (e) {}
    return '';
  }
  function api(path) {
    var h = { cache: 'no-store' };
    var t = token();
    if (t) h.Authorization = 'Bearer ' + t;
    return fetch(API + path, { headers: h, cache: 'no-store' }).then(function (r) { return r.json(); });
  }
  var url = d ? ('/api/report/' + encodeURIComponent(d)) : '/api/report/today';
  api(url).then(function (j) {
    if (j.ok) {
      document.getElementById('report').innerHTML = j.html;
    } else {
      document.getElementById('report').innerHTML = '<p class="sub">' + (j.msg || ('未找到该日期大盘：' + d)) + '</p>';
    }
  }).catch(function (e) {
    document.getElementById('report').innerHTML = '<p class="sub">服务暂不可用，请稍后重试。</p>';
  });
})();
</script>
</body>
</html>

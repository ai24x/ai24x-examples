# a.ai24x.com（AI 行情官·灯塔版）Nginx 模板
# - 前端：p/a1/web（PM2 a1-web-18001, 127.0.0.1:18001）
# - API：p/a1/api/server（PM2 a1-api-18011, 127.0.0.1:18011）
#
# 注意：此文件是“模板”。生产请按真实证书路径、域名、上游地址调整。
#

upstream ai24x_a1_web {
    server 127.0.0.1:18001;
    keepalive 16;
}

upstream ai24x_a1_api {
    server 127.0.0.1:18011;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name a.ai24x.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a.ai24x.com;

    # 证书（示例：Let's Encrypt）
    ssl_certificate     /etc/nginx/ssl/live/a.ai24x.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/a.ai24x.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    # -------------------------
    # 安全响应头（全站）
    # -------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP：当前前端大量 inline 脚本/样式，先用“可运行”的基线；后续建议逐步收紧。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self' https: http:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # -------------------------
    # 反代：API（建议路径为 /api/）
    # -------------------------
    location /api/ {
        proxy_pass http://ai24x_a1_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------
    # 分享短链落地页：/i/{code}
    # - 由 API 服务端渲染 OG meta，确保微信抓取生成“卡片预览”
    # - 仍使用 a.ai24x.com 域名（同源，便于分享与后续 JS-SDK）
    # -------------------------
    location ^~ /i/ {
        proxy_pass http://ai24x_a1_api/i/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 可选：健康检查直通
    location /health {
        proxy_pass http://ai24x_a1_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # 前端：静态站（/）
    # -------------------------
    location / {
        proxy_pass http://ai24x_a1_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 禁止访问敏感文件（防误曝）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ /(README\.md|\.git|\.env|\.htaccess|\.htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }
}


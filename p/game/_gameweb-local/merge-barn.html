<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Merge Barn · 合成农场</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:linear-gradient(170deg,#0f172a,#14532d); color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  .hud { display:flex; gap:20px; font-size:14px; font-weight:700; color:#94a3b8; margin-bottom:8px; }
  .hud b { color:#fbbf24; }
  #msg { min-height:24px; font-size:14px; font-weight:700; margin-bottom:8px; }
  #board { position:relative; width:100%; max-width:420px; flex:1; background:rgba(20,83,45,.35); border:2px solid #166534; border-radius:20px; overflow:hidden; }
  .creature {
    position:absolute; width:52px; height:52px; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    background:#1e293b; border:2px solid #475569;
    transition: transform .1s; touch-action:manipulation;
    box-shadow: 0 4px 8px rgba(0,0,0,.3);
  }
  .creature:active { transform: scale(.88); }
  .creature.sel { border-color:#fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.45); }
  .creature.merge { animation: mergePop .4s; }
  @keyframes mergePop { 40% { transform: scale(1.35); } }
  #actions { display:flex; gap:12px; margin-top:10px; width:100%; max-width:420px; }
  .act {
    flex:1; background:linear-gradient(90deg,#fbbf24,#f59e0b); color:#1e293b; border:none;
    font-size:15px; font-weight:800; padding:12px 8px; border-radius:12px; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.3); touch-action:manipulation;
  }
  .act:active { transform: translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .act.gray { background:linear-gradient(90deg,#475569,#334155); color:#cbd5e1; }
  .back { color:#64748b; font-size:12px; text-decoration:none; margin-top:10px; }
</style>
<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>
<style id="xz-mz">
#overlay{position:fixed;inset:0;background:rgba(2,6,23,.9);display:none;align-items:center;justify-content:center;z-index:10;}
#overlay.show{display:flex;}
#overlay .panel{text-align:center;padding:30px 26px;border-radius:20px;background:#1e293b;border:1px solid #334155;max-width:320px;width:90%;}
#overlay .panel h2{font-size:22px;margin-bottom:6px;}
#overlay .grade{font-size:44px;font-weight:800;color:#38bdf8;margin:6px 0 2px;}
#overlay .avg{color:#94a3b8;font-size:14px;margin-bottom:12px;}
#overlay .share{font-size:13px;color:#fbbf24;margin-bottom:16px;padding:8px 12px;background:#1e293b;border:1px dashed #475569;border-radius:10px;}
#overlay .play{background:linear-gradient(90deg,#38bdf8,#6366f1);border:none;color:#fff;font-size:17px;font-weight:800;padding:12px 36px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);touch-action:manipulation;}
#overlay .play:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.3);}
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Merge Barn<span class="tg">合成农场</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>拖动相同动物合并升级，从鸡蛋一路合成到神兽，目标是<b>农场毕业</b>。</div>

<div id="wrap">
  <div class="hud"><div>等级 <b id="lvl">1</b></div><div>合成 <b id="merges">0</b></div></div>
  <div id="msg">点两个相同的小动物，合体升级！</div>
  <div id="board"></div>
  <div id="actions">
    <button class="act" id="spawnBtn">🐣 召唤新伙伴</button>
    <button class="act gray" id="clearSel">取消选择</button>
  </div>
  <a class="back" href="index.html">← 返回列表</a>
</div>

<div id="overlay"><div class="panel"><h2>🏆 农场毕业！</h2><div class="grade">凤凰合体成功</div><div class="avg">最高 <b id="mBest">-</b> 级 · 共合成 <b id="mCount">0</b> 次</div><div class="share">我在合成农场合出了凤凰！🏆 你来挑战吗？</div><button class="play" id="mzAgain">继续养殖</button></div></div>
<script>
(function(){
  'use strict';
  var board=document.getElementById('board'), msgEl=document.getElementById('msg');
  var lvlEl=document.getElementById('lvl'), mergesEl=document.getElementById('merges');
  var spawnBtn=document.getElementById('spawnBtn'), clearSel=document.getElementById('clearSel');

  // 原创进化链（5 级）：蛋→小鸡→公鸡→孔雀→凤凰
  var CHAIN=[{e:'🥚',name:'蛋'},{e:'🐣',name:'小鸡'},{e:'🐓',name:'公鸡'},{e:'🦚',name:'孔雀'},{e:'🐦‍🔥',name:'凤凰'}];
  var MAXLV=CHAIN.length-1;
  var items=[], selected=null, merges=0, maxLevel=0;
  var W=0,H=0;

  var actx=null;
  function snd(freq){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(.2, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.25);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.26);
    }catch(e){}
  }

  function layout(){
    W=board.clientWidth||360; H=board.clientHeight||360;
    items.forEach(function(it){ it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px'; });
  }

  function makeEl(it){
    var el=document.createElement('div');
    el.className='creature';
    el.textContent=CHAIN[it.lv].e;
    el.addEventListener('pointerdown', function(e){ e.preventDefault(); tap(it); });
    return el;
  }

  function randomPos(){
    var w=Math.max(260, W), h=Math.max(300, H);
    return { x: 8+Math.random()*(w-68), y: 8+Math.random()*(h-68) };
  }

  function addItem(lv, silent){
    var it={ lv:lv, x:0, y:0 };
    var p=randomPos();
    it.x=p.x; it.y=p.y;
    it.el=makeEl(it);
    board.appendChild(it.el);
    it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px';
    items.push(it);
    maxLevel=Math.max(maxLevel,lv);
    lvlEl.textContent=maxLevel+1;
    if(!silent) snd(300+lv*80);
    return it;
  }

  function deselect(){
    if(selected){ selected.el.classList.remove('sel'); selected=null; }
  }

  function tap(it){
    if(!selected){
      selected=it; it.el.classList.add('sel');
      msgEl.textContent='已选 '+(CHAIN[it.lv].name)+'，再点一个同级的合成';
      return;
    }
    if(selected===it){ deselect(); msgEl.textContent='已取消选择'; return; }
    if(selected.lv===it.lv && selected.lv<MAXLV){
      // 合成！
      var a=selected, b=it;
      deselect();
      var nl=a.lv+1;
      a.el.classList.add('merge'); b.el.classList.add('merge');
      snd(500+nl*120);
      msgEl.textContent='✨ '+CHAIN[a.lv].name+' + '+CHAIN[b.lv].name+' = '+CHAIN[nl].name+'！';
      merges++; mergesEl.textContent=merges;
      maxLevel=Math.max(maxLevel,nl); lvlEl.textContent=maxLevel+1;
      var selfA=a, selfB=b;
      setTimeout(function(){
        board.removeChild(selfA.el); board.removeChild(selfB.el);
        items=items.filter(function(x){ return x!==selfA && x!==selfB; });
        addItem(nl);
        if(maxLevel>=MAXLV){ msgEl.textContent='🏆 合出凤凰！农场毕业了！'; var mzOv=document.getElementById('overlay'); if(mzOv){ document.getElementById('mBest').textContent=(maxLevel+1); document.getElementById('mCount').textContent=merges; mzOv.classList.add('show'); } }
      }, 400);
    } else {
      deselect();
      msgEl.textContent = '等级不同，无法合成（点同级）';
    }
  }

  spawnBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); addItem(0); });
  clearSel.addEventListener('pointerdown', function(e){ e.preventDefault(); deselect(); msgEl.textContent='点两个相同的小动物，合体升级！'; });
  window.addEventListener('resize', function(){ layout(); });

  // 开局：6 个蛋
  addItem(0,true); addItem(0,true); addItem(0,true); addItem(0,true); addItem(0,true); addItem(0,true);
  // 防初始化时尺寸为 0：延迟修正一次
  setTimeout(function(){ layout(); }, 100);
})();
</script>
<script>
(function(){
  'use strict';
  // --- 等比缩放：390x780 设计基准（上方 64px 顶部栏），其它屏幕自动等比 ---
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    var w=W*s,h=H*s;
    wrap.style.width=w+'px';
    wrap.style.height=h+'px';
    wrap.style.left=((innerWidth-w)/2)+'px';
    wrap.style.top=(TOP+(innerHeight-TOP-h)/2)+'px';
    wrap.style.position='fixed';
    wrap.style.margin='0';
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top left';
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  // 结算浮层提到顶部栏之上（面板里自带返回入口）
  var ov=document.getElementById('overlay');
  if(ov) ov.style.zIndex=60;
  // --- 玩法说明折叠 ---
  var hb=document.getElementById('howBtn'),ht=document.getElementById('howto');
  if(hb&&ht){
    hb.addEventListener('click',function(e){e.stopPropagation();ht.classList.toggle('show');});
    document.addEventListener('pointerdown',function(e){if(ht.classList.contains('show')&&!ht.contains(e.target)&&e.target!==hb)ht.classList.remove('show');});
  }
  // --- L1 防拷贝：禁右键 / 禁 F12 / 禁 Ctrl+S,U,P / 禁 Ctrl+Shift+I,J,C ---
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=e.key||'';
    if(k==='F12'||(e.ctrlKey&&['s','u','p','S','U','P'].indexOf(k)>=0)||(e.ctrlKey&&e.shiftKey&&['i','j','c','I','J','C'].indexOf(k)>=0)){e.preventDefault();e.stopPropagation();return false;}
  });
  // 长按防存图
  document.addEventListener('touchstart',function(){},false);
})();

  var mzBtn=document.getElementById('mzAgain'),mzOv=document.getElementById('overlay');
  if(mzBtn&&mzOv){ mzBtn.addEventListener('pointerdown',function(e){e.preventDefault();mzOv.classList.remove('show');}); }
</script>
<div class="xz-cr">© 2026 AI24X Game Zone</div>
</body>
</html>

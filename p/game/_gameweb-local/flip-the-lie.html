<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flip the Lie · 反着来</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#0f172a; color:#e2e8f0; overflow:hidden; user-select:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  #wrap { height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px; }
  .hud { display:flex; gap:24px; font-size:15px; font-weight:700; color:#94a3b8; }
  .hud b { color:#fbbf24; font-size:20px; }
  #prompt {
    font-size: clamp(28px, 8vw, 44px); font-weight:800; text-align:center; min-height:60px;
    text-shadow: 0 0 20px rgba(56,189,248,.35); transition: opacity .12s;
  }
  #prompt.flash { opacity:.2; }
  .btns { display:flex; gap:18px; width:100%; max-width:480px; flex:0 1 auto; }
  .btn {
    flex:1; aspect-ratio:1; border:none; border-radius:24px; cursor:pointer; color:white;
    font-size: clamp(20px, 6vw, 30px); font-weight:800; letter-spacing:1px;
    box-shadow: 0 8px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s;
    touch-action:manipulation;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #red   { background: linear-gradient(160deg,#ef4444,#b91c1c); }
  #blue  { background: linear-gradient(160deg,#3b82f6,#1d4ed8); }
  #msg { min-height:44px; font-size:17px; font-weight:700; text-align:center; }
  #overlay {
    position:fixed; inset:0; background:rgba(2,6,23,.88); display:none;
    align-items:center; justify-content:center; z-index:10;
  }
  #overlay.show { display:flex; }
  .panel { text-align:center; padding:32px; border-radius:20px; background:#1e293b; border:1px solid #334155; max-width:320px; width:90%; }
  .panel h2 { font-size:26px; margin-bottom:8px; }
  .panel .score { font-size:44px; font-weight:800; color:#38bdf8; margin:12px 0; }
  .panel p { color:#94a3b8; font-size:14px; margin-bottom:18px; }
  .play { background:linear-gradient(90deg,#38bdf8,#6366f1); border:none; color:#fff; font-size:18px; font-weight:800; padding:14px 40px; border-radius:999px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.3); touch-action:manipulation; }
  .play:active { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .back { display:block; margin-top:14px; color:#64748b; font-size:13px; text-decoration:none; }
</style>
<style id="xz-shell">
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid #334155;color:#e2e8f0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
#topbar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar .tg{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px;}
#howBtn{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:800;cursor:pointer;font-size:15px;line-height:1;flex:none;}
#howto{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:70;background:#1e293b;border:1px solid #475569;border-radius:14px;padding:14px 16px;color:#cbd5e1;font-size:13px;line-height:1.7;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.55);}
#howto.show{display:block;}
#howto b{color:#38bdf8;}
.xz-cr{position:fixed;bottom:4px;right:10px;font-size:10px;color:#475569;z-index:45;font-family:-apple-system,"Segoe UI",sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<div id="topbar"><a href="index.html">← 列表</a><span class="tt">Flip the Lie<span class="tg">逆向反应</span></span><button id="howBtn" aria-label="玩法说明">?</button></div>
<div id="howto"><b>怎么玩</b><br>看提示做<b>相反</b>动作：说"左"点右边，说"红"点蓝色。反应越快分越高，玩的就是反直觉。</div>

<div id="wrap">
  <div class="hud"><div>得分 <b id="score">0</b></div><div>连击 <b id="combo">0</b></div></div>
  <div id="prompt">点红色！</div>
  <div id="msg"></div>
  <div class="btns">
    <button class="btn" id="red">红</button>
    <button class="btn" id="blue">蓝</button>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h2>游戏结束</h2>
    <div class="score" id="finalScore">0</div>
    <p id="finalMsg">你点反了！</p>
    <button class="play" id="restart">再来一局</button>
    <a class="back" href="index.html">← 返回列表</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var scoreEl=document.getElementById('score'), comboEl=document.getElementById('combo');
  var promptEl=document.getElementById('prompt'), msgEl=document.getElementById('msg');
  var redBtn=document.getElementById('red'), blueBtn=document.getElementById('blue');
  var overlay=document.getElementById('overlay');
  var finalScore=document.getElementById('finalScore'), finalMsg=document.getElementById('finalMsg');
  var restart=document.getElementById('restart');

  var score=0, combo=0, bestCombo=0, askRed=false, running=false, lock=false, baseDelay=1400;

  function newRound(){
    // 随机指令：要求点红 or 要求点蓝
    askRed = Math.random()<0.5;
    var txt = askRed ? '点红色！' : '点蓝色！';
    promptEl.textContent = txt;
    promptEl.classList.add('flash');
    setTimeout(function(){ promptEl.classList.remove('flash'); }, 120);
    lock=false;
    scheduleAdvance();
  }

  var advanceTimer=null;
  function scheduleAdvance(){
    clearTimeout(advanceTimer);
    // 随时间加快：1400ms → 500ms
    var delay = Math.max(500, baseDelay - score*45);
    advanceTimer = setTimeout(function(){
      if(!running) return;
      gameOver('太慢了，指令消失了！');
    }, delay);
  }

  function onTap(correct){
    if(!running || lock) return;
    lock=true;
    clearTimeout(advanceTimer);
    if(correct){
      score++; combo++;
      bestCombo=Math.max(bestCombo,combo);
      scoreEl.textContent=score; comboEl.textContent=combo;
      msgEl.textContent = combo>=3 ? ('连击 x'+combo+'！') : '正确！';
      if(score>=5 && score%5===0) msgEl.textContent='速度提升了！⚡';
      newRound();
    }else{
      gameOver('你点反了！');
    }
  }

  function gameOver(reason){
    running=false; clearTimeout(advanceTimer);
    finalScore.textContent=score;
    finalMsg.textContent = reason + ' 最高连击 x'+bestCombo;
    setTimeout(function(){ overlay.classList.add('show'); }, 250);
  }

  function start(){
    score=0; combo=0; bestCombo=0;
    scoreEl.textContent='0'; comboEl.textContent='0'; msgEl.textContent='';
    overlay.classList.remove('show');
    running=true; lock=false;
    newRound();
  }

  redBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); onTap(!askRed); });
  blueBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); onTap(askRed); });
  restart.addEventListener('click', start);
  // 首次进来自动开玩
  start();
})();
</script>
<script>
(function(){
  'use strict';
  // --- 等比缩放：390x780 设计基准（上方 64px 顶部栏），其它屏幕自动等比 ---
  var W=390,H=780,TOP=64;
  var wrap=document.getElementById('wrap');
  function fit(){
    if(!wrap) return;
    var s=Math.min(innerWidth/W,(innerHeight-TOP)/H);
    if(s>1.4) s=1.4;
    var w=W*s,h=H*s;
    wrap.style.width=w+'px';
    wrap.style.height=h+'px';
    wrap.style.left=((innerWidth-w)/2)+'px';
    wrap.style.top=(TOP+(innerHeight-TOP-h)/2)+'px';
    wrap.style.position='fixed';
    wrap.style.margin='0';
    wrap.style.transform='scale('+s+')';
    wrap.style.transformOrigin='top left';
  }
  fit();
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  // 结算浮层提到顶部栏之上（面板里自带返回入口）
  var ov=document.getElementById('overlay');
  if(ov) ov.style.zIndex=60;
  // --- 玩法说明折叠 ---
  var hb=document.getElementById('howBtn'),ht=document.getElementById('howto');
  if(hb&&ht){
    hb.addEventListener('click',function(e){e.stopPropagation();ht.classList.toggle('show');});
    document.addEventListener('pointerdown',function(e){if(ht.classList.contains('show')&&!ht.contains(e.target)&&e.target!==hb)ht.classList.remove('show');});
  }
  // --- L1 防拷贝：禁右键 / 禁 F12 / 禁 Ctrl+S,U,P / 禁 Ctrl+Shift+I,J,C ---
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var k=e.key||'';
    if(k==='F12'||(e.ctrlKey&&['s','u','p','S','U','P'].indexOf(k)>=0)||(e.ctrlKey&&e.shiftKey&&['i','j','c','I','J','C'].indexOf(k)>=0)){e.preventDefault();e.stopPropagation();return false;}
  });
  // 长按防存图
  document.addEventListener('touchstart',function(){},false);
})();
</script>
<div class="xz-cr">© 2026 AI24X Game Zone</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>历史封存｜山海渔旧版联调页</title>
  <link rel="icon" href="data:," />
  <!-- 本页在 archive/ 下，资源与脚本仍按 web/ 根路径解析 -->
  <base href="../" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/tool.css" />
  <link rel="stylesheet" href="css/demo.css" />
  <script>
    (function () {
      try {
        var k = "ai24x_fisher_theme";
        var t = String(localStorage.getItem(k) || "").trim() || "calm";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-view", "first");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <p style="margin:0;padding:10px 14px;font-size:13px;background:rgba(15,23,42,.08);border-bottom:1px solid rgba(0,0,0,.06)">
    <strong>历史封存</strong>：此为早期「本地联调 Demo」单页。当前山海渔主体验已迁至站点根目录
    <a href="index.html">index.html（主站）</a>。
  </p>
  <div class="game game-pond" id="gameBox">
    <div class="topbar">
      <div class="topitem">💰 金币 <span id="coins">-</span></div>
      <div class="topitem">⭐ 积分 <span id="score">-</span></div>
      <div class="topitem">🎣 鱼竿 <span id="rodLevel">0</span></div>
      <button class="iconbtn" id="btnSettings" aria-label="settings">⚙️</button>
    </div>

    <div class="areabar" aria-label="areas">
      <button class="area on" data-area="pond" id="areaPond">小池塘</button>
      <button class="area" data-area="lake" id="areaLake">湖泊</button>
      <button class="area" data-area="sea" id="areaSea">深海</button>
      <div class="areahint">当前钓场：<span class="mono" id="spotName">-</span></div>
    </div>

    <div class="scene">
      <div class="water water-pond" id="water">
        <svg class="line-svg" id="lineSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path id="linePath" d=""></path>
        </svg>
        <div class="sky" aria-hidden="true">
          <div class="sun"></div>
          <div class="cloud cloud1"></div>
          <div class="cloud cloud2"></div>
        </div>
        <div class="toast" id="toast">-</div>
        <div class="ring" id="ring"></div>
        <div class="surface" aria-hidden="true"></div>
        <div class="waterLine" aria-hidden="true"></div>
        <div class="splash" aria-hidden="true"></div>
        <div class="hook" id="hook" aria-hidden="true">🪝</div>
        <div class="fish-layer" id="fishLayer" aria-hidden="true"></div>
        <div class="watercut" aria-hidden="true"></div>
        <svg class="rodSvg" id="rodSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="rodGrad" x1="0" x2="0" y1="1" y2="0">
              <stop offset="0" stop-color="rgba(120,53,15,.95)"/>
              <stop offset="1" stop-color="rgba(226,204,173,.95)"/>
            </linearGradient>
          </defs>
          <path id="rodPath" d="" stroke="url(#rodGrad)" stroke-width="2.0" stroke-linecap="round" fill="none"/>
          <path id="rodGrip" d="" stroke="rgba(2,6,23,.28)" stroke-width="5.2" stroke-linecap="round" fill="none" opacity=".85"/>
          <circle class="rodGuide" id="rodG1" r="1.3" fill="rgba(255,255,255,.10)" stroke="rgba(2,6,23,.26)" stroke-width=".5"/>
          <circle class="rodGuide" id="rodG2" r="1.2" fill="rgba(255,255,255,.10)" stroke="rgba(2,6,23,.26)" stroke-width=".5"/>
          <circle class="rodGuide" id="rodG3" r="1.1" fill="rgba(255,255,255,.10)" stroke="rgba(2,6,23,.26)" stroke-width=".5"/>
          <circle id="rodTip" r="1.0" fill="rgba(245,158,11,.92)" stroke="rgba(2,6,23,.20)" stroke-width=".5"/>
        </svg>
        <div class="bobber" id="bobber" title="点击抛竿/钓鱼">
          <div class="floatBody"></div>
        </div>
      </div>

      <div class="tipline">
        <div class="tiptext" id="hintText">点击「抛竿」开始</div>
        <div class="phasebadge">状态：<span class="mono" id="phaseText">-</span></div>
      </div>

      <div class="cooldownline">
        <span class="pill">冷却：<span class="mono" id="cooldownText">-</span></span>
        <div class="bar" aria-label="cooldown"><i id="cooldownBar"></i></div>
      </div>

      <div class="storage" id="storage">
        <div class="stor-head">
          <div class="stor-title">仓库</div>
          <button class="miniBtn" id="btnSellAll">卖光</button>
        </div>
        <div class="stor-list inv" id="inventory"></div>
      </div>
    </div>

    <div class="btmBtns">
      <button class="btnBig primary" id="btnCast">抛竿</button>
      <button class="btnBig hide" id="btnPull">拉杆</button>
    </div>
  </div>

  <div class="modal hide" id="settingsModal" role="dialog" aria-modal="true" aria-label="settings">
    <div class="modalPanel">
      <div class="modalHead">
        <div class="modalTitle">联调与设置</div>
        <button class="iconbtn" id="btnSettingsClose" aria-label="close">✕</button>
      </div>
      <div class="row" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
        <span class="pill">API：<span class="mono" id="api-pill"></span></span>
        <span class="pill">devKey：<span class="mono" id="dev-pill"></span></span>
        <span class="pill">token：<span class="mono" id="tok-pill"></span></span>
      </div>
      <div class="kv" style="margin-top:12px">
        <label>API Base</label>
        <input id="apiBase" placeholder="http://127.0.0.1:18041" />

        <label>devKey</label>
        <input id="devKey" placeholder="web-dev-001" />

        <label>主题</label>
        <select id="theme" class="select-mini" style="max-width:220px">
          <option value="calm">calm（深蓝）</option>
          <option value="dark">dark（深黑）</option>
          <option value="light">light（亮色）</option>
          <option value="guofeng">guofeng（国风淡雅）</option>
          <option value="cartoon">cartoon（卡通休闲）</option>
        </select>

        <label>声效</label>
        <select id="sfx" class="select-mini" style="max-width:220px">
          <option value="on">开（轻）</option>
          <option value="off">关</option>
        </select>
      </div>

      <div style="height:10px"></div>
      <div class="btnrow">
        <button class="btn primary" id="btnLogin">dev-login</button>
        <button class="btn" id="btnMe">刷新状态</button>
        <button class="btn" id="btnClear">清空 token</button>
      </div>
      <div style="height:10px"></div>
      <div class="mini">
        API 文档：<a class="mono" href="http://127.0.0.1:18041/docs" target="_blank">/docs</a>
      </div>

      <div style="height:14px"></div>
      <div class="mini">输出（调试）</div>
      <div id="log" class="log mono"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

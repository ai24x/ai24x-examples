<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI24X Markets · Technical Indicators</title>
  <style>
    :root {
      --bg: #0a0c10; --panel: #12161d; --panel2: #181d26; --border: #252b36;
      --text: #d8dee9; --muted: #8b949e; --accent: #4f8cff;
      --up: #f03a52; --down: #00b578;
      --ma1: #ff8000; --ma2: #3399ff; --ma3: #00c853;
      --macd-dif: #e2e8f0; --macd-dea: #f59e0b;
      --gc: #ff1744; --dc: #00e676;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 700; font-size: 16px; margin-right: 6px; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .lang-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-right: 4px; }
    .lang-switch button { border: 0; background: #0d1117; color: var(--muted); padding: 6px 10px; cursor: pointer; font-size: 12px; }
    .lang-switch button.active { background: var(--accent); color: #fff; }
    #symbol { width: 130px; padding: 8px 10px; background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; text-transform: uppercase; }
    button { padding: 7px 11px; background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #go { background: var(--accent); color: #fff; border-color: var(--accent); }
    .spacer { flex: 1; }
    .err { color: var(--up); font-size: 13px; }
    #quote { display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px; }
    #quote .name { font-weight: 600; font-size: 15px; }
    #quote .price { font-size: 18px; font-weight: 700; }
    #quote .up { color: var(--up); } #quote .down { color: var(--down); }
    #quote .muted { color: var(--muted); }
    main { padding: 12px 16px 30px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .panel h3 { margin: 0; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
    .chart { height: 460px; position: relative; }
    .chart.small { height: 140px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .legend .lg-item { display: inline-flex; align-items: center; gap: 4px; }
    .legend .lg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .legend .lg-arrow { font-size: 12px; }
    .short-ma { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    .short-ma input { accent-color: var(--accent); }
    .tooltip { position: absolute; z-index: 10; pointer-events: none; background: rgba(10,12,16,0.94); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.65; min-width: 200px; box-shadow: 0 4px 16px rgba(0,0,0,.45); }
    .tooltip .tt-date { color: var(--accent); font-weight: 600; margin-bottom: 3px; }
    .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
    .tooltip .tt-num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .tooltip .up { color: var(--up); } .tooltip .down { color: var(--down); }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
    footer { padding: 14px 18px 26px; color: var(--muted); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--border); }
    .samples { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .samples button { padding: 3px 9px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">AI24X <span>Markets</span></div>
    <div class="lang-switch" id="lang-switch">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
    <input id="symbol" value="AAPL" maxlength="20" placeholder="AAPL / SPY / ^GSPC">
    <button id="go" data-i18n="search">Search</button>
    <div class="spacer"></div>
    <button data-period="day" class="active" data-i18n="p.day">1D</button>
    <button data-period="week" data-i18n="p.week">1W</button>
    <button data-period="month" data-i18n="p.month">1M</button>
    <button id="refresh" title="Refresh">⟳</button>
    <span id="err" class="err"></span>
  </header>

  <div class="samples">
    <span data-i18n="popular">Popular</span>
    <button type="button" data-symbol="AAPL">AAPL</button>
    <button type="button" data-symbol="NVDA">NVDA</button>
    <button type="button" data-symbol="SPY">SPY</button>
    <button type="button" data-symbol="QQQ">QQQ</button>
    <button type="button" data-symbol="^GSPC">^GSPC</button>
    <button type="button" data-symbol="^IXIC">^IXIC</button>
    <button type="button" data-symbol="^DJI">^DJI</button>
  </div>

  <div id="quote"></div>

  <main>
    <div class="panel">
      <h3 data-i18n="panel.main">Price · MA14/28/57 · MACD</h3>
      <div class="chart" id="chart-main"></div>
      <div class="tooltip" id="chart-tooltip" hidden></div>
      <label class="short-ma"><input type="checkbox" id="chk-short-ma" checked><span data-i18n="shortma">Short MAs 5/10/20 (dashed)</span></label>
      <div class="legend" id="signal-legend"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="panel.vol">Volume</h3>
      <div class="chart small" id="chart-vol"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="panel.rsi">RSI · 14</h3>
      <div class="chart small" id="chart-rsi"></div>
    </div>
  </main>

  <footer data-i18n="footer">15-minute delayed market data. Sources: Tencent (primary) · Eastmoney · Sina. For educational purposes only — not investment advice.</footer>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script>
    (function () {
      'use strict';

      var I18N = {
        en: {
          search: 'Search',
          popular: 'Popular',
          'p.day': '1D', 'p.week': '1W', 'p.month': '1M',
          'panel.main': 'Price · MA14/28/57 · MACD',
          'panel.vol': 'Volume',
          'panel.rsi': 'RSI · 14',
          shortma: 'Short MAs 5/10/20 (dashed)',
          footer: '15-minute delayed market data. Sources: Tencent (primary) · Eastmoney · Sina. For educational purposes only — not investment advice.',
          loading: 'Loading…',
          quoteFail: 'Quote unavailable: ',
          loadFail: 'Error: ',
          open: 'Open', high: 'High', low: 'Low', close: 'Close', prev: 'Prev close',
          chg: 'Chg', chgPct: 'Chg %', vol: 'Volume', vsPrev: 'vs prev close', vsOpen: 'vs open',
          amplitude: 'Range %', signal: 'Signal', date: 'Date', macd: 'MACD', macdHist: 'Hist',
          legendGc: 'MACD ↑ golden cross', legendDc: '↓ dead cross',
          lgBase: 'Base · watch', lgBottom: 'Bottom · accumulate', lgStrong: 'Strong',
          lgCaution: 'Caution', lgWeak: 'Weak', lgHigh: 'Warning',
        },
        zh: {
          search: '查询',
          popular: '常用',
          'p.day': '日线', 'p.week': '周线', 'p.month': '月线',
          'panel.main': 'K线 · MA14/28/57 生命线 · MACD',
          'panel.vol': '成交量',
          'panel.rsi': 'RSI · 14',
          shortma: '主图叠加短周期均线（虚线）',
          footer: '15 分钟延迟行情。数据源：腾讯（主源）· 东财 · 新浪。内容仅供学习交流与自主决策参考，不构成投资建议。',
          loading: '加载中…',
          quoteFail: '行情暂不可用：',
          loadFail: '加载失败：',
          open: '开', high: '高', low: '低', close: '收', prev: '昨收',
          chg: '涨跌额', chgPct: '涨跌幅', vol: '成交量', vsPrev: '较昨收', vsOpen: '较开盘',
          amplitude: '振幅', signal: '信号', date: '日期', macd: 'MACD', macdHist: '柱',
          legendGc: 'MACD ↑金叉', legendDc: '↓死叉',
          lgBase: '小底 · 关注', lgBottom: '底部 · 低位关注', lgStrong: '金 · 偏强',
          lgCaution: '险 · 谨慎', lgWeak: '等 · 偏弱', lgHigh: '顶 · 预警',
        },
      };

      var MARKER_MAP = {
        '小底': { en: 'Base', zh: '小底' },
        '底1': { en: 'Bottom', zh: '底' },
        '金1': { en: 'S1', zh: '金1' },
        '金2': { en: 'S2', zh: '金2' },
        '金3': { en: 'S3', zh: '金3' },
        '买2': { en: 'Momentum', zh: '转强' },
        '险1·破': { en: 'Ca·brk', zh: '险破' },
        '险2·破': { en: 'Ca·brk', zh: '险破' },
        '险1': { en: 'Caution', zh: '谨慎' },
        '险2': { en: 'Caution', zh: '谨慎' },
        '↗': { en: '↗', zh: '↗' },
        '↘': { en: '↘', zh: '↘' },
      };

      var state = {
        lang: (function () { try { return localStorage.getItem('markets_lang') || 'en'; } catch (e) { return 'en'; } })(),
        symbol: 'AAPL',
        period: 'day',
        last: null,
        lastQuote: null,
        mainChart: null, mainSeries: null, maSeries: {}, maShort: {},
        macdDif: null, macdDea: null, macdBar: null,
        volChart: null, volSeries: null,
        rsiChart: null, rsiSeries: null,
        tooltipHandler: null,
        maCache: null,
      };

      function t(k) { return (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k; }
      function $(id) { return document.getElementById(id); }
      function escHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function fmtNum(v, d) {
        if (v === null || v === undefined || Number.isNaN(v)) return '—';
        return Number(v).toFixed(d === undefined ? 2 : d);
      }
      function fmtVol(v) {
        if (v === null || v === undefined || Number.isNaN(v)) return '—';
        if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
        if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
        return String(Math.round(v));
      }
      function sma(closes, n) {
        var out = [];
        var sum = 0;
        for (var i = 0; i < closes.length; i++) {
          sum += closes[i];
          if (i >= n) sum -= closes[i - n];
          out.push(i >= n - 1 ? sum / n : null);
        }
        return out;
      }
      function markerText(text) {
        var key = String(text || '').replace(/\u200b/g, '').trim();
        var m = MARKER_MAP[key];
        if (m) return m[state.lang];
        var keys = Object.keys(MARKER_MAP).sort(function (a, b) { return b.length - a.length; });
        for (var i = 0; i < keys.length; i++) {
          if (key.indexOf(keys[i]) === 0) return MARKER_MAP[keys[i]][state.lang];
        }
        return key || '';
      }

      function disposeCharts() {
        [state.mainChart, state.volChart, state.rsiChart].forEach(function (c) { try { if (c) c.remove(); } catch (e) {} });
        state.mainChart = state.volChart = state.rsiChart = null;
        state.mainSeries = state.macdDif = state.macdDea = state.macdBar = state.volSeries = state.rsiSeries = null;
        state.maSeries = {}; state.maShort = {};
        state.tooltipHandler = null;
      }

      function createChart(el, height) {
        installAttributionKiller(el);
        var opts = {
          height: height || el.clientHeight || 380,
          layout: { background: { type: 'solid', color: '#12161d' }, textColor: '#8b949e' },
          grid: { vertLines: { color: '#1b212c' }, horzLines: { color: '#1b212c' } },
          timeScale: { borderColor: '#252b36', timeVisible: false },
          rightPriceScale: { borderColor: '#252b36' },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { labelBackgroundColor: '#252b36' }, horzLine: { labelBackgroundColor: '#252b36' } },
        };
        try { opts.attributionLogo = false; } catch (e) {}
        var chart = LightweightCharts.createChart(el, opts);
        return chart;
      }

      // 移除 lightweight-charts 左下角 TradingView 归因链接（站内化，不出现站外链接）
      function installAttributionKiller(containerEl) {
        if (!containerEl || containerEl.__tvAttrKillerInstalled) return;
        containerEl.__tvAttrKillerInstalled = true;
        function isAttrLink(a) {
          if (!a || !a.getAttribute) return false;
          var href = String(a.getAttribute('href') || '');
          return href.indexOf('tradingview.com') >= 0;
        }
        function nukeOnce() {
          try {
            var links = containerEl.querySelectorAll('a[href]');
            for (var i = 0; i < links.length; i++) {
              var a = links[i];
              if (!isAttrLink(a)) continue;
              try {
                if (a.parentNode) a.parentNode.removeChild(a);
              } catch (e1) {
                a.style.display = 'none';
                a.style.pointerEvents = 'none';
              }
            }
          } catch (e2) {}
        }
        nukeOnce();
        setTimeout(nukeOnce, 0);
        setTimeout(nukeOnce, 50);
        setTimeout(nukeOnce, 200);
        try {
          var obs = new MutationObserver(function () { nukeOnce(); });
          obs.observe(containerEl, { childList: true, subtree: true });
        } catch (e3) {}
      }

      function buildMacdMarks(data) {
        var marks = [];
        (data.macd || []).forEach(function (m) {
          if (m.golden_cross) marks.push({ time: m.time, position: 'inBar', color: '#ff1744', shape: 'arrowUp' });
          if (m.dead_cross) marks.push({ time: m.time, position: 'inBar', color: '#00e676', shape: 'arrowDown' });
        });
        return marks;
      }

      function buildSignalMarks(data) {
        var out = [];
        (data.markers || []).forEach(function (m) {
          var txt = markerText(m.text);
          var item = { time: m.time, position: m.position || 'belowBar', color: m.color || '#38bdf8', shape: m.shape || 'arrowUp' };
          if (txt) item.text = txt;
          out.push(item);
        });
        return out;
      }

      function renderMain(data) {
        var el = $('chart-main');
        el.innerHTML = '';
        var chart = createChart(el, 460);
        state.mainChart = chart;

        var candles = data.candles.map(function (c) {
          return { time: c[0], open: +c[1], close: +c[2], high: +c[3], low: +c[4], volume: +c[5] };
        });
        state.mainSeries = chart.addCandlestickSeries({
          upColor: '#f03a52', downColor: '#00b578', borderVisible: false,
          wickUpColor: '#f03a52', wickDownColor: '#00b578',
        });
        state.mainSeries.setData(candles);
        try { chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.08, bottom: 0.32 } }); } catch (e) {}

        var closes = candles.map(function (c) { return c.close; });
        var maDefs = [
          { n: 14, color: '#ff8000' },
          { n: 28, color: '#3399ff' },
          { n: 57, color: '#00c853' },
        ];
        state.maCache = {};
        maDefs.forEach(function (d) {
          state.maCache[d.n] = sma(closes, d.n);
          var line = chart.addLineSeries({ color: d.color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
          line.setData(state.maCache[d.n].map(function (v, i) { return { time: candles[i].time, value: v }; }).filter(function (p) { return p.value !== null; }));
          state.maSeries[d.n] = line;
        });

        var shortDefs = [
          { n: 5, color: 'rgba(230, 168, 77, 0.88)' },
          { n: 10, color: 'rgba(94, 179, 224, 0.88)' },
          { n: 20, color: 'rgba(125, 216, 122, 0.88)' },
        ];
        shortDefs.forEach(function (d) {
          var line = chart.addLineSeries({ color: d.color, lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
          line.setData(sma(closes, d.n).map(function (v, i) { return { time: candles[i].time, value: v }; }).filter(function (p) { return p.value !== null; }));
          state.maShort[d.n] = line;
        });

        var macdOpts = { priceLineVisible: false, lastValueVisible: false, priceScaleId: 'macd' };
        state.macdDif = chart.addLineSeries(Object.assign({ color: '#e2e8f0', lineWidth: 1 }, macdOpts));
        state.macdDea = chart.addLineSeries(Object.assign({ color: '#f59e0b', lineWidth: 1 }, macdOpts));
        state.macdBar = chart.addHistogramSeries(Object.assign({ priceFormat: { type: 'price', precision: 4 } }, macdOpts));
        try { chart.priceScale('macd').applyOptions({ scaleMargins: { top: 0.72, bottom: 0.03 } }); } catch (e) {}

        var bars = [], difs = [], deas = [];
        (data.macd || []).forEach(function (d) {
          var bc = d.bar >= 0 ? '#ef444488' : '#22c55e88';
          if (d.golden_cross) bc = '#ff1744';
          if (d.dead_cross) bc = '#00e676';
          bars.push({ time: d.time, value: d.bar, color: bc });
          difs.push({ time: d.time, value: d.dif });
          deas.push({ time: d.time, value: d.dea });
        });
        state.macdBar.setData(bars);
        state.macdDif.setData(difs);
        state.macdDea.setData(deas);
        state.macdDif.setMarkers(buildMacdMarks(data));

        state.mainSeries.setMarkers(buildSignalMarks(data));
        chart.timeScale().fitContent();
        setupTooltip(chart, state.mainSeries, candles, data);
        wireShortMa(data);
      }

      function wireShortMa(data) {
        var chk = $('chk-short-ma');
        if (!chk) return;
        chk.onchange = function () {
          [5, 10, 20].forEach(function (n) {
            if (state.maShort[n]) try { state.maShort[n].applyOptions({ visible: chk.checked }); } catch (e) {}
          });
        };
        chk.onchange();
      }

      function setupTooltip(chart, series, candles, data) {
        var tooltip = $('chart-tooltip');
        var wrap = $('chart-main');
        if (state.tooltipHandler) { try { chart.unsubscribeCrosshairMove(state.tooltipHandler); } catch (e) {} }
        var byTime = {};
        candles.forEach(function (c, i) { byTime[c.time] = i; });
        var macdByTime = {};
        (data.macd || []).forEach(function (m) { macdByTime[m.time] = m; });

        state.tooltipHandler = function (param) {
          if (!param.point || param.time === undefined || param.time === null) { tooltip.hidden = true; return; }
          var bar = param.seriesData.get(series);
          if (!bar || bar.open === undefined) { tooltip.hidden = true; return; }
          var idx = byTime[param.time];
          if (idx === undefined) { tooltip.hidden = true; return; }
          var prev = idx > 0 ? candles[idx - 1].close : null;
          var chg = prev != null ? bar.close - prev : null;
          var vsPrev = prev != null && prev !== 0 ? (chg / prev) * 100 : null;
          var vsOpen = bar.open !== 0 ? ((bar.close - bar.open) / bar.open) * 100 : null;
          var amp = prev != null && prev !== 0 ? ((bar.high - bar.low) / prev) * 100 : (bar.open !== 0 ? ((bar.high - bar.low) / bar.open) * 100 : null);
          var m = macdByTime[param.time] || null;
          var cls = chg != null && chg >= 0 ? 'up' : 'down';
          var sign = chg != null && chg >= 0 ? '+' : '';
          var signP = vsPrev != null && vsPrev >= 0 ? '+' : '';
          var sigTxt = '';
          var allMarks = (data.markers || []);
          for (var i = 0; i < allMarks.length; i++) {
            if (allMarks[i].time === param.time) { sigTxt = markerText(allMarks[i].text); break; }
          }
          var html =
            '<div class="tt-date">' + escHtml(param.time) + '</div>' +
            '<div class="tt-row">' + t('open') + ' <span class="tt-num">' + fmtNum(bar.open) + '</span>　' + t('high') + ' <span class="tt-num">' + fmtNum(bar.high) + '</span></div>' +
            '<div class="tt-row">' + t('low') + ' <span class="tt-num">' + fmtNum(bar.low) + '</span>　' + t('close') + ' <span class="tt-num">' + fmtNum(bar.close) + '</span></div>';
          if (chg != null && vsPrev != null) {
            html += '<div class="tt-row">' + t('chg') + ' <span class="tt-num ' + cls + '">' + sign + fmtNum(chg) + '</span>　' + t('chgPct') + ' <span class="tt-num ' + cls + '">' + signP + fmtNum(vsPrev) + '%</span></div>';
          }
          if (vsOpen != null) {
            html += '<div class="tt-row">' + t('vsOpen') + ' <span class="tt-num ' + (vsOpen >= 0 ? 'up' : 'down') + '">' + (vsOpen >= 0 ? '+' : '') + fmtNum(vsOpen) + '%</span></div>';
          }
          if (amp != null) html += '<div class="tt-row">' + t('amplitude') + ' <span class="tt-num">' + fmtNum(amp) + '%</span></div>';
          var volV = candles[idx] ? candles[idx].volume : null;
          html += '<div class="tt-row">' + t('vol') + ' <span class="tt-num">' + fmtVol(volV) + '</span></div>';
          [14, 28, 57].forEach(function (n) {
            var v = state.maCache && state.maCache[n] && state.maCache[n][idx];
            if (v != null) html += '<div class="tt-row">MA' + n + ' <span class="tt-num">' + fmtNum(v) + '</span></div>';
          });
          if (m) {
            html += '<div class="tt-row">MACD DIF <span class="tt-num">' + fmtNum(m.dif, 3) + '</span>　DEA <span class="tt-num">' + fmtNum(m.dea, 3) + '</span></div>' +
              '<div class="tt-row">MACD ' + t('macdHist') + ' <span class="tt-num ' + (m.bar >= 0 ? 'up' : 'down') + '">' + fmtNum(m.bar, 3) + '</span></div>';
          }
          if (sigTxt) html += '<div class="tt-row">' + t('signal') + ' <span class="tt-num">' + escHtml(sigTxt) + '</span></div>';
          tooltip.innerHTML = html;
          tooltip.hidden = false;
          var cw = wrap.clientWidth, ch = wrap.clientHeight;
          tooltip.style.visibility = 'hidden'; tooltip.style.left = '0'; tooltip.style.top = '0';
          var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
          tooltip.style.visibility = '';
          var left = param.point.x + 14;
          var top = param.point.y - th - 10;
          if (left + tw > cw) left = param.point.x - tw - 14;
          if (top < 4) top = param.point.y + 14;
          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
        };
        chart.subscribeCrosshairMove(state.tooltipHandler);
      }

      function renderVol(data) {
        var el = $('chart-vol');
        el.innerHTML = '';
        var chart = createChart(el, 140);
        state.volChart = chart;
        state.volSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false });
        state.volSeries.setData(data.candles.map(function (c) {
          return {
            time: c[0], value: +c[5],
            color: (+c[2] >= +c[1]) ? 'rgba(240,58,82,0.55)' : 'rgba(0,181,120,0.55)',
          };
        }));
        chart.timeScale().fitContent();
      }

      function renderRsi(data) {
        var el = $('chart-rsi');
        el.innerHTML = '';
        var chart = createChart(el, 140);
        state.rsiChart = chart;
        state.rsiSeries = chart.addLineSeries({ color: '#ab6dfe', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
        var times = data.candles.map(function (c) { return c[0]; });
        state.rsiSeries.setData(data.rsi.map(function (v, i) { return { time: times[i], value: v }; }).filter(function (p) { return p.value !== null && !Number.isNaN(p.value); }));
        [30, 70].forEach(function (lv) {
          var ref = chart.addLineSeries({ color: 'rgba(139,148,158,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, lineStyle: 2 });
          ref.setData(times.map(function (tm) { return { time: tm, value: lv }; }));
        });
        try { chart.priceScale('right').applyOptions({ minValue: 0, maxValue: 100 }); } catch (e) {}
        chart.timeScale().fitContent();
      }

      function renderLegend() {
        var el = $('signal-legend');
        if (!el) return;
        var items = [
          { color: '#22c55e', label: t('lgBase') },
          { color: '#38bdf8', label: t('lgBottom') },
          { color: '#ff3d5c', label: t('lgStrong') },
          { color: '#ffb300', label: t('lgCaution') },
          { color: '#00e5ff', label: t('lgWeak') },
          { color: '#ff1744', label: t('lgHigh') },
        ];
        var html = items.map(function (it) {
          return '<span class="lg-item"><span class="lg-dot" style="background:' + it.color + '"></span>' + escHtml(it.label) + '</span>';
        }).join('');
        html += '<span class="lg-item"><span class="lg-arrow" style="color:#ff1744">▲</span>' + escHtml(t('legendGc')) + '</span>';
        html += '<span class="lg-item"><span class="lg-arrow" style="color:#00e676">▼</span>' + escHtml(t('legendDc')) + '</span>';
        el.innerHTML = html;
      }

      function renderQuote(q) {
        var el = $('quote');
        if (!q) { el.innerHTML = '<span class="err">' + escHtml(t('quoteFail')) + '</span>'; return; }
        var cls = (q.pct >= 0) ? 'up' : 'down';
        var arrow = (q.pct >= 0) ? '▲' : '▼';
        el.innerHTML =
          '<span class="name">' + escHtml(q.name || q.symbol) + ' <span class="muted">' + escHtml(q.symbol) + '</span></span>' +
          '<span class="price ' + cls + '">' + fmtNum(q.price) + ' ' + escHtml(q.currency || '') + '</span>' +
          '<span class="' + cls + '">' + arrow + ' ' + fmtNum(q.change) + ' (' + fmtNum(q.pct) + '%)</span>' +
          '<span class="muted">' + t('open') + ' ' + fmtNum(q.open) + ' · ' + t('high') + ' ' + fmtNum(q.high) + ' · ' + t('low') + ' ' + fmtNum(q.low) + '</span>' +
          '<span class="muted">' + t('prev') + ' ' + fmtNum(q.prev_close) + ' · ' + t('vol') + ' ' + fmtVol(q.volume) + '</span>' +
          '<span class="muted">' + escHtml(q.time || '') + '</span>';
      }

      function applyLang() {
        document.documentElement.lang = state.lang === 'zh' ? 'zh' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
        document.querySelectorAll('#lang-switch button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-lang') === state.lang);
        });
        renderLegend();
        if (state.lastQuote) renderQuote(state.lastQuote);
        if (state.last) rerenderCharts();
      }

      function rerenderCharts() {
        if (!state.last) return;
        var data = state.last;
        disposeCharts();
        $('chart-main').innerHTML = '<div class="loading">' + escHtml(t('loading')) + '</div>';
        $('chart-vol').innerHTML = '<div class="loading">' + escHtml(t('loading')) + '</div>';
        $('chart-rsi').innerHTML = '<div class="loading">' + escHtml(t('loading')) + '</div>';
        renderMain(data);
        renderVol(data);
        renderRsi(data);
      }

      function load() {
        $('err').textContent = '';
        $('quote').innerHTML = '<div class="loading">' + escHtml(t('loading')) + '</div>';
        var symbol = state.symbol;
        var p = state.period;
        renderLegend();
        Promise.all([
          fetch('/api/quote?symbol=' + encodeURIComponent(symbol)).then(function (r) { return r.json(); }),
          fetch('/api/signals?symbol=' + encodeURIComponent(symbol) + '&period=' + p).then(function (r) { return r.json(); }),
        ]).then(function (res) {
          var qj = res[0], sj = res[1];
          if (sj.code === 0 && sj.data && sj.data.candles && sj.data.candles.length) {
            state.last = sj.data;
            disposeCharts();
            renderMain(sj.data);
            renderVol(sj.data);
            renderRsi(sj.data);
          } else {
            throw new Error((sj && sj.msg) || 'signals failed');
          }
          if (qj.code === 0 && qj.data) {
            state.lastQuote = qj.data;
            renderQuote(qj.data);
          } else {
            state.lastQuote = null;
            renderQuote(null);
          }
        }).catch(function (e) {
          $('err').textContent = t('loadFail') + e.message;
        });
      }

      // events
      $('go').addEventListener('click', function () {
        var s = $('symbol').value.trim().toUpperCase();
        if (s && s !== state.symbol) { state.symbol = s; load(); }
      });
      $('symbol').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
      $('refresh').addEventListener('click', load);
      document.querySelectorAll('#lang-switch button').forEach(function (b) {
        b.addEventListener('click', function () {
          var l = b.getAttribute('data-lang');
          if (l === state.lang) return;
          state.lang = l;
          try { localStorage.setItem('markets_lang', l); } catch (e) {}
          applyLang();
        });
      });
      document.querySelectorAll('button[data-period]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('button[data-period]').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          state.period = b.getAttribute('data-period');
          load();
        });
      });
      document.querySelectorAll('.samples button[data-symbol]').forEach(function (b) {
        b.addEventListener('click', function () {
          state.symbol = b.getAttribute('data-symbol');
          $('symbol').value = state.symbol;
          load();
        });
      });

      var params = new URLSearchParams(location.search);
      if (params.get('symbol')) {
        state.symbol = params.get('symbol').toUpperCase();
        $('symbol').value = state.symbol;
      }
      applyLang();
      load();
    })();
  </script>
</body>
</html>

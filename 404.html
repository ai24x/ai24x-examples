<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - AI24X</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .error-container {
            max-width: 600px;
            padding: 40px;
        }
        
        h1 {
            font-size: 120px;
            margin: 0;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        h2 {
            font-size: 32px;
            margin: 20px 0;
        }
        
        p {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .home-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
        }
        
        .links {
            margin-top: 30px;
        }
        
        .links a {
            color: #00d4ff;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>页面未找到</h2>
        <p>抱歉，您访问的页面不存在或已被移动。</p>
        <a href="/" class="home-btn">返回首页</a>
        
        <div class="links">
            <p>或者访问其他页面：</p>
            <a href="/tools">AI工具库</a>
            <a href="/tutorials">热门教程</a>
            <a href="/custom">定制开发</a>
        </div>
    </div>
</body>
</html>

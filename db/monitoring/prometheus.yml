# AI24X海外节点监控配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: 'singapore'
    environment: 'production'
    node: 'subbrain04'

# 告警规则文件
rule_files:
  - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    labels:
      service: 'prometheus'

  # 节点导出器（服务器资源监控）
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    labels:
      service: 'node_exporter'
      role: 'infrastructure'

  # Docker容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    labels:
      service: 'cadvisor'
      role: 'container'

  # PostgreSQL数据库监控
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']
    labels:
      service: 'postgresql'
      role: 'database'
    metrics_path: /metrics
    params:
      dsn: ['postgresql://ai24x_admin:${POSTGRES_PASSWORD}@postgresql:5432/ai24x_production?sslmode=disable']

  # Redis监控
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']
    labels:
      service: 'redis'
      role: 'cache'

  # Nginx监控
  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']
    labels:
      service: 'nginx'
      role: 'load_balancer'

  # 后端应用监控
  - job_name: 'ai24x_backend'
    static_configs:
      - targets: ['backend:8000']
    labels:
      service: 'ai24x_backend'
      role: 'application'
    metrics_path: /metrics

  # 黑盒监控（外部健康检查）
  - job_name: 'blackbox_exporter'
    static_configs:
      - targets:
        - 'https://ai24x.com/health'
        - 'https://api.ai24x.com/health'
        - 'https://cdn.ai24x.com/'
    labels:
      service: 'blackbox'
      role: 'external_check'
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# 远程写入配置（可选：用于长期存储）
remote_write:
  - url: 'https://prometheus-central.example.com/api/v1/write'
    basic_auth:
      username: '${PROMETHEUS_REMOTE_USER}'
      password: '${PROMETHEUS_REMOTE_PASSWORD}'
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 5000

# 远程读取配置（可选）
remote_read:
  - url: 'https://prometheus-central.example.com/api/v1/read'
    basic_auth:
      username: '${PROMETHEUS_REMOTE_USER}'
      password: '${PROMETHEUS_REMOTE_PASSWORD}'
    read_recent: true
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工具库 - AI24X</title>
    <style>
        /* 工具页面专用样式 */
        .tools-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .tools-header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .tools-header h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        
        .tools-header p {
            color: #a0aec0;
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }
        
        .search-box {
            max-width: 600px;
            margin: 30px auto;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 10px;
        }
        
        .tools-stats {
            color: #a0aec0;
            font-size: 1rem;
            margin-top: 20px;
        }
        
        .tools-stats span {
            color: #00d4ff;
            font-weight: 600;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .tool-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .tool-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .tool-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        
        .tool-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
        }
        
        .tool-description {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 60px;
        }
        
        .tool-category {
            display: inline-block;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tool-tag {
            background: rgba(255, 255, 255, 0.05);
            color: #a0aec0;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
        }
        
        .tool-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
        
        .tool-rating {
            color: #fbbf24;
            font-size: 0.9rem;
        }
        
        .tool-link {
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .tool-link:hover {
            color: #0099ff;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
            grid-column: 1 / -1;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .tools-header h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            .tools-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="tools-container">
            <div class="tools-header">
                <h1>AI工具库</h1>
                <p>探索精选的AI工具，涵盖文本生成、图像创作、编程辅助等多个领域</p>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索工具名称、功能或描述...">
                    <button id="searchBtn" class="search-btn">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
                
                <div class="tools-stats">
                    共找到 <span id="totalTools">0</span> 个工具，显示 <span id="toolsCount">0</span> 个
                </div>
            </div>
            
            <div class="tools-grid" id="toolsGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载AI工具数据...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 简化的工具数据生成函数
        function generateAIToolsData() {
            return [
                {
                    id: 1,
                    name: "ChatGPT",
                    description: "OpenAI开发的对话式AI助手，支持文本生成、代码编写、问题解答等",
                    category: "文本生成",
                    tags: ["对话", "写作", "编程"],
                    icon: "fa fa-comments",
                    rating: 4.9,
                    link: "https://chat.openai.com"
                },
                {
                    id: 2,
                    name: "Midjourney",
                    description: "AI图像生成工具，通过文本描述创建高质量的艺术作品和图像",
                    category: "图像创作",
                    tags: ["艺术", "设计", "创意"],
                    icon: "fa fa-palette",
                    rating: 4.8,
                    link: "https://www.midjourney.com"
                },
                {
                    id: 3,
                    name: "GitHub Copilot",
                    description: "AI编程助手，在编写代码时提供智能建议和自动补全",
                    category: "编程辅助",
                    tags: ["开发", "代码", "效率"],
                    icon: "fa fa-code",
                    rating: 4.7,
                    link: "https://github.com/features/copilot"
                },
                {
                    id: 4,
                    name: "DALL-E 3",
                    description: "OpenAI的图像生成模型，根据文本提示创建逼真的图像和艺术作品",
                    category: "图像创作",
                    tags: ["AI绘画", "创意", "设计"],
                    icon: "fa fa-image",
                    rating: 4.8,
                    link: "https://openai.com/dall-e-3"
                },
                {
                    id: 5,
                    name: "Claude",
                    description: "Anthropic开发的AI助手，专注于安全、有帮助的对话",
                    category: "文本生成",
                    tags: ["对话", "写作", "分析"],
                    icon: "fa fa-brain",
                    rating: 4.7,
                    link: "https://claude.ai"
                },
                {
                    id: 6,
                    name: "Stable Diffusion",
                    description: "开源的文本到图像生成模型，支持本地部署和自定义训练",
                    category: "图像创作",
                    tags: ["开源", "本地", "定制"],
                    icon: "fa fa-cogs",
                    rating: 4.6,
                    link: "https://stability.ai"
                },
                {
                    id: 7,
                    name: "Notion AI",
                    description: "集成在Notion中的AI助手，帮助写作、总结和头脑风暴",
                    category: "生产力",
                    tags: ["笔记", "写作", "组织"],
                    icon: "fa fa-book",
                    rating: 4.5,
                    link: "https://www.notion.so/product/ai"
                },
                {
                    id: 8,
                    name: "Grammarly",
                    description: "AI写作助手，检查语法、拼写和写作风格",
                    category: "写作辅助",
                    tags: ["语法", "校对", "写作"],
                    icon: "fa fa-check",
                    rating: 4.7,
                    link: "https://www.grammarly.com"
                }
            ];
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('AI工具库页面初始化...');
            
            // 生成工具数据
            const tools = generateAIToolsData();
            
            // 获取DOM元素
            const toolsGrid = document.getElementById('toolsGrid');
            const totalTools = document.getElementById('totalTools');
            const toolsCount = document.getElementById('toolsCount');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            // 清空加载状态
            toolsGrid.innerHTML = '';
            
            // 渲染工具卡片
            tools.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="tool-icon">
                        <i class="${tool.icon}"></i>
                    </div>
                    <div class="tool-title">${tool.name}</div>
                    <div class="tool-description">${tool.description}</div>
                    <div class="tool-category">${tool.category}</div>
                    <div class="tool-tags">
                        ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="tool-footer">
                        <div class="tool-rating">
                            ${'★'.repeat(Math.floor(tool.rating))}${tool.rating.toFixed(1)}
                        </div>
                        <a href="${tool.link}" target="_blank" class="tool-link">
                            访问工具 <i class="fa fa-arrow-right"></i>
                        </a>
                    </div>
                `;
                toolsGrid.appendChild(card);
            });
            
            // 更新统计信息
            totalTools.textContent = tools.length;
            toolsCount.textContent = tools.length;
            
            // 搜索功能
            function performSearch() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const cards = document.querySelectorAll('.tool-card');
                let visibleCount = 0;
                
                cards.forEach(card => {
                    const title = card.querySelector('.tool-title').textContent.toLowerCase();
                    const description = card.querySelector('.tool-description').textContent.toLowerCase();
                    const category = card.querySelector('.tool-category').textContent.toLowerCase();
                    const tags = Array.from(card.querySelectorAll('.tool-tag')).map(tag => tag.textContent.toLowerCase());
                    
                    const matches = title.includes(searchTerm) || 
                                   description.includes(searchTerm) || 
                                   category.includes(searchTerm) ||
                                   tags.some(tag => tag.includes(searchTerm));
                    
                    card.style.display = matches ? 'block' : 'none';
                    if (matches) visibleCount++;
                });
                
                toolsCount.textContent = visibleCount;
            }
            
            // 绑定搜索事件
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });
            
            // 输入时实时搜索（防抖）
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(performSearch, 300);
            });
        });
    </script>
</body>
</html>

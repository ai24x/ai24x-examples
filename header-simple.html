<!-- 移动端菜单功能 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mainNav = document.querySelector('.main-nav');
    
    if (mobileMenuBtn && mainNav) {
        mobileMenuBtn.addEventListener('click', function() {
            mainNav.classList.toggle('active');
            mobileMenuBtn.innerHTML = mainNav.classList.contains('active') 
                ? '<i class="fas fa-times"></i>' 
                : '<i class="fas fa-bars"></i>';
        });
        
        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.main-nav') && !e.target.closest('.mobile-menu-btn')) {
                mainNav.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });
        
        // ESC键关闭菜单
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mainNav.classList.contains('active')) {
                mainNav.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });
    }
    
    // 窗口大小变化时重置菜单
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            const mainNav = document.querySelector('.main-nav');
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            
            if (mainNav) {
                mainNav.classList.remove('active');
            }
            
            if (mobileMenuBtn) {
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        }
    });
    
    // 全局搜索功能
    const globalSearch = document.getElementById('globalSearch');
    const searchBtn = document.querySelector('.search-box .search-btn');
    
    if (globalSearch && searchBtn) {
        function performGlobalSearch() {
            const query = globalSearch.value.trim();
            if (query) {
                // 如果当前在tools页面，使用页面内搜索
                if (window.location.pathname.includes('/tools')) {
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) {
                        searchInput.value = query;
                        searchInput.dispatchEvent(new Event('input'));
                    }
                } else {
                    // 否则跳转到tools页面搜索
                    window.location.href = `/tools?search=${encodeURIComponent(query)}`;
                }
            }
        }
        
        searchBtn.addEventListener('click', performGlobalSearch);
        globalSearch.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                performGlobalSearch();
            }
        });
    }
});
</script>

<!-- 头部样式增强 -->
<style>
/* 导航链接激活状态 */
.nav-link.active {
    color: #00d4ff !important;
    position: relative;
}

.nav-link.active::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, #00d4ff, #0099ff);
    border-radius: 1px;
}

/* 搜索框样式 */
.search-box {

    margin-right: 15px;
}

.search-box input {
    width: 200px;
    padding: 8px 15px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 8px;
    color: white;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.search-box input:focus {

    border-color: #00d4ff;
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    width: 250px;
}

.search-box .search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);

    border: none;
    color: #00d4ff;
    cursor: pointer;
    font-size: 1rem;
}

/* 响应式调整 */
@media (max-width: 768px) {
    .search-box {
        display: none; /* 移动端隐藏搜索框 */
    }
    
    .auth-buttons {
        display: none; /* 移动端隐藏登录注册 */
    }
    
    .main-nav {
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: 20px;
        transform: translateY(-100%);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 999;
    }
    
    .main-nav.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
    }
    
    .main-nav ul {
        flex-direction: column;
        gap: 15px;
    }

    }
}

}
</style>

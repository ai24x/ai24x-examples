<!-- 统一头部导航 -->
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <a href="/">
                    <i class="fas fa-robot"></i>
                    <span>AI24X</span>
                </a>
            </div>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="/" class="nav-link"><i class="fas fa-home"></i> <span class="nav-text">首页</span></a></li>
                    <li><a href="/tools" class="nav-link"><i class="fas fa-tools"></i> <span class="nav-text">AI工具库</span></a></li>
                    <li><a href="/tutorials" class="nav-link"><i class="fas fa-chart-line"></i> <span class="nav-text">热门教程</span></a></li>
                    <li><a href="/custom" class="nav-link"><i class="fas fa-cogs"></i> <span class="nav-text">定制开发</span></a></li>
                </ul>
            </nav>
            
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" placeholder="搜索AI工具..." id="globalSearch">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <div class="auth-buttons">
                    <a href="/login" class="btn btn-outline"><i class="fas fa-sign-in-alt"></i> 登录</a>
                    <a href="/signup" class="btn btn-primary"><i class="fas fa-user-plus"></i> 注册</a>
                </div>
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </div>
</header>

<!-- 头部导航功能脚本 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 设置当前页面激活状态
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
        const linkPath = link.getAttribute('href');
        if (currentPath === linkPath || (currentPath === '/' && linkPath === '/')) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });
    
    // 全局搜索功能
    const globalSearch = document.getElementById('globalSearch');
    const searchBtn = document.querySelector('.header-actions .search-btn');
    
    if (globalSearch && searchBtn) {
        function performGlobalSearch() {
            const query = globalSearch.value.trim();
            if (query) {
                window.location.href = `/tools?search=${encodeURIComponent(query)}`;
            }
        }
        
        searchBtn.addEventListener('click', performGlobalSearch);
        globalSearch.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                performGlobalSearch();
            }
        });
    }
    
    // 移动端菜单切换
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mainNav = document.querySelector('.main-nav');
    
    if (mobileMenuBtn && mainNav) {
        mobileMenuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            mainNav.classList.toggle('active');
            mobileMenuBtn.innerHTML = mainNav.classList.contains('active') 
                ? '<i class="fas fa-times"></i>' 
                : '<i class="fas fa-bars"></i>';
        });
        
        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.main-nav') && !e.target.closest('.mobile-menu-btn')) {
                mainNav.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });
        
        // ESC键关闭菜单
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && mainNav.classList.contains('active')) {
                mainNav.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });
    }
    
    // 窗口大小变化时重置菜单
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            const mainNav = document.querySelector('.main-nav');
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            
            if (mainNav) {
                mainNav.classList.remove('active');
            }
            
            if (mobileMenuBtn) {
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            }
        }
    });
});
</script>
